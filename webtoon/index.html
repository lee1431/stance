<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101015"><title>STANCE WEBTOON | 연재만화</title>
<style>
:root{color-scheme:dark;--bg:#101015;--panel:#1c1c25;--muted:#a5a5b5;--line:#353540;--accent:#ff657e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f8fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.wrap{max-width:1080px;margin:auto;padding:0 20px}header{border-bottom:1px solid var(--line);position:sticky;top:0;background:#101015ed;backdrop-filter:blur(12px);z-index:10}.top{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.07em}.brand span{color:var(--accent)}.muted{color:var(--muted)}.hero{padding:60px 0 35px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.14em;font-size:12px}h1{font-size:clamp(32px,6vw,54px);margin:12px 0}h2{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin:24px 0 70px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .2s}.card:hover{transform:translateY(-3px)}.cover{aspect-ratio:3/4;background:linear-gradient(145deg,#342437,#101015);display:flex;align-items:center;justify-content:center;font-size:55px}.cover img{width:100%;height:100%;object-fit:cover}.info{padding:17px}.info h3{margin:0 0 7px}.info p{font-size:14px;line-height:1.5}.pill{display:inline-block;background:#39242c;color:#ff9caf;border-radius:99px;padding:5px 9px;font-size:12px}.back{display:inline-block;margin:26px 0;color:var(--muted)}.detail{display:flex;gap:24px;margin:10px 0 35px}.detail .cover{width:210px;flex-shrink:0;border-radius:12px;overflow:hidden}.episodes{list-style:none;padding:0;margin:18px 0 70px}.episodes li{border-bottom:1px solid var(--line)}.episodes a{display:flex;align-items:center;justify-content:space-between;padding:19px 8px;gap:12px}.episodes a:hover{background:var(--panel)}.viewer{max-width:760px;margin:auto}.viewer img{display:block;width:100%;height:auto}.viewer-head{text-align:center;padding:28px 16px}.viewer-nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:30px 12px 60px}.btn{border:1px solid var(--line);border-radius:9px;padding:12px 18px;background:var(--panel)}.btn.primary{background:var(--accent);color:#101015;font-weight:800;border-color:var(--accent)}.empty{border:1px dashed var(--line);border-radius:12px;padding:35px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:13px} @media(max-width:600px){.detail{flex-direction:column}.detail .cover{width:150px}.hero{padding-top:38px}}
</style></head><body>
<header><div class="wrap top"><a class="brand" href="./">STANCE <span>WEBTOON</span></a><a class="muted" href="/">STANCE 홈</a></div></header><main id="app" class="wrap" aria-live="polite"></main><footer><div class="wrap">© STANCE · 독립 웹툰 연재 플랫폼</div></footer>
<script>
const app=document.getElementById('app');let catalog=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=(id,ep)=>'#/'+encodeURIComponent(id)+(ep?'/'+encodeURIComponent(ep):'');
const safeSrc=s=>{try{let u=new URL(s,location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
function cover(w){let src=safeSrc(w.cover);return '<div class="cover">'+(src?'<img src="'+esc(src)+'" alt="'+esc(w.title)+' 표지" loading="lazy">':'📖')+'</div>'}
function home(){document.title='STANCE WEBTOON | 연재만화';app.innerHTML='<section class="hero"><div class="eyebrow">ORIGINAL STORIES</div><h1>이야기는 계속된다.</h1><p class="muted">독립 창작 웹툰을 세로 스크롤로 감상하세요.</p></section><h2>연재 작품</h2>'+(catalog.length?'<div class="grid">'+catalog.map(w=>'<a class="card" href="'+url(w.id)+'">'+cover(w)+'<div class="info"><span class="pill">'+esc(w.status||'연재중')+'</span><h3>'+esc(w.title)+'</h3><p class="muted">'+esc(w.description||'')+'</p><small class="muted">'+(w.episodes||[]).filter(e=>e.published).length+'화 공개</small></div></a>').join('')+'</div>':'<div class="empty">아직 공개된 작품이 없습니다.</div>')}
function detail(w){document.title=w.title+' | STANCE WEBTOON';let eps=(w.episodes||[]).filter(e=>e.published).sort((a,b)=>Number(b.number)-Number(a.number));app.innerHTML='<a class="back" href="#/">← 작품 목록</a><div class="detail">'+cover(w)+'<div><span class="pill">'+esc(w.status||'연재중')+'</span><h1>'+esc(w.title)+'</h1><p class="muted">'+esc(w.author||'STANCE')+'</p><p>'+esc(w.description||'')+'</p></div></div><h2>회차 목록</h2>'+(eps.length?'<ul class="episodes">'+eps.map(e=>'<li><a href="'+url(w.id,e.id)+'"><strong>'+esc(e.number)+'화 · '+esc(e.title)+'</strong><span class="muted">'+esc(e.date||'')+' →</span></a></li>').join('')+'</ul>':'<div class="empty">공개된 회차가 없습니다.</div>')}
function reader(w,e){let eps=(w.episodes||[]).filter(x=>x.published).sort((a,b)=>Number(a.number)-Number(b.number)),i=eps.findIndex(x=>x.id===e.id);if(i<0)return notfound();document.title=e.title+' | '+w.title;let images=(e.images||[]).map(safeSrc).filter(Boolean);app.innerHTML='<div class="viewer-head"><a class="back" href="'+url(w.id)+'">← '+esc(w.title)+'</a><h2>'+esc(e.number)+'화 · '+esc(e.title)+'</h2></div><article class="viewer">'+(images.length?images.map((src,j)=>'<img src="'+esc(src)+'" alt="'+esc(e.title)+' '+(j+1)+'번째 컷" loading="'+(j<2?'eager':'lazy')+'" decoding="async">').join(''):'<div class="empty">등록된 이미지가 없습니다.</div>')+'</article><nav class="viewer-nav">'+(i>0?'<a class="btn" href="'+url(w.id,eps[i-1].id)+'">← 이전 화</a>':'')+'<a class="btn" href="'+url(w.id)+'">회차 목록</a>'+(i<eps.length-1?'<a class="btn primary" href="'+url(w.id,eps[i+1].id)+'">다음 화 →</a>':'')+'</nav>';try{localStorage.setItem('stance-webtoon-progress:'+w.id,e.id)}catch{}}
function notfound(){app.innerHTML='<div class="empty" style="margin:70px 0">페이지를 찾을 수 없습니다.<p><a href="#/">작품 목록으로 돌아가기 →</a></p></div>'}
function route(){let parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent),w=catalog.find(x=>x.id===parts[0]);if(!parts.length)home();else if(!w)notfound();else if(parts.length===1)detail(w);else{let e=(w.episodes||[]).find(x=>x.id===parts[1]&&x.published);e?reader(w,e):notfound()}window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
fetch('./works.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog');return r.json()}).then(data=>{catalog=Array.isArray(data.works)?data.works.filter(w=>w.published):[];route()}).catch(()=>{app.innerHTML='<div class="empty" style="margin:70px 0">작품 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>'});
</script></body></html>
