# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Temporary recovery of a Pages deployment that is stuck "in progress".
      - name: Inspect and release stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="21e35badd9ce9c8d7d35e9866867ec0320f62b84"
          endpoint="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments/$target"
          code=$(curl -sSL -o /tmp/dsd-pages-deployment.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$endpoint")
          echo "Stale Pages deployment HTTP status: $code"
          if [ "$code" = "200" ]; then
            state=$(python3 -c 'import json; print(json.load(open("/tmp/dsd-pages-deployment.json")).get("status","unknown"))')
            echo "Stale Pages deployment state: $state"
            if [ "$state" != "succeed" ] && [ "$state" != "deployment_cancelled" ]; then
              cancelled=$(curl -sSL -X POST -o /tmp/dsd-pages-cancel.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$endpoint/cancel")
              echo "Pages cancel HTTP status: $cancelled"
              if [ "$cancelled" != "204" ]; then
                echo "::warning::Pages deployment cancellation was rejected"
                cat /tmp/dsd-pages-cancel.json
              fi
            fi
          else
            echo "::warning::Unable to inspect stale Pages deployment"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
