name: DDSM tests
on:
  push:
    branches: [main, ddsm-center-loginless, ddsm-mobile-app-ui]
    paths: ['ddsm/**', '.github/workflows/ddsm-tests.yml']
  pull_request:
    paths: ['ddsm/**', '.github/workflows/ddsm-tests.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ddsm/api/requirements.txt
      - run: python -m py_compile ddsm/api/app.py ddsm/api/admin.py ddsm/api/driver.py ddsm/api/test_api.py
      - run: python -m unittest -v test_api
        working-directory: ddsm/api
      - run: |
          node --check ddsm/app.js
          node --check ddsm/admin/admin.js
          node --check ddsm/delivery-map.js
          node --check ddsm/connect/connect.js
      - run: python ddsm/test_ui_contract.py

      - run: npm install --no-save --no-package-lock --prefix /tmp/ddsm-ui jsdom@26
      - run: NODE_PATH=/tmp/ddsm-ui/node_modules node ddsm/test_ui_smoke.cjs
