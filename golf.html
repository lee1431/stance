<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="data:,">
  <title>QR Google 인증 테스트 (슬라이더 배경)</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      touch-action: manipulation;
    }

    /* 슬라이더 배경 영역 */
    #slider {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 900ms ease-in-out;
      pointer-events: none;
    }

    .slide.is-active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .loading, .empty-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      padding: 40px;
    }

    /* 전면 UI 영역 (QR 카드) */
    #ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.4); /* 슬라이더 위 어두운 오버레이 */
    }

    .card {
      width: min(520px, 100%);
      padding: 34px 28px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      text-align: center;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      letter-spacing: -0.04em;
      color: #fff;
    }

    p {
      margin: 0 0 24px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 68px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.985);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .qr-wrap {
      display: none;
      margin-top: 28px;
    }

    .qr-box {
      width: 280px;
      height: 280px;
      margin: 0 auto 18px;
      padding: 16px;
      border-radius: 24px;
      background: white;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .status {
      min-height: 26px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      font-weight: 800;
    }

    .link {
      margin-top: 12px;
      font-size: 13px;
      word-break: break-all;
      color: rgba(255, 255, 255, 0.45);
    }
  </style>
</head>

<body>
  <div id="slider">
    <div class="loading">이벤트 이미지를 불러오는 중입니다.</div>
  </div>

  <div id="ui-layer">
    <main class="card">
      <h1>QR Google 인증 테스트</h1>
      <p>
        버튼을 누르면 QR이 생성됩니다.<br>
        스마트폰 인증이 끝나면 태블릿이 자동으로 카드 페이지로 이동합니다.
      </p>

      <button id="startButton" type="button">QR 생성하기</button>

      <section id="qrWrap" class="qr-wrap">
        <div class="qr-box">
          <img id="qrImage" alt="QR 코드" />
        </div>
        <div id="status" class="status">QR 생성을 기다리는 중입니다.</div>
        <div id="rawLink" class="link"></div>
      </section>
    </main>
  </div>

  <script>
    // ==========================================
    // 1. 이미지 슬라이더 로직
    // ==========================================
    const CONFIG_JSON_URL = "https://mrdindoin.ddns.net/jsonhub/api/json/localflow/event";
    const DEFAULT_ROTATION_INTERVAL = 5000;
    const JSON_RELOAD_INTERVAL = 60000;

    const slider = document.getElementById("slider");
    let slides = [];
    let currentIndex = 0;
    let sliderTimer = null;
    let jsonReloadTimer = null;
    let rotationInterval = DEFAULT_ROTATION_INTERVAL;
    let lastConfigSignature = "";

    async function loadEventConfig() {
      try {
        const url = `${CONFIG_JSON_URL}?t=${Date.now()}`;
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(`JSON 로딩 실패: ${response.status}`);
        
        const config = await response.json();
        applyConfig(config);
      } catch (error) {
        console.error(error);
        if (slides.length === 0) {
          renderEmptyMessage("이벤트 정보를 불러오지 못했습니다.");
        }
      }
    }

    function applyConfig(config) {
      const rawSlides = Array.isArray(config.slides) ? config.slides : [];
      const enabledSlides = rawSlides
        .filter((slide) => slide && slide.enabled !== false && slide.imageUrl)
        .sort((a, b) => Number(a.sort || 0) - Number(b.sort || 0))
        .map((slide, index) => ({
          imageUrl: String(slide.imageUrl),
          alt: String(slide.alt || slide.title || `이벤트 이미지 ${index + 1}`)
        }));

      const signature = JSON.stringify({
        interval: config.rotationInterval,
        slides: enabledSlides
      });

      if (signature === lastConfigSignature) return;
      lastConfigSignature = signature;
      
      rotationInterval = Number(config.rotationInterval || DEFAULT_ROTATION_INTERVAL);
      renderSlides(enabledSlides);
      startSlider();
    }

    function renderSlides(slideItems) {
      stopSlider();
      if (!slideItems.length) {
        renderEmptyMessage("등록된 이벤트 이미지가 없습니다.");
        return;
      }

      slider.innerHTML = "";
      slideItems.forEach((item, index) => {
        const slide = document.createElement("div");
        slide.className = "slide";
        if (index === 0) slide.classList.add("is-active");

        const img = document.createElement("img");
        img.src = item.imageUrl;
        img.alt = item.alt;
        img.draggable = false;
        img.decoding = "async";
        img.loading = index === 0 ? "eager" : "lazy";

        slide.appendChild(img);
        slider.appendChild(slide);
      });

      slides = Array.from(document.querySelectorAll(".slide"));
      currentIndex = 0;
      
      slideItems.forEach((item) => {
        const image = new Image();
        image.src = item.imageUrl;
      });
    }

    function renderEmptyMessage(message) {
      stopSlider();
      slides = [];
      currentIndex = 0;
      slider.innerHTML = `<div class="empty-message">${message}</div>`;
    }

    function showSlide(nextIndex) {
      if (slides.length <= 1 || !slides[currentIndex] || !slides[nextIndex]) return;
      slides[currentIndex].classList.remove("is-active");
      slides[nextIndex].classList.add("is-active");
      currentIndex = nextIndex;
    }

    function nextSlide() {
      if (slides.length <= 1) return;
      const nextIndex = (currentIndex + 1) % slides.length;
      showSlide(nextIndex);
    }

    function startSlider() {
      stopSlider();
      if (slides.length > 1) {
        sliderTimer = window.setInterval(nextSlide, rotationInterval);
      }
    }

    function stopSlider() {
      if (sliderTimer) {
        window.clearInterval(sliderTimer);
        sliderTimer = null;
      }
    }


    // ==========================================
    // 2. QR 인증 로직
    // ==========================================
    const API_BASE = "https://localflow.ddns.net/qr/api";
    const startButton = document.getElementById("startButton");
    const qrWrap = document.getElementById("qrWrap");
    const qrImage = document.getElementById("qrImage");
    const statusEl = document.getElementById("status");
    const rawLink = document.getElementById("rawLink");

    let activeSid = null;
    let pollTimer = null;

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    async function startQr() {
      stopPolling();
      startButton.disabled = true;
      statusEl.textContent = "QR 생성 중입니다.";
      qrWrap.style.display = "block";
      rawLink.textContent = "";

      try {
        const response = await fetch(API_BASE + "/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({
            source: "github-pages-tablet-event",
            pageUrl: location.href,
            createdAt: new Date().toISOString()
          })
        });

        if (!response.ok) throw new Error("QR 생성 실패: " + response.status);

        const data = await response.json();
        if (!data.ok || !data.sid || !data.authUrl) throw new Error("응답 형식 오류");

        activeSid = data.sid;
        qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=" + encodeURIComponent(data.authUrl);
        rawLink.textContent = data.authUrl;
        statusEl.textContent = "휴대폰으로 QR을 스캔해주세요.";

        pollTimer = setInterval(checkStatus, 1500);
        checkStatus();
      } catch (error) {
        console.error(error);
        statusEl.textContent = "QR 생성에 실패했습니다.";
        startButton.disabled = false;
      }
    }

    async function checkStatus() {
      if (!activeSid) return;

      try {
        const response = await fetch(API_BASE + "/status/" + encodeURIComponent(activeSid) + "?t=" + Date.now(), {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) throw new Error("상태 확인 실패: " + response.status);
        const data = await response.json();

        if (data.status === "pending") {
          statusEl.textContent = "휴대폰 스캔을 기다리는 중입니다.";
          return;
        }

        if (data.status === "scanned") {
          statusEl.textContent = "휴대폰에서 Google 인증 화면이 열렸습니다.";
          return;
        }

        if (data.status === "authenticated") {
          statusEl.textContent = "인증 완료. 카드 선택 페이지로 이동합니다.";
          stopPolling();
          setTimeout(() => {
            location.href = data.tabletCardUrl;
          }, 700);
          return;
        }

        if (data.status === "card_selected") {
          statusEl.textContent = "카드 선택 완료!";
          stopPolling();
          startButton.disabled = false;
          return;
        }

        if (data.status === "expired") {
          statusEl.textContent = "QR이 만료되었습니다. 다시 생성해주세요.";
          stopPolling();
          startButton.disabled = false;
          return;
        }
      } catch (error) {
        console.warn(error);
      }
    }

    // ==========================================
    // 3. 초기화 이벤트 바인딩
    // ==========================================
    startButton.addEventListener("click", startQr);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        loadEventConfig();
      }
    });

    window.addEventListener("load", () => {
      loadEventConfig();
      jsonReloadTimer = window.setInterval(loadEventConfig, JSON_RELOAD_INTERVAL);
    });
  </script>
</body>
</html>
