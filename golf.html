<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRAVITY Shaft Event</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040b;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      color: #fff;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      isolation: isolate;
      display: grid;
      place-items: center;
      cursor: default;
      background:
        radial-gradient(circle at 50% 52%, rgba(90, 208, 255, 0.28), transparent 11%),
        radial-gradient(circle at 50% 50%, rgba(24, 88, 255, 0.42), transparent 22%),
        radial-gradient(circle at 75% 22%, rgba(99, 149, 255, 0.30), transparent 18%),
        radial-gradient(circle at 17% 78%, rgba(194, 133, 255, 0.16), transparent 22%),
        linear-gradient(135deg, #02040b 0%, #061024 48%, #010207 100%);
    }

    #stars {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .nebula {
      position: absolute;
      inset: -15%;
      z-index: 1;
      opacity: 0.82;
      background:
        radial-gradient(ellipse at 80% 30%, rgba(168, 219, 255, 0.22), transparent 18%),
        radial-gradient(ellipse at 24% 69%, rgba(63, 153, 255, 0.19), transparent 16%),
        radial-gradient(ellipse at 62% 72%, rgba(148, 178, 255, 0.12), transparent 19%),
        conic-gradient(from 185deg at 50% 54%, transparent 0deg, rgba(0, 137, 255, .12) 28deg, transparent 58deg, rgba(139, 84, 255, .10) 95deg, transparent 139deg, rgba(255, 221, 130, .08) 194deg, transparent 256deg, rgba(60, 170, 255, .13) 322deg, transparent 360deg);
      filter: blur(16px) saturate(1.1);
      animation: nebulaMove 19s ease-in-out infinite alternate;
      transform-origin: center;
      mix-blend-mode: screen;
    }

    .rays {
      position: absolute;
      inset: -30%;
      z-index: 2;
      opacity: 0.78;
      background:
        conic-gradient(from 90deg at 50% 50%,
          transparent 0deg,
          rgba(32, 117, 255, .30) 8deg,
          transparent 14deg,
          transparent 36deg,
          rgba(30, 213, 255, .18) 43deg,
          transparent 48deg,
          transparent 81deg,
          rgba(255, 211, 101, .13) 87deg,
          transparent 91deg,
          transparent 135deg,
          rgba(87, 98, 255, .22) 143deg,
          transparent 150deg,
          transparent 201deg,
          rgba(38, 159, 255, .18) 208deg,
          transparent 215deg,
          transparent 276deg,
          rgba(196, 92, 255, .16) 284deg,
          transparent 291deg,
          transparent 360deg);
      filter: blur(7px);
      transform: scale(1.05);
      animation: rayPulse 8s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    .mist {
      position: absolute;
      inset: -20%;
      z-index: 3;
      opacity: 0.38;
      background:
        radial-gradient(ellipse at 18% 78%, rgba(177, 213, 255, .17), transparent 19%),
        radial-gradient(ellipse at 78% 72%, rgba(189, 210, 255, .12), transparent 22%),
        radial-gradient(ellipse at 50% 85%, rgba(255, 255, 255, .08), transparent 20%);
      filter: blur(22px);
      animation: mistDrift 15s linear infinite alternate;
      mix-blend-mode: screen;
    }

    .burst {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(62vw, 760px);
      height: min(62vw, 760px);
      transform: translate(-50%, -50%);
      z-index: 4;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255,255,255,.92) 0%,
        rgba(106,216,255,.52) 8%,
        rgba(34,97,255,.25) 19%,
        transparent 42%);
      filter: blur(1px);
      opacity: .72;
      animation: burstBreath 4.5s ease-in-out infinite;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 10;
      width: min(1440px, 100vw);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 22px 36px;
    }

    .shaft-wrap {
      position: relative;
      width: min(1120px, 96vw);
      transform: translateY(-2vh);
      animation: productFloat 5.6s ease-in-out infinite;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,.55));
    }

    .shaft-wrap::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 86%;
      height: 170%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(42,170,255,.28), transparent 62%);
      filter: blur(18px);
      z-index: -1;
      animation: auraPulse 4s ease-in-out infinite;
    }

    .shaft {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      transform: perspective(1200px) rotateX(0deg) rotateY(0deg);
      filter:
        contrast(1.08)
        saturate(1.16)
        brightness(1.05)
        drop-shadow(0 0 18px rgba(58,157,255,.32));
      animation: shaftShine 3.2s ease-in-out infinite;
    }

    .shine {
      position: absolute;
      inset: -45% -12%;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(105deg,
        transparent 0%,
        transparent 41%,
        rgba(255,255,255,.0) 45%,
        rgba(255,255,255,.82) 49%,
        rgba(86,190,255,.34) 52%,
        transparent 58%,
        transparent 100%);
      transform: translateX(-82%) skewX(-18deg);
      mix-blend-mode: screen;
      animation: lightSweep 5.2s cubic-bezier(.55,.03,.2,1) infinite;
    }

    .button-area {
      position: absolute;
      left: 50%;
      bottom: clamp(54px, 8vh, 86px);
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .event-btn {
      position: relative;
      min-width: 230px;
      height: 58px;
      padding: 0 34px;
      border: 1px solid rgba(255,255,255,.50);
      border-radius: 999px;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.06)),
        linear-gradient(90deg, rgba(31,105,255,.88), rgba(5,203,255,.78));
      box-shadow:
        0 0 0 1px rgba(72,191,255,.22) inset,
        0 18px 60px rgba(0, 112, 255, .36),
        0 0 42px rgba(73, 197, 255, .26);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .05em;
      cursor: pointer;
      overflow: hidden;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .event-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
      transform: translateX(-120%);
      animation: btnSweep 3.4s ease-in-out infinite;
    }

    .event-btn:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.09);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.38) inset,
        0 24px 76px rgba(0, 149, 255, .44),
        0 0 56px rgba(107, 216, 255, .34);
    }

    .event-btn:active { transform: translateY(1px) scale(.99); }

    .hint {
      color: rgba(255,255,255,.48);
      font-size: 10px;
      letter-spacing: .38em;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 0 16px rgba(255,255,255,.2);
    }

    @keyframes nebulaMove {
      0% { transform: translate3d(-1.5%, -1%, 0) scale(1.02) rotate(-1deg); }
      100% { transform: translate3d(1.5%, 1%, 0) scale(1.08) rotate(2deg); }
    }
    @keyframes rayPulse {
      0%, 100% { opacity: .48; transform: scale(1.02) rotate(0deg); }
      50% { opacity: .88; transform: scale(1.12) rotate(1.4deg); }
    }
    @keyframes mistDrift {
      0% { transform: translate3d(-3%, 1%, 0) scale(1.04); }
      100% { transform: translate3d(3%, -2%, 0) scale(1.12); }
    }
    @keyframes burstBreath {
      0%, 100% { opacity: .58; transform: translate(-50%, -50%) scale(.94); }
      50% { opacity: .82; transform: translate(-50%, -50%) scale(1.03); }
    }
    @keyframes productFloat {
      0%, 100% { transform: translateY(-2vh); }
      50% { transform: translateY(calc(-2vh - 9px)); }
    }
    @keyframes auraPulse {
      0%, 100% { opacity: .42; transform: translate(-50%, -50%) scale(.98); }
      50% { opacity: .72; transform: translate(-50%, -50%) scale(1.06); }
    }
    @keyframes shaftShine {
      0%, 100% { filter: contrast(1.08) saturate(1.16) brightness(1.03) drop-shadow(0 0 16px rgba(58,157,255,.28)); }
      50% { filter: contrast(1.12) saturate(1.22) brightness(1.13) drop-shadow(0 0 27px rgba(84,190,255,.42)); }
    }
    @keyframes lightSweep {
      0%, 18% { transform: translateX(-88%) skewX(-18deg); opacity: 0; }
      35% { opacity: .95; }
      55%, 100% { transform: translateX(92%) skewX(-18deg); opacity: 0; }
    }
    @keyframes btnSweep {
      0%, 35% { transform: translateX(-120%); }
      65%, 100% { transform: translateX(120%); }
    }

    @media (max-width: 760px) {
      .shaft-wrap { width: 150vw; transform: translateY(-5vh); }
      .content { justify-content: center; }
      .event-btn { min-width: 210px; height: 54px; font-size: 15px; }
      .button-area { bottom: 54px; }
      .burst { width: 90vw; height: 90vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

        <span class="shine" aria-hidden="true"></span>
      </div>

      <div class="button-area">
        <button class="event-btn" id="eventBtn" type="button">이벤트 참여하기</button>
        <div class="hint">TOUCH TO JOIN EVENT</div>
      </div>
    </section>
  </main>

  <script>
    const EVENT_URL = "./event.html";

    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    let w = 0;
    let h = 0;
    let stars = [];
    let meteors = [];
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * DPR);
      canvas.height = Math.floor(h * DPR);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      makeStars();
    }

    function makeStars() {
      const count = Math.floor(Math.min(360, Math.max(160, w * h / 5200)));
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.35 + 0.15,
        a: Math.random() * 0.75 + 0.15,
        tw: Math.random() * 0.018 + 0.004,
        drift: Math.random() * 0.09 + 0.015
      }));
    }

    function spawnMeteor() {
      if (meteors.length > 3 || Math.random() > 0.018) return;
      meteors.push({
        x: Math.random() * w * 0.85 + w * 0.15,
        y: Math.random() * h * 0.38,
        len: Math.random() * 90 + 70,
        speed: Math.random() * 10 + 8,
        life: 1
      });
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      const cx = w / 2;
      const cy = h / 2;

      for (const s of stars) {
        s.x -= s.drift;
        if (s.x < -4) s.x = w + 4;
        s.a += s.tw;
        if (s.a > 1 || s.a < 0.16) s.tw *= -1;

        const dist = Math.hypot(s.x - cx, s.y - cy);
        const glow = Math.max(0, 1 - dist / Math.max(w, h));
        ctx.beginPath();
        ctx.fillStyle = `rgba(235, 247, 255, ${Math.min(1, s.a + glow * 0.24)})`;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      spawnMeteor();
      meteors = meteors.filter(m => m.life > 0);
      for (const m of meteors) {
        m.x -= m.speed;
        m.y += m.speed * 0.38;
        m.life -= 0.018;
        const grad = ctx.createLinearGradient(m.x, m.y, m.x + m.len, m.y - m.len * 0.38);
        grad.addColorStop(0, `rgba(255,255,255,${Math.max(0, m.life)})`);
        grad.addColorStop(0.45, `rgba(102,198,255,${Math.max(0, m.life * .55)})`);
        grad.addColorStop(1, "rgba(255,255,255,0)");
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x + m.len, m.y - m.len * 0.38);
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }

    document.getElementById("eventBtn").addEventListener("click", () => {
      location.href = EVENT_URL;
    });

    const shaftWrap = document.getElementById("shaftWrap");
    window.addEventListener("pointermove", (e) => {
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      shaftWrap.style.transform = `translateY(-2vh) rotateX(${-ny * 1.6}deg) rotateY(${nx * 2.2}deg)`;
    }, { passive: true });

    window.addEventListener("pointerleave", () => {
      shaftWrap.style.transform = "translateY(-2vh)";
    });

    window.addEventListener("resize", resize);
    resize();
    draw();
  </script>
