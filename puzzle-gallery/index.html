const last=element("button","last","»");last.disabled=page>=totalPages;last.title="맨 마지막 페이지";last.setAttribute("aria-label","맨 마지막 페이지");last.onclick=()=>load(totalPages);
pages.append(first,prev,current,next,last)}
async function load(n=1){const id=++requestId;status.textContent="";gallery.replaceChildren(element("div","loading","이미지를 불러오는 중입니다..."));try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);let response;try{response=await fetch(API+"/api/gallery/"+encodeURIComponent(FOLDER)+"?page="+n+"&page_size="+PAGE_SIZE,{signal:controller.signal})}finally{clearTimeout(timer)}if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();if(!Array.isArray(data.items))throw Error("이미지 목록 형식 오류");if(id!==requestId)return;items=data.items.map(x=>({...x,url:safeURL(x.url),thumbnail_url:safeURL(x.thumbnail_url)})).filter(x=>x.url);page=Number(data.page)||n;hasNext=Boolean(data.has_next);allTotal=Number(data.total)||items.length;render()}catch(err){if(id!==requestId)return;items=[];allTotal=0;hasNext=false;render();status.textContent="이미지 서버 연결에 실패했습니다. 잠시 후 새로고침해 주세요.";console.error(err)}}
function selectItem(item){selected=item;$("big").src=item.url;$("name").textContent=item.filename||"퍼즐 이미지";$("original").href=item.url;modal.hidden=false;document.body.style.overflow="hidden";$("close").focus()}
function closeModal(){modal.hidden=true;$("big").removeAttribute("src");document.body.style.overflow="";selected=null}
function play(kind){if(!selected)return;const target=kind==="jigsaw"?"../games/jpz.html":"../games/ipz.html";const q=new URLSearchParams({folder:FOLDER,image:selected.url,name:selected.filename||""});location.href=target+"?"+q.toString()}
$("jigsaw").onclick=()=>play("jigsaw");$("slide").onclick=()=>play("slide");$("close").onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)closeModal()});
function setView(next,historyAction=true){
 if(!["all","favorites","music"].includes(next))next="all";
 view=next;const music=next==="music";
 $("photo-content").hidden=music;$("music-content").hidden=!music;$("gallery-search").hidden=music;
 document.querySelectorAll(".tab[data-view]").forEach(b=>{const active=b.dataset.view===next;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active))});
 if(historyAction){const hash=next==="music"?"#music":next==="favorites"?"#favorites":"";history.pushState(null,"",location.pathname+location.search+hash)}
 if(music){musicUI.activate()}else{render()}
 if(historyAction)window.scrollTo({top:0,behavior:"instant"});
}
document.querySelectorAll(".tab[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));
window.addEventListener("popstate",()=>setView(location.hash==="#music"?"music":location.hash==="#favorites"?"favorites":"all",false));
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));render()});
$("search").oninput=e=>{search=e.target.value.trim();render()};$("sort").onchange=e=>{sort=e.target.value;render()};

const musicUI=(function(){
 const API_URL="https://api.github.com/repos/lee1431/nr/contents/assets/muz?ref=main";
 const audio=$("music-audio"),list=$("music-list"),queryInput=$("music-search");
 let songs=[],active=-1,query="",requested=false;
 function cleanName(name){return String(name||"제목 없음").replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").replace(/\s+/g," ").trim()}
 function duration(s){return Number.isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00"}
 function audioUrl(url){try{const u=new URL(url);return ["https:","http:"].includes(u.protocol)?u.href:null}catch(e){return null}}
 async function fetchDir(url,depth=0){if(depth>5)return [];const response=await fetch(url,{headers:{Accept:"application/vnd.github+json"}});if(!response.ok)throw Error("GitHub API "+response.status);const data=await response.json();if(!Array.isArray(data))return [];
 const direct=data.filter(x=>x.type==="file"&&/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(x.name||"")).map(x=>({title:cleanName(x.name),url:audioUrl(x.download_url)})).filter(x=>x.url);
 const dirs=data.filter(x=>x.type==="dir"&&x.url);const nested=await Promise.all(dirs.map(d=>fetchDir(d.url,depth+1)));return direct.concat(...nested);
 }
 function showStatus(message){$("music-feedback").textContent=message}
 function musicRow(track,index){const row=document.createElement("button");row.type="button";row.className="music-track"+(active===index?" active":"");row.setAttribute("aria-label",track.title+" 재생");
 const num=document.createElement("span");num.className="music-index";num.textContent=String(index+1).padStart(2,"0");
 const symbol=document.createElement("span");symbol.className="music-note";symbol.textContent="♫";
 const info=document.createElement("span");info.className="music-info";const name=document.createElement("span");name.className="music-title";name.textContent=track.title;const sub=document.createElement("span");sub.className="music-sub";sub.textContent="STANCE MUSIC";info.append(name,sub);
 const indicator=document.createElement("span");indicator.className="music-indicator";indicator.textContent=active===index&&!audio.paused?"Ⅱ":"▶";row.append(num,symbol,info,indicator);row.onclick=()=>select(index);return row;
 }
 function render(){list.replaceChildren();const matches=songs.map((track,index)=>({track,index})).filter(x=>x.track.title.toLocaleLowerCase().includes(query));$("music-count").textContent=matches.length===songs.length?songs.length+"곡":matches.length+" / "+songs.length+"곡";
 if(matches.length){const frag=document.createDocumentFragment();matches.forEach(x=>frag.append(musicRow(x.track,x.index)));list.append(frag)}else{const div=document.createElement("div");div.className="music-empty";div.textContent=songs.length?"검색 결과가 없습니다.":"등록된 음악이 없습니다.";list.append(div)}
 }
 async function load(){requested=true;list.replaceChildren();const wait=document.createElement("div");wait.className="music-empty";wait.textContent="음악을 불러오는 중입니다...";list.append(wait);
 try{songs=(await fetchDir(API_URL)).sort((a,b)=>a.title.localeCompare(b.title,"ko"));showStatus("NR 저장소의 음악 목록을 불러왔습니다.");render()}catch(e){requested=false;list.replaceChildren();const retry=document.createElement("button");retry.className="music-track";retry.type="button";retry.textContent="목록을 가져오지 못했습니다. 다시 시도하기";retry.onclick=load;list.append(retry);$("music-count").textContent="연결 오류";showStatus("GitHub 음악 저장소를 확인해 주세요.");console.warn(e)}
 }
 function syncPlayer(){const playing=active>=0||view==="music";$("music-player").hidden=!playing;document.body.classList.toggle("has-music-player",playing);$("music-toggle").textContent=audio.paused?"▶":"Ⅱ";$("music-toggle").setAttribute("aria-label",audio.paused?"재생":"일시정지")}
 async function play(){if(active<0){if(songs.length)select(0);return}try{await audio.play();$("music-state").textContent="재생 중"}catch(e){$("music-state").textContent="재생 실패";console.warn(e)}syncPlayer();render()}
 function select(index){if(!songs.length)return;active=(index+songs.length)%songs.length;audio.src=songs[active].url;audio.load();$("music-now").textContent=songs[active].title;$("music-state").textContent="불러오는 중";$("music-time").textContent="0:00";$("music-duration").textContent="0:00";$("music-seek").value=0;syncPlayer();render();play()}
 function step(n){if(songs.length)select(active<0?0:active+n)}
 $("music-toggle").onclick=()=>{if(audio.paused)play();else{audio.pause();$("music-state").textContent="일시정지";syncPlayer()}};
 $("music-prev").onclick=()=>step(-1);$("music-next").onclick=()=>step(1);
 queryInput.oninput=e=>{query=e.target.value.trim().toLocaleLowerCase();render()};
 $("music-seek").oninput=e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(e.target.value)/100};
 audio.ontimeupdate=()=>{$("music-time").textContent=duration(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0)$("music-seek").value=(audio.currentTime/audio.duration*100).toFixed(1)};
 audio.onloadedmetadata=()=>{$("music-duration").textContent=duration(audio.duration)};
 audio.onended=()=>step(1);audio.onpause=()=>{syncPlayer();render()};audio.onplay=()=>{syncPlayer();render()};
 audio.onerror=()=>{if(active>=0)$("music-state").textContent="음악을 재생할 수 없습니다";syncPlayer()};
 return {activate(){if(!requested)load();syncPlayer()},syncPlayer};
})();

load();
setView(location.hash==="#music"?"music":location.hash==="#favorites"?"favorites":"all",false);
</script></body></html>
