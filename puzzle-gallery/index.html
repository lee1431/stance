:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#34405e;background:#faf8fc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fbf9fc,#f9f9fd 55%,#fffaf6);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a19ce5;outline-offset:2px}.wrap{width:min(1400px,calc(100% - 48px));margin:auto}.brand{display:flex;justify-content:center;align-items:center;padding:20px 0 13px;text-decoration:none}.brand img{width:96px;height:96px;object-fit:contain;border-radius:25px;filter:drop-shadow(0 5px 14px #b8b4da35)}nav{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e9e6f0;padding:8px 0 18px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab,.chip,select{border:1px solid #e7e4ed;border-radius:99px;background:#ffffffab;color:#445071;padding:11px 17px}.tab.active,.chip.active{background:#858bdc;border-color:#858bdc;color:white;box-shadow:0 5px 14px #8888ce22}.search{display:flex;gap:8px;align-items:center;border:1px solid #e8e5ee;background:white;border-radius:99px;padding:0 16px;min-width:230px}.search svg{flex:none}.search input{border:0;outline:0;padding:12px 0;width:100%;min-width:0;background:transparent;color:inherit}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 18px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 17px}.right{display:flex;gap:10px;align-items:center;color:#777e91;font-size:13px}select{padding:9px 14px}#gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.tile{position:relative;aspect-ratio:1.7;overflow:hidden;border-radius:16px;background:#eeedf4;box-shadow:0 3px 15px #34345a0a}.tile .photo{display:block;width:100%;height:100%;padding:0;border:0;background:none;overflow:hidden}.tile img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .25s}.tile:hover img{transform:scale(1.045)}.fav{position:absolute;right:9px;top:8px;border:0;background:#17203a26;color:#fff;display:grid;place-items:center;border-radius:50%;font-size:24px;width:38px;height:38px;text-shadow:0 1px 3px #0006}.fav.on{color:#ffcede;background:#fff9}.tile figcaption{display:none}.loading,.empty{grid-column:1/-1;text-align:center;padding:90px 20px;color:#7d8397}.pagination{display:flex;justify-content:center;gap:12px;align-items:center;margin:29px 0 45px}.pagination button{border:1px solid #e8e5ef;background:#fff;border-radius:99px;min-width:42px;height:42px;color:#445071}.pagination button:disabled{opacity:.35;cursor:default}.pagination .current{background:#858bdc;color:white;border-color:#858bdc}.modal[hidden]{display:none}.modal{position:fixed;inset:0;background:#1e2039b8;backdrop-filter:blur(7px);display:grid;place-items:center;padding:16px;z-index:20}.dialog{position:relative;background:#fffdfd;border-radius:24px;width:min(620px,100%);max-height:95dvh;overflow:auto;padding:18px 18px 22px;box-shadow:0 25px 90px #0004}.dialog>img{width:100%;max-height:58dvh;object-fit:contain;background:#f2eff6;border-radius:16px;display:block}.close{position:absolute;right:26px;top:26px;border:0;border-radius:50%;background:#fffdec;width:40px;height:40px;font-size:26px;line-height:1}.dialog h2{font-size:16px;margin:15px 3px;color:#454a64;overflow-wrap:anywhere}.actions{display:flex;gap:10px}.actions button,.actions a{flex:1;text-align:center;text-decoration:none;display:block;border:0;border-radius:13px;background:#858bdc;color:#fff;padding:13px 8px;font-weight:700}.actions .secondary{background:#f0eef8;color:#575e87}.status{margin:14px 0;color:#788096;font-size:13px;min-height:20px}.footer{text-align:center;font-size:12px;color:#a5a7b6;margin:0 0 24px}@media(max-width:1000px){#gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:670px){.wrap{width:calc(100% - 24px)}.brand{padding:10px 0}.brand img{width:75px;height:75px;border-radius:20 ><div class="modal" id="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-label="사진 미리보기"><button class="close" id="close" aria-label="닫기">×</button><img id="big" alt="선택한 사진"><h2 id="name"></h2><div class="actions"><button id="jigsaw">🧩 직소 퍼즐 시작</button><button id="slide" class="secondary">▦ 슬라이드 퍼즐 시작</button></div></div></div><script>
"use strict";
const API="https://localflow.ddns.net/images",FOLDER=new URLSearchParams(location.search).get("folder")||"object";
const $=id=>document.getElementById(id),gallery=$("gallery"),modal=$("modal"),status=$("status");
const PAGE_SIZE=24;
let page=1,hasNext=false,view="all",filter="전체",search="",sort="new",items=[],selected=null,allTotal=0,requestId=0;
let favorites=new Set();try{favorites=new Set(JSON.parse(localStorage.getItem("puzzle-gallery-favorites")||"[]"))}catch(_){}
const categories=[["동물",/cat|dog|animal|bird|fish|고양|강아|동물|새|물고기/],["도시",/city|urban|street|building|도시|거리|건물|야경/],["여행",/travel|trip|beach|sea|ocean|island|여행|바다|해변|섬/],["자연",/flower|forest|tree|nature|plant|꽃|숲|나무|자연/],["풍경",/view|landscape|mountain|sunset|lake|sky|풍경|산|노을|호수|하늘/]];
function category(item){const s=(item.filename||"").toLowerCase();return categories.find(([_,re])=>re.test(s))?.[0]||"기타"}
function safeURL(value){try{let u=new URL(value,location.href);return u.protocol==="https:"||u.protocol==="http:"?u.href:null}catch(_){return null}}
function saveFav(){try{localStorage.setItem("puzzle-gallery-favorites",JSON.stringify([...favorites]))}catch(_){}}
function visible(){let a=items.filter(x=>view!=="favorites"||favorites.has(x.url)).filter(x=>filter==="전체"||category(x)===filter).filter(x=>(x.filename||"").toLowerCase().includes(search.toLowerCase()));if(sort==="old")a.reverse();if(sort==="name")a.sort((a,b)=>(a.filename||"").localeCompare(b.filename||"","ko"));return a}
function element(tag,cls,text){let e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function render(){gallery.replaceChildren();const shown=visible();$("count").textContent=(filter!=="전체"||search||view==="favorites"?shown.length+"개 표시 · ":"")+allTotal+"개 이미지";if(!shown.length){gallery.append(element("div","empty",items.length?"조건에 맞는 사진이 없습니다.":"표시할 사진이 없습니다."))}
for(const item of shown){const card=element("figure","tile");card.style.margin="0";const open=element("button","photo");open.setAttribute("aria-label",(item.filename||"사진")+" 크게 보기");const img=document.createElement("img");img.src=safeURL(item.thumbnail_url)||item.url;img.alt=item.filename||"퍼즐 사진";img.loading="lazy";img.onerror=()=>{img.style.opacity=".25"};open.append(img);open.onclick=()=>selectItem(item);const fav=element("button","fav"+(favorites.has(item.url)?" on":""),favorites.has(item.url)?"♥":"♡");fav.title="즐겨찾기";fav.setAttribute("aria-label","즐겨찾기 전환");fav.onclick=()=>{favorites.has(item.url)?favorites.delete(item.url):favorites.add(item.url);saveFav();render()};card.append(open,fav);gallery.append(card)}
const pages=$("pages");pages.replaceChildren();const prev=element("button","","‹");prev.disabled=page<=1;prev.onclick=()=>load(page-1);const current=element("button","current",String(page));current.setAttribute("aria-current","page");const next=element("button","","›");next.disabled=!hasNext;next.onclick=()=>load(page+1);pages.append(prev,current,next)}
async function load(n=1){const id=++requestId;status.textContent="";gallery.replaceChildren(element("div","loading","이미지를 불러오는 중입니다..."));try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);let response;try{response=await fetch(API+"/api/gallery/"+encodeURIComponent(FOLDER)+"?page="+n+"&page_size="+PAGE_SIZE,{signal:controller.signal})}finally{clearTimeout(timer)}if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();if(!Array.isArray(data.items))throw Error("이미지 목록 형식 오류");if(id!==requestId)return;items=data.items.map(x=>({...x,url:safeURL(x.url),thumbnail_url:safeURL(x.thumbnail_url)})).filter(x=>x.url);page=Number(data.page)||n;hasNext=Boolean(data.has_next);allTotal=Number(data.total)||items.length;render()}catch(err){if(id!==requestId)return;items=[];allTotal=0;hasNext=false;render();status.textContent="이미지 서버 연결에 실패했습니다. 잠시 후 새로고침해 주세요.";console.error(err)}}
function selectItem(item){selected=item;$("big").src=item.url;$("name").textContent=item.filename||"퍼즐 이미지";modal.hidden=false;document.body.style.overflow="hidden";$("close").focus()}
function closeModal(){modal.hidden=true;$("big").removeAttribute("src");document.body.style.overflow="";selected=null}
function play(kind){if(!selected)return;const target=kind==="jigsaw"?"../games/jpz.html":"../games/ipz.html";const q=new URLSearchParams({folder:FOLDER,image:selected.url,name:selected.filename||""});location.href=target+"?"+q.toString()}
$("jigsaw").onclick=()=>play("jigsaw");$("slide").onclick=()=>play("slide");$("close").onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)closeModal()});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));if(view==="jigsaw"||view==="slide"){status.textContent="사진을 선택하면 해당 퍼즐을 시작할 수 있습니다."}else status.textContent="";render()});
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));render()});
$("search").oninput=e=>{search=e.target.value.trim();render()};$("sort").onchange=e=>{sort=e.target.value;render()};
load();
</script></body></html>
