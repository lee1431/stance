<audio id="audio" preload="metadata"></audio>
<script>
"use strict";
const API="https://api.github.com/repos/lee1431/nr/contents/assets/muz?ref=main";
const allowed=/\.(mp3|m4a|wav|ogg|aac|flac)$/i,byId=id=>document.getElementById(id);
const audio=byId("audio");let tracks=[],current=-1,query="";
const titleOf=name=>String(name||"제목 없음").replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").replace(/\s+/g," ").trim();
const time=n=>Number.isFinite(n)?Math.floor(n/60)+":"+String(Math.floor(n%60)).padStart(2,"0"):"0:00";
function validAudioUrl(s){try{const u=new URL(s);if(u.protocol==="https:"||u.protocol==="http:")return u.href}catch(e){}return null}
async function listDir(url,depth=0){if(depth>5)return [];const res=await fetch(url,{headers:{Accept:"application/vnd.github+json"}});if(!res.ok)throw new Error("GitHub API "+res.status);const items=await res.json();if(!Array.isArray(items))return [];const direct=items.filter(x=>x.type==="file"&&allowed.test(x.name||"")).map(x=>({name:x.name,title:titleOf(x.name),url:validAudioUrl(x.download_url),path:x.path,size:x.size})).filter(x=>x.url);const dirs=items.filter(x=>x.type==="dir"&&x.url);const nested=await Promise.all(dirs.map(x=>listDir(x.url,depth+1)));return direct.concat(...nested)}
async function loadMusic(){try{tracks=(await listDir(API)).sort((a,b)=>a.title.localeCompare(b.title,"ko"));byId("status").textContent=tracks.length?"NR 저장소의 음악 파일을 자동으로 불러왔습니다.":"음악 파일을 찾지 못했습니다.";byId("state").textContent="재생 대기";render()}catch(e){byId("list").replaceChildren();const div=document.createElement("div");div.className="empty";div.textContent="음악 목록을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.";byId("list").append(div);byId("count").textContent="목록 불러오기 실패";byId("status").textContent="GitHub 연결 또는 API 요청 제한을 확인해 주세요.";byId("state").textContent="연결 오류";console.error(e)}}
function render(){const list=byId("list");list.replaceChildren();const found=tracks.map((t,i)=>({...t,i})).filter(t=>t.title.toLowerCase().includes(query));byId("count").textContent=found.length===tracks.length?tracks.length+"곡":found.length+" / "+tracks.length+"곡";
if(!found.length){const div=document.createElement("div");div.className="empty";div.textContent=tracks.length?"검색 결과가 없습니다.":"음악이 없습니다.";list.append(div);return}
for(const track of found){const row=document.createElement("button");row.type="button";row.className="track"+(current===track.i?" active":"");row.setAttribute("aria-label",track.title+" 재생");
const index=document.createElement("span");index.className="index";index.textContent=String(track.i+1).padStart(2,"0");
const icon=document.createElement("span");icon.className="symbol";icon.textContent="♫";icon.setAttribute("aria-hidden","true");
const info=document.createElement("span");info.className="track-info";
const name=document.createElement("span");name.className="track-title";name.textContent=track.title;
const sub=document.createElement("span");sub.className="track-sub";sub.textContent="STANCE MUSIC";
info.append(name,sub);const play=document.createElement("span");play.className="play";play.textContent=current===track.i&&!audio.paused?"Ⅱ":"▶";
row.append(index,icon,info,play);row.addEventListener("click",()=>choose(track.i));list.append(row)}}
async function play(){if(!tracks.length)return;if(current<0){choose(0);return}try{await audio.play();byId("state").textContent="재생 중"}catch(e){byId("state").textContent="재생할 수 없습니다";console.warn(e)}refresh()}
function choose(i){if(!tracks.length)return;current=(i+tracks.length)%tracks.length;audio.src=tracks[current].url;audio.load();byId("now").textContent=tracks[current].title;byId("state").textContent="불러오는 중";byId("current").textContent="0:00";byId("duration").textContent="0:00";byId("seek").value=0;render();play()}
function refresh(){byId("play").textContent=audio.paused?"▶":"Ⅱ";render()}
function change(offset){if(!tracks.length)return;choose(current<0?0:current+offset)}
byId("search").addEventListener("input",e=>{query=e.target.value.trim().toLocaleLowerCase();render()});
byId("play").addEventListener("click",()=>{if(audio.paused)play();else{audio.pause();byId("state").textContent="일시정지";refresh()}});
byId("prev").addEventListener("click",()=>change(-1));byId("next").addEventListener("click",()=>change(1));
byId("seek").addEventListener("input",e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(e.target.value)/100});
audio.addEventListener("timeupdate",()=>{byId("current").textContent=time(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0)byId("seek").value=String(audio.currentTime/audio.duration*100)});
audio.addEventListener("loadedmetadata",()=>{byId("duration").textContent=time(audio.duration)});
audio.addEventListener("ended",()=>change(1));audio.addEventListener("pause",refresh);audio.addEventListener("play",refresh);
audio.addEventListener("error",()=>{byId("state").textContent="이 파일을 재생할 수 없습니다";byId("play").textContent="▶"});
loadMusic();
</script></body></html>
