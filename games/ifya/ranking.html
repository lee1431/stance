<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07090d">
  <title>IFYA Ranking</title>
  <link rel="stylesheet" href="./styles.css?v=1">
  <style>
    body{background:radial-gradient(circle at 50% 0,#18273a 0,transparent 35%),#05070a}
    .ranking-page{width:min(980px,94vw);margin:0 auto;padding:28px 0 70px}
    .ranking-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px}
    .ranking-title{font-size:clamp(34px,7vw,70px);color:var(--gold);font-weight:950;letter-spacing:.08em}
    .ranking-list{display:grid;gap:10px}
    .rank-row{display:grid;grid-template-columns:70px 1.6fr 1fr 1fr 1fr;align-items:center;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:rgba(11,16,24,.82)}
    .rank-no{font-size:22px;font-weight:950;color:#8998aa}.rank-row:nth-child(1) .rank-no{color:#ffd978}.rank-row:nth-child(2) .rank-no{color:#d7dbe2}.rank-row:nth-child(3) .rank-no{color:#d69c68}
    .rank-name{font-weight:950}.rank-return{font-weight:950}.rank-return.up{color:var(--green)}.rank-return.down{color:var(--red)}.rank-sub{font-size:10px;color:var(--muted)}
    @media(max-width:650px){.rank-row{grid-template-columns:45px 1.5fr 1fr}.hide-mobile{display:none}.ranking-page{padding-top:16px}}
  </style>
</head>
<body>
  <main class="ranking-page">
    <header class="ranking-head">
      <div>
        <div class="eyebrow">WHO READS THE WORLD BEST?</div>
        <div class="ranking-title">IFYA RANKING</div>
      </div>
      <a class="ghost linkbtn" href="./">거실로 돌아가기</a>
    </header>
    <div id="rankingStatus" class="muted">랭킹 불러오는 중...</div>
    <section id="rankingList" class="ranking-list" style="margin-top:14px"></section>
  </main>
  <script src="./ranking.js?v=1" defer></script>
</body>
</html>
