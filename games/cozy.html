<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포근한 마을 - Phaser Web Game Prototype</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(#aee2ff, #fff5d6);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }

    .hint {
      position: fixed;
      left: 16px;
      bottom: 12px;
      color: #5b3b21;
      background: rgba(255, 248, 221, 0.88);
      border: 2px solid rgba(121, 84, 45, 0.25);
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.55;
      box-shadow: 0 8px 24px rgba(95, 64, 36, 0.18);
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="hint">
    이동: WASD / 방향키<br />
    심기·수확: SPACE<br />
    꾸미기 모드: 1 화분 · 2 의자 · 3 램프<br />
    설치: E
  </div>

  <script>
    class MainScene extends Phaser.Scene {
      constructor() {
        super('MainScene');
        this.player = null;
        this.cursors = null;
        this.keys = null;
        this.facing = new Phaser.Math.Vector2(0, 1);
        this.speed = 175;
        this.coins = 0;
        this.seeds = 8;
        this.day = 1;
        this.selectedDecor = 'pot';
        this.plots = [];
        this.decorItems = [];
        this.messageText = null;
        this.hudText = null;
        this.actionCooldown = 0;
      }

      preload() {}

      create() {
        this.createWorld();
        this.createGarden();
        this.createHomeDecorZone();
        this.createPlayer();
        this.createAnimalFriend();
        this.createHud();
        this.createInputs();
        this.showMessage('포근한 마을에 오신 걸 환영해요! 밭에서 SPACE로 씨앗을 심어보세요.');
      }

      update(time, delta) {
        this.handleMovement(delta);
        this.actionCooldown = Math.max(0, this.actionCooldown - delta);

        if (Phaser.Input.Keyboard.JustDown(this.keys.space)) {
          this.handleFarmAction();
        }

        if (Phaser.Input.Keyboard.JustDown(this.keys.e)) {
          this.placeDecor();
        }

        if (Phaser.Input.Keyboard.JustDown(this.keys.one)) {
          this.selectedDecor = 'pot';
          this.showMessage('선택: 꽃 화분');
        }
        if (Phaser.Input.Keyboard.JustDown(this.keys.two)) {
          this.selectedDecor = 'chair';
          this.showMessage('선택: 나무 의자');
        }
        if (Phaser.Input.Keyboard.JustDown(this.keys.three)) {
          this.selectedDecor = 'lamp';
          this.showMessage('선택: 정원 램프');
        }

        this.updateCrops(delta);
        this.updateHud();
      }

      createWorld() {
        const { width, height } = this.scale;

        this.add.rectangle(width / 2, height / 2, width, height, 0x9edc8b);

        const sky = this.add.rectangle(width / 2, 120, width, 240, 0xaee2ff);
        sky.setDepth(-10);

        this.add.ellipse(220, 120, 130, 44, 0xffffff, 0.86);
        this.add.ellipse(285, 100, 170, 52, 0xffffff, 0.78);
        this.add.ellipse(780, 92, 160, 48, 0xffffff, 0.72);
        this.add.ellipse(860, 118, 120, 36, 0xffffff, 0.8);

        this.add.rectangle(width / 2, 380, width, 340, 0x88c776);
        this.add.triangle(190, 320, 0, 430, 360, 430, 0x79ba6c);
        this.add.triangle(510, 310, 270, 440, 780, 440, 0x73b965);
        this.add.triangle(880, 315, 600, 450, 1160, 450, 0x80bf70);

        this.add.rectangle(width / 2, 610, width, 390, 0x89c878);

        this.addPath(80, 610, 1040, 765);
        this.createCottage(780, 280);
        this.createFence(78, 485, 560, 4);
        this.createFence(78, 710, 560, 4);
        this.createPond(160, 790);
        this.createVillageBackground();
        this.createTitleBoard();
      }

      addPath(x, y, w, h) {
        const path = this.add.graphics();
        path.fillStyle(0xe5c58d, 1);
        path.beginPath();
        path.moveTo(x, y + 60);
        path.quadraticCurveTo(x + 300, y + 10, x + 510, y + 90);
        path.quadraticCurveTo(x + 740, y + 180, x + w, y + h - 20);
        path.lineTo(x + w, y + h + 80);
        path.quadraticCurveTo(x + 700, y + 220, x + 460, y + 150);
        path.quadraticCurveTo(x + 230, y + 80, x, y + 140);
        path.closePath();
        path.fillPath();
        path.lineStyle(4, 0xcaa36a, 0.35);
        path.strokePath();
      }

      createCottage(x, y) {
        this.add.rectangle(x + 90, y + 190, 290, 230, 0xfff1c9).setStrokeStyle(5, 0x7b4c2a);
        this.add.triangle(x + 90, y + 50, x - 80, y + 170, x + 260, y + 170, 0xd87436).setStrokeStyle(5, 0x7b4c2a);
        this.add.rectangle(x + 205, y + 65, 42, 80, 0xc36b32).setStrokeStyle(4, 0x7b4c2a);
        this.add.rectangle(x + 80, y + 245, 72, 120, 0x8a552e).setStrokeStyle(4, 0x5a321c);
        this.add.circle(x + 102, y + 305, 5, 0xf6d98b);
        this.add.rectangle(x - 10, y + 210, 70, 58, 0x8fd0e2).setStrokeStyle(4, 0x5a321c);
        this.add.rectangle(x + 190, y + 210, 70, 58, 0x8fd0e2).setStrokeStyle(4, 0x5a321c);
        this.add.rectangle(x + 90, y + 355, 330, 24, 0xb0773d);
        this.add.text(x + 260, y + 260, 'HOME\nSWEET\nHOME', {
          fontFamily: 'system-ui',
          fontSize: '15px',
          color: '#fff4cc',
          align: 'center',
          fontStyle: '700'
        }).setOrigin(0.5).setAngle(-2);

        this.add.rectangle(x + 260, y + 262, 88, 82, 0x9b6634, 0.92).setDepth(-1);

        for (let i = 0; i < 7; i++) {
          this.add.circle(x - 70 + i * 55, y + 385 + Math.sin(i) * 8, 14, 0xff9bb2);
          this.add.circle(x - 60 + i * 55, y + 398 + Math.cos(i) * 6, 12, 0xffd66b);
        }
      }

      createFence(x, y, count, scale) {
        for (let i = 0; i < count / 30; i++) {
          const px = x + i * 30;
          this.add.rectangle(px, y, 10, 42, 0xfff3c8).setStrokeStyle(1, 0xb98a55);
          this.add.triangle(px, y - 28, px - 7, y - 10, px + 7, y - 10, 0xfff3c8).setStrokeStyle(1, 0xb98a55);
        }
        this.add.rectangle(x + count / 2 - 16, y - 5, count, 8, 0xfff3c8).setStrokeStyle(1, 0xb98a55);
        this.add.rectangle(x + count / 2 - 16, y + 13, count, 8, 0xfff3c8).setStrokeStyle(1, 0xb98a55);
      }

      createPond(x, y) {
        this.add.ellipse(x, y, 190, 85, 0x74c7dd, 0.88).setStrokeStyle(5, 0x5aa2b4);
        this.add.ellipse(x - 30, y - 10, 70, 18, 0xbdf4ff, 0.5);
        this.add.circle(x + 60, y + 12, 7, 0xffd3e2);
        this.add.circle(x + 74, y + 12, 7, 0xffd3e2);
        this.add.circle(x + 67, y + 3, 7, 0xffd3e2);
      }

      createVillageBackground() {
        for (let i = 0; i < 7; i++) {
          const x = 80 + i * 115;
          const y = 390 + Math.sin(i) * 28;
          this.add.rectangle(x, y, 54, 44, 0xfff1d3).setStrokeStyle(2, 0x7a5731);
          this.add.triangle(x, y - 50, x - 36, y - 20, x + 36, y - 20, i % 2 ? 0xc66a4b : 0x789fd3).setStrokeStyle(2, 0x7a5731);
          this.add.rectangle(x - 12, y + 2, 12, 20, 0x7aaed0);
        }
        this.add.rectangle(540, 325, 24, 145, 0xe9d3a2).setStrokeStyle(3, 0x8a6a40);
        this.add.circle(552, 280, 34, 0xd6bd81).setStrokeStyle(3, 0x8a6a40);
        this.add.line(552, 280, 552, 212, 552, 348, 0x8a6a40, 1).setLineWidth(5);
        this.add.line(552, 280, 484, 280, 620, 280, 0x8a6a40, 1).setLineWidth(5);
        this.add.line(552, 280, 504, 232, 600, 328, 0x8a6a40, 1).setLineWidth(4);
        this.add.line(552, 280, 600, 232, 504, 328, 0x8a6a40, 1).setLineWidth(4);
      }

      createTitleBoard() {
        this.add.rectangle(250, 116, 420, 114, 0xfff5d8, 0.82).setStrokeStyle(4, 0x8c5b32);
        this.add.text(250, 82, '포근한 마을', {
          fontFamily: 'system-ui',
          fontSize: '42px',
          fontStyle: '900',
          color: '#7a3f22',
          stroke: '#fff4d2',
          strokeThickness: 8
        }).setOrigin(0.5);
        this.add.text(250, 128, '농사짓고, 꾸미고, 쉬어가는 하루', {
          fontFamily: 'system-ui',
          fontSize: '17px',
          fontStyle: '700',
          color: '#527634'
        }).setOrigin(0.5);
      }

      createGarden() {
        const startX = 120;
        const startY = 525;
        const gapX = 82;
        const gapY = 72;

        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 5; col++) {
            const x = startX + col * gapX;
            const y = startY + row * gapY;
            const plot = {
              x,
              y,
              state: 'empty',
              growth: 0,
              base: this.add.rectangle(x, y, 62, 46, 0x8b5f34).setStrokeStyle(3, 0x65401f),
              crop: null,
              sparkle: null
            };
            this.plots.push(plot);
          }
        }
      }

      createHomeDecorZone() {
        this.add.rectangle(835, 672, 360, 170, 0xe8c890, 0.7).setStrokeStyle(4, 0xc49d63);
        this.add.text(835, 585, '꾸미기 마당', {
          fontFamily: 'system-ui',
          fontSize: '22px',
          fontStyle: '800',
          color: '#6a4325',
          stroke: '#fff4d2',
          strokeThickness: 5
        }).setOrigin(0.5);
      }

      createPlayer() {
        this.player = this.add.container(560, 620);
        this.player.setSize(44, 58);

        const shadow = this.add.ellipse(0, 34, 50, 16, 0x000000, 0.16);
        const legs = this.add.rectangle(0, 28, 28, 38, 0x7a9e58).setStrokeStyle(2, 0x4d683a);
        const body = this.add.rectangle(0, 0, 42, 44, 0xf6e1b8).setStrokeStyle(2, 0x7b4c2a);
        const overalls = this.add.rectangle(0, 12, 34, 36, 0x7a9e58).setStrokeStyle(2, 0x4d683a);
        const head = this.add.circle(0, -35, 23, 0xffd2a4).setStrokeStyle(2, 0x7b4c2a);
        const hair = this.add.arc(0, -42, 24, 210, 330, false, 0x6d3d22).setStrokeStyle(8, 0x6d3d22);
        const hat = this.add.ellipse(0, -60, 72, 20, 0xdba95b).setStrokeStyle(2, 0x895d2a);
        const hatTop = this.add.ellipse(0, -68, 40, 28, 0xe8bc70).setStrokeStyle(2, 0x895d2a);
        const eyeL = this.add.circle(-8, -36, 3, 0x3b2415);
        const eyeR = this.add.circle(8, -36, 3, 0x3b2415);
        const smile = this.add.arc(0, -29, 8, 15, 165, false, 0x3b2415).setStrokeStyle(2, 0x3b2415);
        const basket = this.add.ellipse(26, 4, 32, 22, 0xb87536).setStrokeStyle(2, 0x70401f);

        this.player.add([shadow, legs, body, overalls, head, hair, hat, hatTop, eyeL, eyeR, smile, basket]);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);
      }

      createAnimalFriend() {
        const dog = this.add.container(635, 660);
        const shadow = this.add.ellipse(0, 24, 56, 16, 0x000000, 0.15);
        const body = this.add.ellipse(0, 5, 52, 34, 0xd9873d).setStrokeStyle(2, 0x7a4b22);
        const chest = this.add.ellipse(13, 8, 24, 28, 0xfff0d4);
        const head = this.add.circle(18, -18, 23, 0xd9873d).setStrokeStyle(2, 0x7a4b22);
        const snout = this.add.ellipse(25, -9, 22, 14, 0xfff0d4);
        const ear1 = this.add.triangle(3, -34, -8, -58, 12, -43, 0xd9873d).setStrokeStyle(2, 0x7a4b22);
        const ear2 = this.add.triangle(30, -37, 45, -56, 42, -32, 0xd9873d).setStrokeStyle(2, 0x7a4b22);
        const eye = this.add.circle(21, -21, 3, 0x2c1b11);
        const nose = this.add.circle(35, -9, 4, 0x2c1b11);
        const tail = this.add.arc(-31, -1, 18, 220, 40, false, 0xd9873d).setStrokeStyle(7, 0xd9873d);
        dog.add([shadow, tail, body, chest, head, ear1, ear2, snout, eye, nose]);

        this.tweens.add({
          targets: dog,
          y: 650,
          duration: 900,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });
      }

      createHud() {
        this.add.rectangle(152, 28, 276, 48, 0xfff5d8, 0.92).setStrokeStyle(3, 0x8c5b32);
        this.hudText = this.add.text(22, 16, '', {
          fontFamily: 'system-ui',
          fontSize: '18px',
          fontStyle: '800',
          color: '#5d3a20'
        });

        this.messageText = this.add.text(this.scale.width / 2, this.scale.height - 38, '', {
          fontFamily: 'system-ui',
          fontSize: '18px',
          fontStyle: '800',
          color: '#5d3a20',
          backgroundColor: 'rgba(255,245,216,0.90)',
          padding: { x: 18, y: 10 }
        }).setOrigin(0.5);
      }

      createInputs() {
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys({
          w: Phaser.Input.Keyboard.KeyCodes.W,
          a: Phaser.Input.Keyboard.KeyCodes.A,
          s: Phaser.Input.Keyboard.KeyCodes.S,
          d: Phaser.Input.Keyboard.KeyCodes.D,
          space: Phaser.Input.Keyboard.KeyCodes.SPACE,
          e: Phaser.Input.Keyboard.KeyCodes.E,
          one: Phaser.Input.Keyboard.KeyCodes.ONE,
          two: Phaser.Input.Keyboard.KeyCodes.TWO,
          three: Phaser.Input.Keyboard.KeyCodes.THREE
        });
      }

      handleMovement(delta) {
        const body = this.player.body;
        let vx = 0;
        let vy = 0;

        if (this.cursors.left.isDown || this.keys.a.isDown) vx -= 1;
        if (this.cursors.right.isDown || this.keys.d.isDown) vx += 1;
        if (this.cursors.up.isDown || this.keys.w.isDown) vy -= 1;
        if (this.cursors.down.isDown || this.keys.s.isDown) vy += 1;

        const v = new Phaser.Math.Vector2(vx, vy);
        if (v.length() > 0) {
          v.normalize();
          this.facing.copy(v);
          body.setVelocity(v.x * this.speed, v.y * this.speed);
          this.player.rotation = Math.sin(this.time.now / 80) * 0.025;
        } else {
          body.setVelocity(0, 0);
          this.player.rotation = 0;
        }
      }

      handleFarmAction() {
        if (this.actionCooldown > 0) return;
        this.actionCooldown = 220;

        const plot = this.getNearestPlot(70);
        if (!plot) {
          this.showMessage('밭 가까이에서 SPACE를 눌러보세요.');
          return;
        }

        if (plot.state === 'empty') {
          if (this.seeds <= 0) {
            this.showMessage('씨앗이 부족해요. 수확해서 코인을 모으면 다음 업데이트에서 상점 추가!');
            return;
          }
          this.seeds -= 1;
          plot.state = 'seed';
          plot.growth = 0;
          this.renderCrop(plot);
          this.showMessage('씨앗을 심었어요. 조금 기다리면 자라나요.');
          return;
        }

        if (plot.state === 'ready') {
          this.coins += 5;
          this.seeds += 2;
          plot.state = 'empty';
          plot.growth = 0;
          if (plot.crop) plot.crop.destroy();
          if (plot.sparkle) plot.sparkle.destroy();
          plot.crop = null;
          plot.sparkle = null;
          this.showMessage('+5 코인! 수확했어요. 씨앗도 2개 얻었어요.');
          this.popText(plot.x, plot.y - 36, '+5');
          return;
        }

        this.showMessage('아직 자라는 중이에요. 조금만 기다려요.');
      }

      updateCrops(delta) {
        for (const plot of this.plots) {
          if (plot.state === 'seed' || plot.state === 'growing') {
            plot.growth += delta;
            if (plot.growth > 1800 && plot.state === 'seed') {
              plot.state = 'growing';
              this.renderCrop(plot);
            }
            if (plot.growth > 4300 && plot.state === 'growing') {
              plot.state = 'ready';
              this.renderCrop(plot);
            }
          }
        }
      }

      renderCrop(plot) {
        if (plot.crop) plot.crop.destroy();
        if (plot.sparkle) plot.sparkle.destroy();

        if (plot.state === 'seed') {
          plot.crop = this.add.container(plot.x, plot.y - 12);
          plot.crop.add(this.add.circle(-8, 4, 4, 0x5f8d38));
          plot.crop.add(this.add.circle(8, 4, 4, 0x5f8d38));
          return;
        }

        if (plot.state === 'growing') {
          plot.crop = this.add.container(plot.x, plot.y - 16);
          for (let i = 0; i < 4; i++) {
            plot.crop.add(this.add.ellipse(-16 + i * 11, 2 - Math.sin(i) * 4, 18, 28, 0x66aa45).setAngle(i % 2 ? -18 : 18));
          }
          return;
        }

        if (plot.state === 'ready') {
          plot.crop = this.add.container(plot.x, plot.y - 20);
          for (let i = 0; i < 5; i++) {
            plot.crop.add(this.add.circle(-20 + i * 10, -2 + Math.sin(i) * 5, 10, 0xe8503a).setStrokeStyle(2, 0x7f2d22));
            plot.crop.add(this.add.ellipse(-20 + i * 10, -14 + Math.sin(i) * 5, 10, 8, 0x4c9b42));
          }
          plot.sparkle = this.add.text(plot.x + 25, plot.y - 48, '✦', {
            fontFamily: 'serif',
            fontSize: '24px',
            color: '#fff5a6'
          }).setOrigin(0.5);
          this.tweens.add({ targets: plot.sparkle, alpha: 0.2, duration: 500, yoyo: true, repeat: -1 });
        }
      }

      placeDecor() {
        const x = this.player.x + this.facing.x * 55;
        const y = this.player.y + this.facing.y * 55;

        if (x < 660 || x > 1010 || y < 585 || y > 770) {
          this.showMessage('꾸미기 마당 안에서 E를 눌러 설치해보세요.');
          return;
        }

        const cost = this.selectedDecor === 'lamp' ? 8 : 4;
        if (this.coins < cost) {
          this.showMessage(`${this.selectedDecorLabel()} 설치에는 ${cost} 코인이 필요해요.`);
          return;
        }

        this.coins -= cost;
        const item = this.drawDecor(x, y, this.selectedDecor);
        this.decorItems.push(item);
        this.showMessage(`${this.selectedDecorLabel()} 설치 완료! 집이 더 포근해졌어요.`);
      }

      drawDecor(x, y, type) {
        const c = this.add.container(x, y);
        if (type === 'pot') {
          c.add(this.add.rectangle(0, 12, 34, 28, 0xb86b42).setStrokeStyle(2, 0x70401f));
          c.add(this.add.circle(-10, -7, 10, 0xff9eb7));
          c.add(this.add.circle(7, -11, 9, 0xffd56b));
          c.add(this.add.circle(14, -3, 8, 0xffffff));
          c.add(this.add.ellipse(0, 0, 20, 13, 0x519d4b));
        }
        if (type === 'chair') {
          c.add(this.add.rectangle(0, 8, 52, 14, 0xa66a3f).setStrokeStyle(2, 0x65401f));
          c.add(this.add.rectangle(-20, 26, 8, 28, 0x7a4a2a));
          c.add(this.add.rectangle(20, 26, 8, 28, 0x7a4a2a));
          c.add(this.add.rectangle(0, -12, 48, 34, 0xc28852).setStrokeStyle(2, 0x65401f));
        }
        if (type === 'lamp') {
          c.add(this.add.rectangle(0, 10, 8, 64, 0x6b4a2c));
          c.add(this.add.circle(0, -28, 19, 0xffe282, 0.55));
          c.add(this.add.rectangle(0, -28, 26, 30, 0xffe282).setStrokeStyle(2, 0x6b4a2c));
          this.tweens.add({ targets: c.list[1], alpha: 0.2, duration: 800, yoyo: true, repeat: -1 });
        }
        return c;
      }

      selectedDecorLabel() {
        if (this.selectedDecor === 'pot') return '꽃 화분';
        if (this.selectedDecor === 'chair') return '나무 의자';
        return '정원 램프';
      }

      getNearestPlot(maxDistance) {
        let nearest = null;
        let best = Number.POSITIVE_INFINITY;
        for (const plot of this.plots) {
          const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, plot.x, plot.y);
          if (d < best) {
            best = d;
            nearest = plot;
          }
        }
        return best <= maxDistance ? nearest : null;
      }

      updateHud() {
        this.hudText.setText(`🌱 씨앗 ${this.seeds}   🪙 코인 ${this.coins}   🏡 ${this.selectedDecorLabel()}`);
      }

      showMessage(text) {
        this.messageText.setText(text);
        this.messageText.setAlpha(1);
        this.tweens.killTweensOf(this.messageText);
        this.tweens.add({
          targets: this.messageText,
          alpha: 0,
          delay: 2500,
          duration: 650
        });
      }

      popText(x, y, text) {
        const t = this.add.text(x, y, text, {
          fontFamily: 'system-ui',
          fontSize: '28px',
          fontStyle: '900',
          color: '#fff3a0',
          stroke: '#734019',
          strokeThickness: 5
        }).setOrigin(0.5);

        this.tweens.add({
          targets: t,
          y: y - 42,
          alpha: 0,
          duration: 900,
          onComplete: () => t.destroy()
        });
      }
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game',
      width: 1152,
      height: 768,
      backgroundColor: '#aee2ff',
      physics: {
        default: 'arcade',
        arcade: {
          debug: false
        }
      },
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      scene: [MainScene]
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
