<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STANCE | Music Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>STANCE PLAY</h1>
        </header>

        <main>
            <section class="player-card">
                <div class="info">
                    <h2 id="current-title">곡을 선택해주세요</h2>
                    <p id="current-artist">-</p>
                </div>
                <audio id="main-audio" controls></audio>
            </section>

            <section class="list-container">
                <ul id="music-list">
                    </ul>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
