<body><main><section class="hero"><div class="eyebrow">CURIOSITY HEAVEN · DIRECTOR GPT-6</div><h1>호기심 천국<span style="color:#a9c7ff">.</span></h1><p class="lead">세상에 당연한 것은 없다.<br>알고 있다고 생각했던 것에 다시 질문을 던져보자.</p><p>궁금한 질문을 누르면 구글 검색으로 이동합니다. 정답을 외우는 대신, 스스로 이해하는 즐거움.</p></section>
<div class="toolbar"><input id="search" type="search" placeholder="어떤 것이 궁금한가요?" aria-label="주제 검색"><button id="random">🎲 무작위 질문</button></div><div id="filters" class="chips"></div><div class="meta"><strong id="count"></strong><span style="color:#a9bad7;font-size:12px">질문을 누르면 새 탭에서 검색</span></div><section id="cards" class="grid"></section><footer>호기심 천국 · YAME.STORE 프로젝트 · 기획/주제 디렉터 GPT-6<br>질문과 분류는 아래 스크립트의 주제 목록에서 관리합니다.</footer></main>
<script>
const groups={
"물과 자연":["물고기는 물을 마실까?","비가 내리기 직전에 냄새가 나는 이유는?","강물은 왜 바다처럼 짜지 않을까?","얼음은 왜 물 위에 뜰까?","물방울은 왜 둥글어질까?","겨울 강물은 바닥까지 얼지 않을까?","바람은 보이지 않는데 어떻게 측정할까?","구름은 왜 하늘에서 떨어지지 않을까?","비눗방울은 왜 무지갯빛일까?","같은 물인데 깊어지면 왜 색이 달라질까?"],
"생물과 생태":["새우는 정말 물고기 배설물을 먹을까?","조개껍데기는 물속에서 녹을까?","물고기는 잠을 잘까?","물고기는 서로를 알아볼까?","식물은 밤에도 자랄까?","지렁이는 잘려도 살아남을까?","개미는 길을 어떻게 기억할까?","모기는 왜 어떤 사람을 더 잘 물까?","달팽이는 자기 집을 고칠 수 있을까?","씨앗은 어느 쪽이 위인지 어떻게 알까?"],
"우리 몸과 감각":["눈을 감으면 왜 시간이 다르게 느껴질까?","우리는 왜 자기 목소리가 녹음되면 낯설까?","하품은 왜 전염될까?","손가락이 물에 오래 있으면 왜 쭈글쭈글해질까?","매운맛은 정말 맛일까?","냄새는 왜 금방 익숙해질까?","눈앞에 코가 있는데 왜 평소에는 안 보일까?","차가운 물과 뜨거운 물을 번갈아 만지면 왜 감각이 달라질까?","꿈에서는 왜 이상한 일을 자연스럽게 받아들일까?","간지럼은 왜 스스로 태우기 어려울까?"],
"생활 속 물리":["젖은 빨래는 바람이 불면 왜 빨리 마를까?","전자레인지에서는 왜 음식이 고르게 데워지지 않을까?","빨대 속 음료는 어떻게 위로 올라올까?","유리는 정말 액체일까?","뜨거운 물이 찬물보다 먼저 얼 수도 있을까?","자석은 종이를 몇 장까지 통과할까?","금속은 왜 나무보다 차갑게 느껴질까?","종이 한 장을 몇 번이나 접을 수 있을까?","물속에 넣은 빨대는 왜 꺾여 보일까?","고무줄은 늘어나면 왜 따뜻해질까?"],
"시간과 일상의 착각":["달은 왜 지평선 근처에서 더 커 보일까?","같은 길인데 돌아올 때 더 짧게 느껴지는 이유는?","거울은 정말 좌우를 바꿀까?","선풍기를 틀면 방 안 온도가 내려갈까?","식물은 음악을 들으면 더 잘 자랄까?","사람은 정말 멀티태스킹을 할 수 있을까?","기억은 꺼낼 때마다 조금씩 바뀔까?","휴대전화 진동이 없는데 진동했다고 느끼는 이유는?","별빛은 왜 반짝이고 행성은 상대적으로 덜 반짝일까?","완전히 조용한 공간에서는 무엇이 들릴까?"]};
const items=Object.entries(groups).flatMap(([category,questions])=>questions.map(question=>({category,question})));let current="전체";
const filters=document.querySelector("#filters"),cards=document.querySelector("#cards"),search=document.querySelector("#search");
function render(){filters.replaceChildren();["전체",...Object.keys(groups)].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.className=c===current?"active":"";b.onclick=()=>{current=c;render()};filters.append(b)});
const term=search.value.trim().toLocaleLowerCase("ko");const filtered=items.filter(x=>(current==="전체"||x.category===current)&&x.question.toLocaleLowerCase("ko").includes(term));document.querySelector("#count").textContent=filtered.length+"개의 질문";
cards.replaceChildren();filtered.forEach(x=>{const a=document.createElement("a");a.className="card";a.target="_blank";a.rel="noopener noreferrer";a.href="https://www.google.com/search?q="+encodeURIComponent(x.question);const n=document.createElement("div");n.className="num";n.textContent=String(items.indexOf(x)+1).padStart(3,"0")+" / "+x.category;const q=document.createElement("div");q.className="question";q.textContent=x.question;const h=document.createElement("div");h.className="hint";h.textContent="궁금증 탐험하기 ↗";a.append(n,q,h);cards.append(a)})}
search.addEventListener("input",render);document.querySelector("#random").onclick=()=>{const x=items[Math.floor(Math.random()*items.length)];window.open("https://www.google.com/search?q="+encodeURIComponent(x.question),"_blank","noopener,noreferrer")};render();
</script></body></html>
