<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Gallery 관리자</title><style>*{box-sizing:border-box}body{background:#0b1017;color:#edf2f8;font:15px system-ui;margin:0}main{max-width:760px;margin:30px auto;padding:20px}h1{font-size:25px}label{display:block;margin:17px 0 6px;color:#b8c6d6}input,select,textarea,button{font:inherit;border-radius:9px;padding:12px}input,select,textarea{width:100%;background:#172231;color:white;border:1px solid #34475b}textarea{min-height:170px}button{background:#a8d3ff;border:0;color:#0a1420;font-weight:700;cursor:pointer}button:disabled{opacity:.5}section{padding:20px;background:#111a25;border:1px solid #29394b;border-radius:16px;margin:20px 0}.muted{color:#9caec1;font-size:13px;line-height:1.6}#log{white-space:pre-wrap}a{color:#a8d3ff}img{max-width:100%;border-radius:8px}</style></head><body><main><h1>TRADING GALLERY / ADMIN</h1><p class="muted">이미지는 space 폴더, 글은 UVB trading-gallery에 저장합니다. 관리자 접근은 서버에서 별도로 보호해야 합니다.</p><section><form id="form"><label>분류</label><select name="category"><option value="view">시장 관점</option><option value="video">매매 영상</option><option value="journal">매매 일지</option></select><label>제목</label><input name="title" required maxlength="150" placeholder="BTC 주요 저항 테스트"><label>종목</label><input name="symbol" placeholder="BTCUSDT"><label>방향</label><select name="direction"><option value="관찰">관찰</option><option value="LONG">LONG</option><option value="SHORT">SHORT</option><option value="NEUTRAL">NEUTRAL</option></select><label>시장 관점 / 기록</label><textarea name="view" required placeholder="지금 시장을 어떻게 보고 있는가?"></textarea><label>유튜브 링크 (선택)</label><input name="youtube_url" type="url" placeholder="https://youtu.be/..."><label>이미지 업로드 (space 폴더)</label><input id="photo" type="file" accept="image/*" multiple><p class="muted">이미지를 선택하면 먼저 space 폴더에 업로드합니다. 업로드가 성공한 뒤 글을 저장합니다.</p><button id="submit" type="submit">이미지 업로드 및 글 게시</button></form></section><section><strong>작업 결과</strong><p id="log" class="muted">대기 중</p><a href="./">갤러리로 돌아가기</a></section></main><script>const BASE='https://localflow.ddns.net',UPLOAD=BASE+'/images/api/gallery/space/upload',POST=BASE+'/uvb/v1/apps/trading-gallery/items';const form=document.getElementById('form'),log=document.getElementById('log'),btn=document.getElementById('submit');function message(s){log.textContent=s}form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;try{const fd=new FormData(form),files=document.getElementById('photo').files,images=[];if(files.length){message('space 이미지 업로드 중...');const upload=new FormData();for(const f of files)upload.append('images',f,f.name);const r=await fetch(UPLOAD,{method:'POST',body:upload});const raw=await r.text();if(!r.ok)throw Error('이미지 업로드 실패 HTTP '+r.status+' '+raw.slice(0,250));let data;try{data=JSON.parse(raw)}catch{throw Error('이미지 업로드 응답이 JSON이 아닙니다. 저장 중단.')}const found=data.files||data.images||data.items||data.data?.files||data.data?.items||[];for(const f of (Array.isArray(found)?found:[])){const url=typeof f==='string'?f:f.url||f.public_url||f.image_url||f.path;if(url)images.push(url)}if(!images.length)throw Error('이미지 업로드 응답에서 URL을 확인할 수 없어 글 저장을 중단했습니다. 중복 업로드에 주의하세요.')}message('이미지 '+images.length+'개 업로드 완료. 글 저장 중...')}const payload={category:fd.get('category'),title:String(fd.get('title')).trim(),symbol:String(fd.get('symbol')).trim(),direction:fd.get('direction'),view:String(fd.get('view')).trim(),youtube_url:String(fd.get('youtube_url')).trim(),images,created_at:new Date().toISOString(),source:'trading-gallery-admin'};const r=await fetch(POST,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const raw=await r.text();if(!r.ok)throw Error('UVB 글 저장 실패 HTTP '+r.status+' '+raw.slice(0,300));message('게시 요청 성공!\n'+raw.slice(0,500));form.reset()}catch(err){message('오류: '+err.message)}finally{btn.disabled=false}})</script></body></html>
