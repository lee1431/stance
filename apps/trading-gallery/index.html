<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Gallery</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0d12;color:#e8edf4;font:15px system-ui,sans-serif}header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #26303b}h1{font-size:23px;letter-spacing:.06em}small,.muted{color:#8b98a8}nav{display:flex;gap:16px}nav a,a{color:#a8d4ff;text-decoration:none}.hero{padding:55px 0 35px}.hero h2{font-size:clamp(30px,6vw,56px);margin:0 0 12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.filters button{background:#18202b;border:1px solid #344252;color:#dce7f2;padding:10px 16px;border-radius:20px;cursor:pointer}.filters button.active{background:#d8e9ff;color:#10151c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.card{border:1px solid #283442;border-radius:16px;overflow:hidden;background:#111821}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#202c38}.content{padding:18px}.tag{color:#8cc6ff;font-size:12px}h3{margin:9px 0}.body{white-space:pre-wrap;line-height:1.65}.empty{padding:40px 10px;color:#98a6b5}.meta{font-size:12px;color:#8997a6}footer{padding:35px 24px;text-align:center;color:#768594}</style></head><body><header><h1>TRADING GALLERY</h1><nav><a href="#views">Market Views</a><a href="#about">About</a></nav></header><main><section class="hero"><small>TRADING JOURNAL / MARKET PERSPECTIVE</small><h2>Trade the view.<br>Record the result.</h2><p class="muted">시장을 바라보는 관점과 실제 매매 영상을 기록합니다.</p></section><section id="views"><div class="filters"><button class="active" data-filter="all">전체</button><button data-filter="view">시장 관점</button><button data-filter="video">매매 영상</button><button data-filter="journal">매매 일지</button></div><div id="status" class="muted">기록을 불러오는 중...</div><div id="cards" class="grid"></div></section><section id="about" style="margin-top:65px"><h2>About</h2><p class="muted">투자 권유가 아닌 개인 매매 기록입니다. 모든 판단과 결과는 작성 당시의 관점입니다.</p></section></main><footer>© Trading Gallery</footer><script>const API='https://localflow.ddns.net/uvb/v1/apps/trading-gallery/items?page=1&page_size=100&order=desc';let entries=[],filter='all';const cards=document.getElementById('cards'),status=document.getElementById('status');function ytId(url){try{const u=new URL(url);if(['youtu.be','www.youtu.be'].includes(u.hostname))return u.pathname.slice(1).split('/')[0];if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname)){if(u.pathname==='/watch')return u.searchParams.get('v');if(u.pathname.startsWith('/shorts/'))return u.pathname.split('/')[2]}}catch{}return null}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function render(){cards.replaceChildren();let shown=entries.filter(e=>filter==='all'||(e.category||'view')===filter);status.textContent=shown.length?'':entries.length?'해당 분류의 기록이 없습니다.':'아직 등록된 기록이 없습니다.';for(const e of shown){const c=el('article','card'),id=ytId(e.youtube_url||'');if(id){const a=el('a');a.href='https://www.youtube.com/watch?v='+encodeURIComponent(id);a.target='_blank';a.rel='noopener noreferrer';const im=el('img','thumb');im.src='https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg';im.alt='매매 영상 썸네일';a.append(im);c.append(a)}const b=el('div','content');b.append(el('div','tag',(e.symbol||'MARKET')+' · '+(e.direction||'관찰')));b.append(el('h3','',e.title||'제목 없음'));b.append(el('p','body',e.view||e.body||''));b.append(el('div','meta',e.created_at||e.date||''));c.append(b);cards.append(c)}}document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));fetch(API).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{const a=Array.isArray(data)?data:Array.isArray(data.items)?data.items:Array.isArray(data.data?.items)?data.data.items:[];entries=a.filter(x=>x&&typeof x==='object');render()}).catch(err=>{status.textContent='UVB 연결 또는 데이터 조회 실패: '+err.message;});</script></body></html>
