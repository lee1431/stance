<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIFE OS | 무한 캔버스</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d1423;color:#e8eef9;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}header{position:absolute;z-index:10;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}header>*{pointer-events:auto}.brand{background:#1d2940d9;border:1px solid #3c4c68;border-radius:12px;padding:10px 13px;font-weight:800;letter-spacing:.06em}.muted{font-size:11px;color:#a9b8d2}.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:end}button{border:1px solid #43536c;border-radius:10px;background:#26364e;color:#e8eef9;padding:9px 12px}button:hover{background:#334966}button:focus-visible{outline:2px solid #a5b4fc}#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(#33445e 1px,transparent 1px);background-size:24px 24px}#viewport.moving{cursor:grabbing}#world{position:absolute;left:0;top:0;transform-origin:0 0}#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}.node{position:absolute;width:200px;min-height:80px;background:#1b2a40;border:1px solid #40536e;border-left:5px solid var(--accent);border-radius:14px;padding:13px 15px;box-shadow:0 10px 28px #0005;touch-action:none;user-select:none;cursor:move}.node.selected{outline:2px solid #c4b5fd}.node-note{margin-top:10px;padding:10px 2px 4px;border-top:1px solid #41516b;color:#cdd9ec;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;touch-action:pan-y;cursor:text}.node-toggle{display:block;width:100%;height:17px;margin:10px 0 -7px;padding:0;border:0;border-top:1px solid #40516b;border-radius:0;background:transparent;color:#93a8c6;font-size:11px;line-height:14px;text-align:center;cursor:pointer}.node-toggle:hover{background:#34455f;color:white}.node-title{font-weight:700;font-size:15px;overflow-wrap:anywhere}.node-meta{margin-top:10px;font-size:12px;color:#c2d0e3;display:flex;gap:6px;align-items:center}.dot{height:8px;width:8px;border-radius:50%;background:var(--accent)}#menu{position:fixed;z-index:20;background:#1e2d44;border:1px solid #526581;border-radius:14px;padding:10px;box-shadow:0 15px 40px #0009;min-width:196px;display:none}#menu h3{margin:5px 8px 10px;font-size:13px}#menu button{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;text-align:left;padding:9px}#menu button:hover{background:#34455f}.status-dot{width:10px;height:10px;border-radius:50%}#editor{position:fixed;z-index:21;right:12px;top:70px;width:min(340px,calc(100vw - 24px));background:#1b2a40;border:1px solid #455978;border-radius:16px;padding:16px;box-shadow:0 18px 50px #0009;display:none}#editor label{display:block;margin:12px 0 5px;font-size:12px;color:#b6c6db}#editor input,#editor textarea{width:100%;background:#101a2c;color:white;border:1px solid #50627e;border-radius:9px;padding:10px}#editor textarea{min-height:100px;resize:vertical}#editor .actions{display:flex;justify-content:space-between;margin-top:12px}footer{position:absolute;z-index:9;bottom:12px;left:12px;right:12px;display:flex;align-items:end;gap:8px;pointer-events:none}footer>*{pointer-events:auto}.help{background:#1b2a40d9;padding:9px;border-radius:10px;color:#b8c8de;font-size:11px;max-width:260px}.zoom{margin-left:auto;display:flex;align-items:center;gap:6px;background:#1b2a40d9;padding:5px;border-radius:12px}.zoom span{min-width:48px;text-align:center;font-size:12px}@media(max-width:620px){.brand{font-size:12px}.tools button{padding:8px;font-size:12px}.help{font-size:10px;max-width:175px}}
</style>
</head>
<body>
<div id="viewport" aria-label="LIFE OS 무한 캔버스"><div id="world"><svg id="edges"></svg><div id="nodes"></div></div></div>
<header><div class="brand">◉ LIFE OS <div class="muted">INFINITE CANVAS</div></div><div class="tools"><button id="add">＋ 노드</button><button id="fit">⌖ 전체보기</button><button id="export">JSON 내보내기</button><button id="exportXlsx">엑셀 내보내기</button><button id="import">가져오기</button><input id="file" type="file" accept=".json,.xlsx,.xls,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></div></header>
<div id="menu" role="menu" aria-label="노드 상태 변경"><h3>상태 변경</h3><div id="choices"></div><button id="editFromMenu">✎ 내용 편집</button><button id="childFromMenu">＋ 하위 노드</button></div>
<aside id="editor" role="dialog" aria-label="노드 편집"><strong>노드 편집</strong><label for="title">이름</label><input id="title" maxlength="120"><label for="note">메모</label><textarea id="note"></textarea><div class="actions"><button id="delete">삭제</button><div><button id="close">닫기</button><button id="save">저장</button></div></div></aside>
<footer><div class="help">빈 공간 드래그: 이동 · 휠/두 손가락: 확대 · 노드 꾹 누르기: 상태 · 더블클릭: 편집<br>변경사항은 이 브라우저에 자동 저장됩니다.</div><div class="zoom"><button id="minus">−</button><span id="percent">100%</span><button id="plus">＋</button></div></footer>
<script>
(()=>{
'use strict';
const KEY='life-os-canvas-v1';
const states={idea:['구상','#94a3b8'],plan:['계획','#60a5fa'],doing:['진행 중','#34d399'],hold:['보류','#fbbf24'],done:['완료','#a78bfa'],drop:['폐기','#fb7185']};
const seed=[{id:'root',title:'나의 인생',note:'내 삶의 전체 지도',x:100,y:80,parent:null,status:'doing'},{id:'business',title:'사업과 수익',note:'',x:-190,y:270,parent:'root',status:'plan'},{id:'life',title:'생활과 목표',note:'',x:410,y:270,parent:'root',status:'idea'},{id:'gacha',title:'온라인 라이브 뽑기방',note:'집게형 · 봉 밀기형 · 유튜브 라이브',x:-250,y:470,parent:'business',status:'doing'},{id:'fund',title:'창업지원 자금',note:'',x:20,y:480,parent:'business',status:'plan'}];
const $=id=>document.getElementById(id);
const viewport=$('viewport'),world=$('world'),nodesEl=$('nodes'),edges=$('edges'),menu=$('menu'),editor=$('editor');
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.nodes))data={nodes:seed,view:{x:innerWidth/2-200,y:60,scale:.85}};
let expanded=new Set(),selected=null,active=null,pointers=new Map(),gesture=null,holdTimer=null,held=false,saveTimer=null;
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('저장 실패',e)}},200)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function toWorld(x,y){return{x:(x-data.view.x)/data.view.scale,y:(y-data.view.y)/data.view.scale}}
function transform(){const v=data.view;world.style.transform='translate('+v.x+'px,'+v.y+'px) scale('+v.scale+')';viewport.style.backgroundSize=(24*v.scale)+'px '+(24*v.scale)+'px';viewport.style.backgroundPosition=v.x+'px '+v.y+'px';$('percent').textContent=Math.round(v.scale*100)+'%'}
function draw(){nodesEl.replaceChildren();edges.replaceChildren();for(const n of data.nodes){if(n.parent){const p=data.nodes.find(x=>x.id===n.parent);if(p){const path=document.createElementNS('http://www.w3.org/2000/svg','path');const x1=p.x+100,y1=p.y+40,x2=n.x+100,y2=n.y+40;path.setAttribute('d','M'+x1+' '+y1+' C'+x1+' '+((y1+y2)/2)+','+x2+' '+((y1+y2)/2)+','+x2+' '+y2);path.setAttribute('fill','none');path.setAttribute('stroke','#61738f');path.setAttribute('stroke-width','2');edges.append(path)}}}
for(const n of data.nodes){const el=document.createElement('div');el.className='node'+(selected===n.id?' selected':'');el.dataset.id=n.id;el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.setProperty('--accent',(states[n.status]||states.idea)[1]);const t=document.createElement('div');t.className='node-title';t.textContent=n.title;const m=document.createElement('div');m.className='node-meta';const dot=document.createElement('span');dot.className='dot';const label=document.createElement('span');label.textContent=(states[n.status]||states.idea)[0];m.append(dot,label);el.append(t,m);if(n.note&&n.note.trim()){if(expanded.has(n.id)){const note=document.createElement('div');note.className='node-note';note.textContent=n.note;el.append(note)}const toggle=document.createElement('button');toggle.type='button';toggle.className='node-toggle';toggle.dataset.toggle=n.id;toggle.setAttribute('aria-label',expanded.has(n.id)?'메모 접기':'메모 펼치기');toggle.setAttribute('aria-expanded',expanded.has(n.id)?'true':'false');toggle.textContent=expanded.has(n.id)?'⌃':'⌄';el.append(toggle)}nodesEl.append(el)}transform()}
function zoom(f,x,y){const v=data.view,old=v.scale,next=clamp(old*f,.15,3);v.x=x-(x-v.x)*next/old;v.y=y-(y-v.y)*next/old;v.scale=next;transform();persist()}
function closeMenu(){menu.style.display='none'}
function showMenu(id,x,y){active=id;selected=id;draw();const choices=$('choices');choices.replaceChildren();for(const [key,[name,color]] of Object.entries(states)){const b=document.createElement('button');const dot=document.createElement('span');dot.className='status-dot';dot.style.background=color;b.append(dot,document.createTextNode(name));b.onclick=()=>{const n=data.nodes.find(n=>n.id===id);if(n){n.status=key;persist();draw()}closeMenu()};choices.append(b)}menu.style.display='block';const w=menu.offsetWidth,h=menu.offsetHeight;menu.style.left=clamp(x,8,innerWidth-w-8)+'px';menu.style.top=clamp(y,8,innerHeight-h-8)+'px'}
function openEditor(id){const n=data.nodes.find(n=>n.id===id);if(!n)return;active=id;$('title').value=n.title;$('note').value=n.note||'';editor.style.display='block';closeMenu()}
function newNode(parent=null){const name=prompt('새 노드 이름');if(!name||!name.trim())return;const pos=parent?data.nodes.find(n=>n.id===parent):null;const center=toWorld(innerWidth/2,innerHeight/2);const n={id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:name.trim().slice(0,120),note:'',x:pos?pos.x+240:center.x-100,y:pos?pos.y+125:center.y-40,parent,status:'idea'};data.nodes.push(n);selected=n.id;draw();persist();closeMenu()}
viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
viewport.addEventListener('click',e=>{const toggle=e.target.closest('[data-toggle]');if(!toggle)return;e.stopPropagation();const id=toggle.dataset.toggle;if(expanded.has(id))expanded.delete(id);else expanded.add(id);draw()});
viewport.addEventListener('contextmenu',e=>{const node=e.target.closest('.node');if(node){e.preventDefault();showMenu(node.dataset.id,e.clientX,e.clientY)}});
viewport.addEventListener('dblclick',e=>{const node=e.target.closest('.node');if(node)openEditor(node.dataset.id)});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;closeMenu();if(editor.style.display==='block')return;const n=e.target.closest('.node');const isToggle=!!e.target.closest('[data-toggle]');if(isToggle)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){held=false;gesture={id:e.pointerId,node:n?.dataset.id||null,x:e.clientX,y:e.clientY,moved:false};if(n){selected=n.dataset.id;draw();holdTimer=setTimeout(()=>{held=true;gesture=null;showMenu(n.dataset.id,e.clientX,e.clientY)},600)}else{selected=null;draw()}}else{clearTimeout(holdTimer);gesture=null}viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const pts=[...pointers.values()];const old=[...pointers.values()];old[pointers.size===2&&[...pointers.keys()].indexOf(e.pointerId)===0?0:1]=prev;const dist=(p)=>Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);const cx=(pts[0].x+pts[1].x)/2,cy=(pts[0].y+pts[1].y)/2;const oldcx=(old[0].x+old[1].x)/2,oldcy=(old[0].y+old[1].y)/2;data.view.x+=cx-oldcx;data.view.y+=cy-oldcy;zoom(dist(pts)/Math.max(1,dist(old)),cx,cy);return}if(!gesture||gesture.id!==e.pointerId||held)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>5){clearTimeout(holdTimer);gesture.moved=true}if(gesture.moved){if(gesture.node){const n=data.nodes.find(n=>n.id===gesture.node);if(n){n.x+=dx/data.view.scale;n.y+=dy/data.view.scale;draw()}}else{data.view.x+=dx;data.view.y+=dy;transform()}persist()}gesture.x=e.clientX;gesture.y=e.clientY});
function release(e){pointers.delete(e.pointerId);clearTimeout(holdTimer);gesture=null}
viewport.addEventListener('pointerup',release);viewport.addEventListener('pointercancel',release);
$('add').onclick=()=>newNode();$('childFromMenu').onclick=()=>newNode(active);$('editFromMenu').onclick=()=>openEditor(active);
$('save').onclick=()=>{const n=data.nodes.find(n=>n.id===active);if(n){n.title=$('title').value.trim()||'이름 없음';n.note=$('note').value;persist();draw()}editor.style.display='none'};
$('close').onclick=()=>editor.style.display='none';
$('delete').onclick=()=>{if(!confirm('노드를 삭제할까요? 하위 노드는 최상위로 이동합니다.'))return;data.nodes=data.nodes.filter(n=>n.id!==active);for(const n of data.nodes)if(n.parent===active)n.parent=null;editor.style.display='none';selected=null;draw();persist()};
$('plus').onclick=()=>zoom(1.2,innerWidth/2,innerHeight/2);$('minus').onclick=()=>zoom(.8,innerWidth/2,innerHeight/2);
$('fit').onclick=()=>{if(!data.nodes.length)return;const xs=data.nodes.map(n=>n.x),ys=data.nodes.map(n=>n.y);const minX=Math.min(...xs),maxX=Math.max(...xs)+200,minY=Math.min(...ys),maxY=Math.max(...ys)+90;const s=clamp(Math.min((innerWidth-70)/(maxX-minX),(innerHeight-140)/(maxY-minY)),.15,1.5);data.view={scale:s,x:(innerWidth-(maxX-minX)*s)/2-minX*s,y:(innerHeight-(maxY-minY)*s)/2-minY*s};transform();persist()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='life-os-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let xlsxLoader=null;
function ensureXlsx(){if(window.XLSX)return Promise.resolve(window.XLSX);if(!xlsxLoader)xlsxLoader=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=XLSX_URL;script.onload=()=>window.XLSX?resolve(window.XLSX):reject(Error('엑셀 라이브러리를 불러오지 못했습니다'));script.onerror=()=>reject(Error('엑셀 라이브러리 다운로드 실패. 인터넷 연결을 확인하세요'));document.head.append(script)}).catch(err=>{xlsxLoader=null;throw err});return xlsxLoader}
function validateImport(obj){if(!obj||!Array.isArray(obj.nodes)||!obj.view||!Number.isFinite(obj.view.scale)||obj.view.scale<=0||!Number.isFinite(obj.view.x)||!Number.isFinite(obj.view.y))throw Error('올바른 LIFE OS 데이터가 아닙니다');const ids=new Set();for(const n of obj.nodes){if(!n||typeof n.id!=='string'||!n.id||ids.has(n.id)||typeof n.title!=='string'||!Number.isFinite(n.x)||!Number.isFinite(n.y))throw Error('노드 ID/제목/좌표가 올바르지 않습니다');ids.add(n.id);n.status=states[n.status]?n.status:'idea';n.note=typeof n.note==='string'?n.note:'';n.parent=typeof n.parent==='string'&&n.parent?n.parent:null}for(const n of obj.nodes)if(n.parent&&!ids.has(n.parent))n.parent=null;return obj}
$('exportXlsx').onclick=async()=>{try{const X=await ensureXlsx(),book=X.utils.book_new();const rows=data.nodes.map(n=>({id:n.id,title:n.title,note:n.note||'',status:n.status,parent:n.parent||'',x:n.x,y:n.y}));const sheet=X.utils.json_to_sheet(rows,{header:['id','title','note','status','parent','x','y']});sheet['!cols']=[{wch:25},{wch:35},{wch:55},{wch:14},{wch:25},{wch:14},{wch:14}];X.utils.book_append_sheet(book,sheet,'Nodes');X.utils.book_append_sheet(book,X.utils.json_to_sheet([{x:data.view.x,y:data.view.y,scale:data.view.scale}]),'Viewport');X.writeFile(book,'life-os-backup.xlsx')}catch(err){alert('엑셀 내보내기 실패: '+err.message)}};
function importRows(rows){const used=new Set(),nodes=[];const field=(row,keys)=>{for(const k of keys)if(row[k]!==undefined&&row[k]!==null&&String(row[k]).trim()!=='')return String(row[k]).trim();return ''};const raw=rows.filter(row=>field(row,['title','제목','이름','프로젝트']));if(!raw.length)throw Error('제목이 있는 행이 없습니다');raw.forEach((row,i)=>{let id=field(row,['id','ID','아이디'])||'import-'+(i+1);if(used.has(id))throw Error('중복 ID: '+id);used.add(id);nodes.push({id,title:field(row,['title','제목','이름','프로젝트']),note:field(row,['note','메모','설명']),status:field(row,['status','상태'])||'idea',parent:field(row,['parent','상위','상위ID','부모'])||null,x:field(row,['x','X']),y:field(row,['y','Y'])})});const byId=new Map(nodes.map(n=>[n.id,n]));for(const n of nodes){if(n.parent&&!byId.has(n.parent)){const matches=nodes.filter(p=>p.title===n.parent);n.parent=matches.length===1?matches[0].id:null}if(n.parent===n.id)n.parent=null}
const depth=(n,stack=new Set())=>{if(!n.parent||!byId.has(n.parent))return 0;if(stack.has(n.id))throw Error('상위 노드 연결에 순환 관계가 있습니다');stack.add(n.id);return Math.min(30,depth(byId.get(n.parent),stack)+1)};const groups=new Map();for(const n of nodes){const d=depth(n);if(!groups.has(d))groups.set(d,[]);groups.get(d).push(n)}for(const [d,list] of groups){list.forEach((n,i)=>{if(n.x===''||!Number.isFinite(Number(n.x)))n.x=d*300;if(n.y===''||!Number.isFinite(Number(n.y)))n.y=i*145})}return nodes.map(n=>({...n,x:Number(n.x),y:Number(n.y)}))}
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let obj;if(/\\.json$/i.test(f.name)){const raw=JSON.parse(await f.text());obj=Array.isArray(raw)?{nodes:importRows(raw),view:{...data.view}}:raw;if(obj&&Array.isArray(obj.nodes)&&obj.nodes.some(n=>n.x===undefined||n.y===undefined))obj={...obj,nodes:importRows(obj.nodes),view:obj.view||{...data.view}}}else if(/\\.xlsx?$/i.test(f.name)){const X=await ensureXlsx();const book=X.read(await f.arrayBuffer(),{type:'array'});const nodeSheet=book.Sheets['Nodes']||book.Sheets[book.SheetNames[0]];if(!nodeSheet)throw Error('시트를 찾을 수 없습니다');const rows=X.utils.sheet_to_json(nodeSheet,{defval:''});const nodes=importRows(rows);const viewSheet=book.Sheets['Viewport'];const vr=viewSheet?X.utils.sheet_to_json(viewSheet)[0]:null;const view=vr?{x:Number(vr.x),y:Number(vr.y),scale:Number(vr.scale)}:{...data.view};obj={nodes,view}}else throw Error('JSON 또는 XLSX 파일만 지원합니다');validateImport(obj);const choice=prompt('가져오기 방식: 1 = 기존 데이터 교체, 2 = 기존 데이터에 추가, 취소 = 중단','2');if(choice!=='1'&&choice!=='2')return;if(choice==='2'){const existing=new Set(data.nodes.map(n=>n.id));const mapping=new Map();for(const n of obj.nodes){let next=n.id;while(existing.has(next))next='copy-'+next;existing.add(next);mapping.set(n.id,next)}const imported=obj.nodes.map(n=>({...n,id:mapping.get(n.id),parent:n.parent?mapping.get(n.parent)||null:null,x:n.x+100,y:n.y+100}));data.nodes.push(...imported)}else{data=obj}selected=null;draw();persist();alert(obj.nodes.length+'개 노드를 가져왔습니다.')}catch(err){alert('가져오기 실패: '+err.message)}finally{e.target.value=''}};
document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&!e.target.closest('.node'))closeMenu()},true);
window.addEventListener('resize',transform);draw();
})();
</script></body></html>
