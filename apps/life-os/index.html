<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIFE OS | 무한 캔버스</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0d1423;color:#e8eef9;overflow:hidden}button,input,textarea,select{font:inherit}select{border:1px solid #43536c;border-radius:10px;background:#26364e;color:#e8eef9;padding:8px;max-width:130px}button{cursor:pointer}header{position:absolute;z-index:10;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}header>*{pointer-events:auto}.brand{background:#1d2940d9;border:1px solid #3c4c68;border-radius:12px;padding:10px 13px;font-weight:800;letter-spacing:.06em}.muted{font-size:11px;color:#a9b8d2}.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:end}button{border:1px solid #43536c;border-radius:10px;background:#26364e;color:#e8eef9;padding:9px 12px}button:hover{background:#334966}button:focus-visible{outline:2px solid #a5b4fc}#viewport{position:fixed;inset:0 0 calc(54px + env(safe-area-inset-bottom)) 0;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(#33445e 1px,transparent 1px);background-size:24px 24px}#viewport.moving{cursor:grabbing}#world{position:absolute;left:0;top:0;transform-origin:0 0}#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}.edge-hit{pointer-events:stroke;cursor:pointer;outline:none}.edge-hit:hover+.edge-line,.edge-hit:focus-visible+.edge-line{stroke:#fb7185;stroke-width:3}.edge-line{pointer-events:none}.node{position:absolute;width:200px;min-height:80px;background:#1b2a40;border:1px solid #40536e;border-left:5px solid var(--accent);border-radius:14px;padding:13px 15px;box-shadow:0 10px 28px #0005;touch-action:none;user-select:none;cursor:move}.node.selected{outline:2px solid #c4b5fd}.node.group-selected{outline:3px solid #38bdf8;box-shadow:0 0 22px #38bdf833}.node-note{margin-top:10px;padding:10px 2px 4px;border-top:1px solid #41516b;color:#cdd9ec;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;touch-action:pan-y;cursor:text}.node-toggle{display:block;width:100%;height:17px;margin:10px 0 -7px;padding:0;border:0;border-top:1px solid #40516b;border-radius:0;background:transparent;color:#93a8c6;font-size:11px;line-height:14px;text-align:center;cursor:pointer}.node-toggle:hover{background:#34455f;color:white}.node-title{font-weight:700;font-size:15px;overflow-wrap:anywhere}.node-meta{margin-top:10px;font-size:12px;color:#c2d0e3;display:flex;gap:6px;align-items:center}.dot{height:8px;width:8px;border-radius:50%;background:var(--accent)}#menu{position:fixed;z-index:20;background:#1e2d44;border:1px solid #526581;border-radius:14px;padding:10px;box-shadow:0 15px 40px #0009;min-width:196px;display:none}#menu h3{margin:5px 8px 10px;font-size:13px}#menu button{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;text-align:left;padding:9px}#menu button:hover{background:#34455f}.status-dot{width:10px;height:10px;border-radius:50%}#editor{position:fixed;z-index:21;right:12px;top:70px;width:min(340px,calc(100vw - 24px));background:#1b2a40;border:1px solid #455978;border-radius:16px;padding:16px;box-shadow:0 18px 50px #0009;display:none}#editor label{display:block;margin:12px 0 5px;font-size:12px;color:#b6c6db}#editor input,#editor textarea{width:100%;background:#101a2c;color:white;border:1px solid #50627e;border-radius:9px;padding:10px}#editor textarea{min-height:100px;resize:vertical}#editor .actions{display:flex;justify-content:space-between;margin-top:12px}footer{position:absolute;z-index:9;bottom:calc(66px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;align-items:end;gap:8px;flex-wrap:wrap;pointer-events:none}footer>*{pointer-events:auto}#clearGroup{flex-basis:100%;text-align:left;color:#7dd3fc}.help{background:#1b2a40d9;padding:9px;border-radius:10px;color:#b8c8de;font-size:11px;max-width:260px}.zoom{margin-left:auto;display:flex;align-items:center;gap:6px;background:#1b2a40d9;padding:5px;border-radius:12px}.zoom span{min-width:48px;text-align:center;font-size:12px}@media(max-width:620px){.brand{font-size:12px}.tools button{padding:8px;font-size:12px}.help{font-size:10px;max-width:175px}}
#tabbar{position:fixed;z-index:12;bottom:0;left:0;right:0;display:flex;align-items:center;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#101a2c;border-top:1px solid #40516b}#tabs{display:flex;gap:5px;min-width:0;overflow-x:auto;flex:1}.canvas-tab{display:flex;align-items:center;border:1px solid #34455f;border-radius:10px 10px 4px 4px;background:#18253b;flex-shrink:0}.canvas-tab.current{background:#344966;border-color:#7dd3fc}.canvas-tab button{border:0;background:transparent;padding:8px;border-radius:5px}.tab-name{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab-close{color:#9fb0c8}#tabbar>button{flex-shrink:0;padding:8px}#tabbar #renameTab{font-size:12px}#cloudDialog::backdrop{background:#0007}
</style>
</head>
<body>
<div id="viewport" aria-label="LIFE OS 무한 캔버스"><div id="world"><svg id="edges"></svg><div id="nodes"></div></div></div>
<header><div class="brand">◉ LIFE OS <div class="muted">INFINITE CANVAS</div></div><div class="tools"><button id="cloud">☁ 서버 연결</button><button id="newCanvas">새로 만들기</button><button id="add">＋ 노드</button><select id="layoutMode" aria-label="자동 배치 방식"><option value="radial">방사형</option><option value="vertical">수직 조직도 ↓</option><option value="horizontal">수평 조직도 →</option></select><button id="arrange">자동 배치</button><button id="fit">⌖ 전체보기</button><button id="export">현재 탭 JSON</button><button id="exportXlsx">현재 탭 엑셀</button><button id="import">가져오기</button><input id="file" type="file" accept=".json,.xlsx,.xls,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></div></header>
<div id="menu" role="menu" aria-label="노드 상태 변경"><h3>상태 변경</h3><div id="choices"></div><button id="editFromMenu">✎ 내용 편집</button><button id="childFromMenu">＋ 하위 노드</button></div>
<aside id="editor" role="dialog" aria-label="노드 편집"><strong>노드 편집</strong><label for="title">이름</label><input id="title" maxlength="120"><label for="note">메모</label><textarea id="note"></textarea><div class="actions"><button id="delete">삭제</button><div><button id="close">닫기</button><button id="save">저장</button></div></div></aside>
<footer><div class="help">빈 공간 드래그: 이동 · 휠/두 손가락: 확대 · 노드 꾹 누르기: 하위 전체 선택·상태 · 더블클릭: 편집 · 연결선 누르기: 연결 해제 · 파란 묶음 드래그: 함께 이동<br><span id="syncStatus" role="status">브라우저에 자동 저장 · 서버 미연결</span></div><button id="clearGroup" hidden></button><div class="zoom"><button id="minus">−</button><span id="percent">100%</span><button id="plus">＋</button></div></footer>
<nav id="tabbar" aria-label="지도 탭"><div id="tabs" role="tablist" aria-label="저장된 지도"></div><button id="addTab" aria-label="새 지도 탭 추가">＋</button><button id="renameTab">이름 변경</button></nav>
<dialog id="cloudDialog" style="background:#1b2a40;color:#e8eef9;border:1px solid #526581;border-radius:16px;width:min(400px,90vw)">
<form id="cloudForm"><h3>UVB 서버 저장</h3><p class="muted">다른 기기에서는 같은 공간 ID와 암호로 여세요. 암호는 서버에 보내지 않으며, 잊으면 복구할 수 없습니다. 한 번에 한 기기에서 편집하세요.</p>
<label>공간 ID (새로 만들 때 비워두기)<input id="spaceId" autocomplete="off" style="width:100%;margin:8px 0;padding:10px"></label>
<label>암호 (새 공간은 12자 이상)<input id="spacePassword" type="password" autocomplete="off" required style="width:100%;margin:8px 0;padding:10px"></label>
<p id="cloudMessage" role="status" class="muted"></p><button id="cloudSubmit">공간 열기 / 새로 만들기</button> <button id="cloudCancel" type="button">닫기</button>
</form><p><button id="cloudReload" type="button">서버 다시 불러오기</button> <button id="cloudRetry" type="button">저장 재시도</button> <button id="cloudDisconnect" type="button">연결 해제</button></p></dialog>
<script>
(()=>{
'use strict';
const KEY='life-os-canvas-v1';
const states={idea:['구상','#94a3b8'],plan:['계획','#60a5fa'],doing:['진행 중','#34d399'],hold:['보류','#fbbf24'],done:['완료','#a78bfa'],drop:['폐기','#fb7185']};
const $=id=>document.getElementById(id);
const viewport=$('viewport'),world=$('world'),nodesEl=$('nodes'),edges=$('edges'),menu=$('menu'),editor=$('editor');
const WORKSPACE_KEY='life-os-tabs-v2';
const makeId=()=>crypto.randomUUID?crypto.randomUUID():'tab-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const blankCanvas=()=>({nodes:[],view:{x:innerWidth/2-100,y:Math.max(180,innerHeight/3),scale:.85},layout:'free'});
const tabKey=id=>KEY+'-tab-'+id;
let workspace,data,tabSwitchBusy=false,importBusy=false;const tabSessions=new Map();
try{workspace=JSON.parse(localStorage.getItem(WORKSPACE_KEY))}catch{}
if(!workspace||workspace.version!==2||!Array.isArray(workspace.tabs)||!workspace.tabs.length){
let legacy;try{const value=JSON.parse(localStorage.getItem(KEY));if(value)legacy=validateImport(value)}catch{}
const first={id:makeId(),title:'내 지도',spaceId:localStorage.getItem(KEY+'-space')||''};workspace={version:2,active:first.id,tabs:[first]};
try{if(legacy)localStorage.setItem(tabKey(first.id),JSON.stringify(legacy));localStorage.setItem(WORKSPACE_KEY,JSON.stringify(workspace));localStorage.removeItem(KEY);localStorage.removeItem(KEY+'-space')}catch(error){console.warn('기존 지도 이전 실패',error)}
}
if(!workspace.tabs.some(t=>t.id===workspace.active))workspace.active=workspace.tabs[0].id;
try{data=validateImport(JSON.parse(localStorage.getItem(tabKey(workspace.active))))}catch{data=blankCanvas()}
function currentTab(){return workspace.tabs.find(t=>t.id===workspace.active)}
function saveWorkspace(){localStorage.setItem(WORKSPACE_KEY,JSON.stringify(workspace))}
function saveLocal(){localStorage.setItem(tabKey(workspace.active),JSON.stringify(data))}
const groupSelection=new Set();
let expanded=new Set(),selected=null,active=null,pointers=new Map(),gesture=null,holdTimer=null,held=false,saveTimer=null;
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;try{saveLocal();queueCloud()}catch(e){syncStatus('브라우저 저장 실패 · JSON으로 백업하세요');console.warn('저장 실패',e)}},200)}
let vault=null,cloudTimer=null,cloudBusy=false,cloudPending=false,cloudBlocked=false;
const CLOUD_API='https://localflow.ddns.net/uvb/v1/apps/life-os/items';
const encoder=new TextEncoder(),decoder=new TextDecoder();
const to64=bytes=>{let s='';for(const b of new Uint8Array(bytes))s+=String.fromCharCode(b);return btoa(s)};
const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function syncStatus(text){$('syncStatus').textContent=text}
async function cloudRequest(url,method='GET',body){const response=await fetch(url,{method,cache:'no-store',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(20000)});const result=await response.json();if(!response.ok||!result.ok)throw Error('UVB 응답 오류 '+response.status);return result.data}
async function deriveKey(password,salt){const material=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(salt),iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function sealCanvas(snapshot,key,salt,revision){const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:encoder.encode('life-os-v1|'+revision)},key,encoder.encode(JSON.stringify(snapshot)));return {type:'encrypted_life_os',version:1,salt,revision,iv:to64(iv),cipher:to64(cipher),updatedAt:new Date().toISOString()}}
async function readCanvas(payload,key){if(payload.type!=='encrypted_life_os'||payload.version!==1)throw Error('LIFE OS 공간이 아닙니다');let decoded;try{decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(payload.iv),additionalData:encoder.encode('life-os-v1|'+payload.revision)},key,from64(payload.cipher))}catch{throw Error('암호가 다르거나 데이터가 손상됐습니다')}return validateImport(JSON.parse(decoder.decode(decoded)))}
function queueCloud(){if(!vault)return;cloudPending=true;clearTimeout(cloudTimer);if(!cloudBlocked){syncStatus('브라우저 저장 완료 · 서버 저장 대기');cloudTimer=setTimeout(saveCloud,1000)}}
async function saveCloud(){if(!vault||cloudBusy||cloudBlocked||!cloudPending)return;cloudBusy=true;cloudPending=false;const currentVault=vault;syncStatus('UVB 저장 중…');try{const url=CLOUD_API+'/'+encodeURIComponent(currentVault.id),remote=await cloudRequest(url);if(remote.data.cipher!==currentVault.cipher){cloudBlocked=true;throw Error('다른 기기에서 변경됨. JSON 백업 후 서버 다시 불러오기를 누르세요')}const payload=await sealCanvas(JSON.parse(JSON.stringify(data)),currentVault.key,currentVault.salt,currentVault.revision+1);try{await cloudRequest(url,'PATCH',payload)}catch(error){const check=await cloudRequest(url);if(check.data.cipher!==payload.cipher)throw error}const check=await cloudRequest(url);if(check.data.cipher!==payload.cipher){cloudBlocked=true;throw Error('동시 저장 충돌. JSON 백업 후 서버 다시 불러오기를 누르세요')}currentVault.revision=payload.revision;currentVault.cipher=payload.cipher;syncStatus('UVB 저장 완료 · 공간 '+currentVault.id)}catch(error){cloudPending=true;syncStatus('브라우저 보관 · '+error.message)}finally{cloudBusy=false;if(cloudPending&&!cloudBlocked&&$('syncStatus').textContent.startsWith('UVB 저장 완료'))queueCloud()}}
$('cloud').onclick=()=>{$('spaceId').value=vault?.id||currentTab().spaceId||'';$('cloudMessage').textContent=vault?'연결된 공간: '+vault.id:'새 공간에는 현재 캔버스가 저장됩니다.';$('cloudDialog').showModal()};
$('cloudCancel').onclick=()=>{$('spacePassword').value='';$('cloudDialog').close()};
$('cloudForm').onsubmit=async event=>{event.preventDefault();if(cloudBusy)return;cloudBusy=true;clearTimeout(cloudTimer);$('cloudSubmit').disabled=true;try{const id=$('spaceId').value.trim(),password=$('spacePassword').value;if(id&&!/^[A-Za-z0-9_-]{5,80}$/.test(id))throw Error('공간 ID를 확인하세요');let next,nextData;
if(id){const remote=await cloudRequest(CLOUD_API+'/'+encodeURIComponent(id)),key=await deriveKey(password,remote.data.salt);nextData=await readCanvas(remote.data,key);if(!confirm('현재 캔버스를 서버 내용으로 바꿀까요? 필요한 내용은 먼저 JSON으로 내보내세요.'))return;next={id,key,salt:remote.data.salt,revision:remote.data.revision,cipher:remote.data.cipher}}
else{if(password.length<12)throw Error('새 공간 암호는 12자 이상입니다');const salt=to64(crypto.getRandomValues(new Uint8Array(16))),key=await deriveKey(password,salt),payload=await sealCanvas(data,key,salt,0),created=await cloudRequest(CLOUD_API,'POST',payload);if(!created.id)throw Error('공간 ID가 없는 서버 응답입니다');$('spaceId').value=created.id;$('cloudMessage').textContent='생성된 공간 ID: '+created.id;const check=await cloudRequest(CLOUD_API+'/'+encodeURIComponent(created.id));if(check.data.cipher!==payload.cipher)throw Error('저장 검증 실패. 표시된 공간 ID를 보관하세요');next={id:created.id,key,salt,revision:0,cipher:payload.cipher}}
vault=next;cloudPending=false;cloudBlocked=false;if(nextData){data=nextData;selected=null;groupSelection.clear();expanded.clear();draw()}saveLocal();currentTab().spaceId=vault.id;saveWorkspace();$('spacePassword').value='';$('spaceId').value=vault.id;$('cloudMessage').textContent='연결 완료. 공간 ID를 별도로 보관하세요: '+vault.id;syncStatus('UVB 연결됨 · 공간 '+vault.id)}catch(error){$('cloudMessage').textContent=error.message}finally{cloudBusy=false;$('cloudSubmit').disabled=false;}};
$('cloudRetry').onclick=()=>{if(!vault)return;cloudPending=true;saveCloud()};
$('cloudReload').onclick=async()=>{if(!vault||cloudBusy)return;if(!confirm('현재 브라우저 내용을 서버 내용으로 바꿀까요? 필요한 내용은 먼저 JSON으로 내보내세요.'))return;cloudBusy=true;clearTimeout(cloudTimer);try{const remote=await cloudRequest(CLOUD_API+'/'+encodeURIComponent(vault.id)),next=await readCanvas(remote.data,vault.key);data=next;vault.revision=remote.data.revision;vault.cipher=remote.data.cipher;cloudPending=false;cloudBlocked=false;selected=null;groupSelection.clear();expanded.clear();draw();saveLocal();syncStatus('UVB 불러오기 완료 · 공간 '+vault.id)}catch(error){$('cloudMessage').textContent=error.message}finally{cloudBusy=false}};
$('cloudDisconnect').onclick=()=>{if(cloudBusy)return;clearTimeout(cloudTimer);vault=null;cloudPending=false;cloudBlocked=false;syncStatus('브라우저에 자동 저장 · 서버 미연결');$('cloudMessage').textContent='연결 해제됨. 서버 데이터는 보관됩니다.'};
window.addEventListener('online',()=>{if(vault&&cloudPending)saveCloud()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{saveLocal()}catch{}if(vault){cloudPending=true;saveCloud()}}});
function renderTabs(){const list=$('tabs');let activeButton=null;list.replaceChildren();for(const tab of workspace.tabs){const wrap=document.createElement('div');wrap.className='canvas-tab'+(tab.id===workspace.active?' current':'');const name=document.createElement('button');name.className='tab-name';name.textContent=tab.title;name.setAttribute('role','tab');name.setAttribute('aria-selected',String(tab.id===workspace.active));if(tab.id===workspace.active)activeButton=name;name.onclick=()=>switchTab(tab.id);name.ondblclick=()=>renameTab(tab.id);const close=document.createElement('button');close.className='tab-close';close.textContent='×';close.setAttribute('aria-label',tab.title+' 탭 닫기');close.onclick=()=>closeTab(tab.id);wrap.append(name,close);list.append(wrap)}activeButton?.scrollIntoView?.({block:'nearest',inline:'nearest'})}
function resetInteraction(){clearTimeout(holdTimer);pointers.clear();gesture=null;held=false;selected=null;active=null;expanded.clear();groupSelection.clear();closeMenu();editor.style.display='none';$('spacePassword').value='';$('cloudDialog').close()}
function flushLocal(){const dirty=saveTimer!==null;clearTimeout(saveTimer);saveTimer=null;saveLocal();if(dirty)queueCloud()}
function rememberSession(){clearTimeout(cloudTimer);tabSessions.set(workspace.active,{vault,cloudPending,cloudBlocked,status:$('syncStatus').textContent})}
function restoreSession(){const session=tabSessions.get(workspace.active);vault=session?.vault||null;cloudPending=session?.cloudPending||false;cloudBlocked=session?.cloudBlocked||false;cloudBusy=false;syncStatus(session?.status||'브라우저에 자동 저장 · 서버 미연결');if(vault&&cloudPending&&!cloudBlocked)queueCloud()}
function allowTabAction(){if(cloudBusy||tabSwitchBusy||importBusy){alert('저장 또는 가져오기가 끝난 뒤 다시 시도하세요.');return false}return true}
async function switchTab(id){if(id===workspace.active||!workspace.tabs.some(t=>t.id===id))return;if(!allowTabAction())return;tabSwitchBusy=true;try{flushLocal();if(vault&&cloudPending&&!cloudBlocked)await saveCloud();flushLocal();rememberSession();workspace.active=id;try{data=validateImport(JSON.parse(localStorage.getItem(tabKey(id))))}catch{data=blankCanvas()}saveWorkspace();resetInteraction();restoreSession();draw();renderTabs()}catch(error){alert('탭 전환 실패: '+error.message)}finally{tabSwitchBusy=false}}
async function addTab(){if(!allowTabAction())return;const tab={id:makeId(),title:'새 지도 '+(workspace.tabs.length+1),spaceId:''};workspace.tabs.push(tab);await switchTab(tab.id);renderTabs()}
function renameTab(id=workspace.active){if(!allowTabAction())return;const tab=workspace.tabs.find(t=>t.id===id);if(!tab)return;const title=prompt('탭 이름',tab.title);if(!title?.trim())return;tab.title=title.trim().slice(0,60);saveWorkspace();renderTabs()}
function newCanvas(){if(!allowTabAction())return;if(!confirm('현재 탭의 브라우저 저장 내용을 지우고 새로 만들까요? 다른 탭과 UVB 원본은 유지됩니다.'))return;clearTimeout(saveTimer);clearTimeout(cloudTimer);saveTimer=null;vault=null;cloudPending=false;cloudBlocked=false;tabSessions.delete(workspace.active);localStorage.removeItem(tabKey(workspace.active));currentTab().spaceId='';data=blankCanvas();saveWorkspace();resetInteraction();syncStatus('새 지도 · 서버 미연결');draw();renderTabs()}

const depth=(n,stack=new Set())=>{if(!n.parent||!byId.has(n.parent))return 0;if(stack.has(n.id))throw Error('상위 노드 연결에 순환 관계가 있습니다');stack.add(n.id);return Math.min(30,depth(byId.get(n.parent),stack)+1)};const groups=new Map();for(const n of nodes){const d=depth(n);if(!groups.has(d))groups.set(d,[]);groups.get(d).push(n)}for(const [d,list] of groups){list.forEach((n,i)=>{if(n.x===''||!Number.isFinite(Number(n.x)))n.x=d*300;if(n.y===''||!Number.isFinite(Number(n.y)))n.y=i*145})}return nodes.map(n=>({...n,x:Number(n.x),y:Number(n.y)}))}
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;importBusy=true;try{let obj;if(/\.json$/i.test(f.name)){const raw=JSON.parse(await f.text());obj=Array.isArray(raw)?{nodes:importRows(raw),view:{...data.view}}:raw;if(obj&&Array.isArray(obj.nodes)&&obj.nodes.some(n=>n.x===undefined||n.y===undefined))obj={...obj,nodes:importRows(obj.nodes),view:obj.view||{...data.view}}}else if(/\.xlsx?$/i.test(f.name)){const X=await ensureXlsx();const book=X.read(await f.arrayBuffer(),{type:'array'});const nodeSheet=book.Sheets['Nodes']||book.Sheets[book.SheetNames[0]];if(!nodeSheet)throw Error('시트를 찾을 수 없습니다');const rows=X.utils.sheet_to_json(nodeSheet,{defval:''});const nodes=importRows(rows);const viewSheet=book.Sheets['Viewport'];const vr=viewSheet?X.utils.sheet_to_json(viewSheet)[0]:null;const view=vr?{x:Number(vr.x),y:Number(vr.y),scale:Number(vr.scale)}:{...data.view};obj={nodes,view,layout:vr?.layout||'free'}}else throw Error('JSON 또는 XLSX 파일만 지원합니다');validateImport(obj);const choice=prompt('가져오기 방식: 1 = 기존 데이터 교체, 2 = 기존 데이터에 추가, 취소 = 중단','2');if(choice!=='1'&&choice!=='2')return;if(choice==='2'){const existing=new Set(data.nodes.map(n=>n.id));const mapping=new Map();for(const n of obj.nodes){let next=n.id;while(existing.has(next))next='copy-'+next;existing.add(next);mapping.set(n.id,next)}const imported=obj.nodes.map(n=>({...n,id:mapping.get(n.id),parent:n.parent?mapping.get(n.parent)||null:null,x:n.x+100,y:n.y+100}));data.nodes.push(...imported)}else{data=obj}selected=null;groupSelection.clear();draw();persist();alert(obj.nodes.length+'개 노드를 가져왔습니다.')}catch(err){alert('가져오기 실패: '+err.message)}finally{importBusy=false;e.target.value=''}};
document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&!e.target.closest('.node'))closeMenu()},true);
window.addEventListener('pagehide',()=>{try{flushLocal();saveWorkspace()}catch{}});
window.addEventListener('resize',transform);draw();renderTabs();
})();
</script></body></html>
