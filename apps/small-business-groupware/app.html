<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작은회사 업무공간</title><meta name="theme-color" content="#162c38">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://localflow.ddns.net; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<section id="gate" class="gate"><a href="./" class="brand">← 작은회사</a><div class="gate-grid">
<form id="loginForm" class="panel"><p class="eyebrow">기존 조직</p><h1>개인 로그인</h1><label>공간 ID<input name="spaceId" required autocomplete="off"></label><label>조직 암호<input name="vaultPassword" type="password" minlength="12" required autocomplete="off"></label><label>로그인 ID<input name="loginId" required autocomplete="username"></label><label>개인 비밀번호<input name="password" type="password" minlength="8" required autocomplete="current-password"></label><button class="primary">로그인</button><p class="hint">조직 암호로 공간을 복호화하고 개인 비밀번호로 역할을 확인합니다.</p></form>
<form id="setupForm" class="panel"><p class="eyebrow">새 조직</p><h1>빈 공간 만들기</h1><label>조직명<input name="orgName" maxlength="100" required></label><label>조직 암호<input name="vaultPassword" type="password" minlength="12" required></label><label>대표 이름<input name="ownerName" maxlength="50" required></label><label>대표 로그인 ID<input name="loginId" required></label><label>대표 개인 비밀번호<input name="password" type="password" minlength="8" required></label><button class="primary">조직 생성</button><p class="hint">최대 9명. 기존 일손장부 데이터는 가져오지 않습니다.</p></form>
</div><p id="gateMessage" class="message" role="alert"></p></section>
<div id="workspace" hidden><header class="top"><button id="menuButton" class="icon-button" aria-label="메뉴">☰</button><b id="orgTitle">작은회사</b><span id="currentUser"></span><button id="logoutButton" class="subtle">로그아웃</button></header>
<div class="shell"><aside id="sidebar"><button data-view="dashboard">업무 현황</button><button data-view="board">업무공유보드</button><button data-view="members">구성원 관리</button><button data-view="ledger">일손장부</button><button data-view="audit">통합 검색·기록</button><button data-view="settings">환경설정</button></aside><main id="view" tabindex="-1"></main></div></div>
<dialog id="workDialog"><form id="workForm"><header><h2>업무 등록</h2><button type="button" id="closeWork" class="icon-button">✕</button></header><label>제목<input name="title" maxlength="150" required></label><label>설명<textarea name="description" maxlength="3000"></textarea></label><label>담당자<select name="assignees" multiple required></select></label><div class="two"><label>기한<input name="dueAt" type="datetime-local"></label><label>우선순위<select name="priority"><option>보통</option><option>높음</option><option>낮음</option></select></label></div><menu><button type="button" id="cancelWork" class="subtle">취소</button><button class="primary">저장</button></menu></form></dialog>
<dialog id="detailDialog"><div id="detailBody"></div></dialog><div id="toast" role="status"></div><script src="core.js?v=3"></script><script src="api.js?v=3"></script><script src="app.js?v=3"></script></body></html>
