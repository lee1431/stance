<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>날짜 차이 계산기 | 두 날짜 사이 일수·D-day 계산</title>
  <meta name="description" content="두 날짜 사이의 총 일수, 주+일, 평일 수와 D-day를 바로 계산하는 무료 날짜 차이 계산기입니다.">
  <meta name="keywords" content="날짜 차이 계산기, 일수 계산기, D-day 계산기, 디데이 계산, 두 날짜 사이 일수">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://llsshh.com/apps/date-difference-calculator/">
  <meta property="og:title" content="날짜 차이 계산기">
  <meta property="og:description" content="두 날짜 사이 일수·주수·평일 수·D-day를 한 번에 계산합니다.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://llsshh.com/apps/date-difference-calculator/">
  <meta property="og:image" content="https://llsshh.com/apps/date-difference-calculator/thumbnail.svg">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9382191250873184" crossorigin="anonymous"></script>
  <style>
    :root{font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171923;background:#f6f7fb;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f8f9fc 0%,#eef1f7 100%)}
    button,input{font:inherit}
    a{color:inherit}
    .wrap{width:min(920px,calc(100% - 32px));margin:0 auto;padding:48px 0 40px}
    .top{margin-bottom:24px}
    .eyebrow{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.12em;color:#5b63d8}
    h1{margin:0;font-size:clamp(32px,6vw,54px);line-height:1.08;letter-spacing:-.04em}
    .desc{margin:14px 0 0;color:#686b78;line-height:1.7;font-size:15px}
    .card{background:#fff;border:1px solid #e0e3ec;border-radius:24px;box-shadow:0 16px 50px rgba(31,35,53,.08);padding:24px}
    .dates{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end}
    label{display:block;font-size:13px;font-weight:800;color:#575b6d;margin-bottom:8px}
    input[type="date"]{width:100%;padding:14px 16px;border:1px solid #ccd0dc;border-radius:14px;background:#fff;color:#1d2030;outline:none}
    input[type="date"]:focus{border-color:#6d73e8;box-shadow:0 0 0 4px rgba(109,115,232,.12)}
    .swap{width:46px;height:46px;border:1px solid #d6d9e4;border-radius:14px;background:#f8f8fb;cursor:pointer;color:#505465;font-weight:900}
    .swap:hover{background:#eeeeff;color:#4f56cf}
    .options{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px;padding-top:18px;border-top:1px solid #eceef4}
    .check{display:flex;gap:8px;align-items:center;font-size:14px;color:#555968}
    .actions{margin-left:auto;display:flex;gap:8px}
    .btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}
    .primary{background:#24273a;color:#fff}
    .secondary{background:#f0f1f6;color:#484c60}
    .results{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
    .result{border:1px solid #e2e4ec;background:#fafbfe;border-radius:18px;padding:18px;min-height:118px}
    .result span{display:block;font-size:12px;font-weight:800;color:#777b8d;margin-bottom:10px}
    .result strong{display:block;font-size:clamp(22px,4vw,32px);letter-spacing:-.04em;line-height:1.2}
    .result small{display:block;margin-top:7px;color:#8a8e9c;line-height:1.45}
    .headline{margin-top:16px;padding:18px 20px;border-radius:16px;background:#25283a;color:#fff;font-size:16px;line-height:1.6}
    .headline b{color:#c9ccff}
    .hint{margin:16px 4px 0;color:#7b7f8f;font-size:13px;line-height:1.7}
    footer{padding-top:22px;text-align:center;color:#9699a6;font-size:12px}
    @media(max-width:720px){
      .wrap{width:min(100% - 22px,920px);padding-top:28px}
      .card{padding:18px;border-radius:20px}
      .dates{grid-template-columns:1fr}
      .swap{width:100%;height:42px}
      .options{align-items:stretch}
      .actions{width:100%;margin-left:0}
      .actions .btn{flex:1}
      .results{grid-template-columns:1fr 1fr}
    }
    @media(max-width:420px){.results{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <p class="eyebrow">DATE TOOL</p>
      <h1>날짜 차이 계산기</h1>
      <p class="desc">두 날짜를 고르면 총 일수, 주+일, 평일 수와 D-day를 즉시 계산합니다. 모든 계산은 브라우저에서만 처리됩니다.</p>
    </header>

    <section class="card" aria-labelledby="calcTitle">
      <h2 id="calcTitle" style="position:absolute;left:-9999px">날짜 차이 계산</h2>
      <div class="dates">
        <div>
          <label for="start">시작 날짜</label>
          <input id="start" type="date">
        </div>
        <button class="swap" id="swap" type="button" aria-label="시작 날짜와 종료 날짜 바꾸기">⇄</button>
        <div>
          <label for="end">종료 날짜</label>
          <input id="end" type="date">
        </div>
      </div>

      <div class="options">
        <label class="check"><input id="inclusive" type="checkbox"> 시작일과 종료일을 모두 포함</label>
        <div class="actions">
          <button class="btn secondary" id="today" type="button">오늘 기준</button>
          <button class="btn primary" id="calculate" type="button">계산하기</button>
        </div>
      </div>

      <div class="results" aria-live="polite">
        <div class="result"><span>총 일수</span><strong id="days">0일</strong><small>두 날짜 사이의 달력 일수</small></div>
        <div class="result"><span>주 + 일</span><strong id="weeks">0주 0일</strong><small>7일 단위로 환산</small></div>
        <div class="result"><span>평일 수</span><strong id="weekdays">0일</strong><small>월~금 기준, 공휴일 제외 없음</small></div>
        <div class="result"><span>D-day</span><strong id="dday">D-Day</strong><small id="direction">같은 날짜</small></div>
      </div>

      <div class="headline" id="headline">날짜를 선택하면 결과가 여기에 표시됩니다.</div>
      <p class="hint">※ 평일 수는 토·일만 제외합니다. 법정공휴일, 임시공휴일, 개인 휴무일은 반영하지 않습니다.</p>
    </section>

    <footer>llsshh.com · 간단한 계산 도구</footer>
  </main>

  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const DAY = 86400000;

    function toYMD(date){
      const y = date.getFullYear();
      const m = String(date.getMonth()+1).padStart(2,'0');
      const d = String(date.getDate()).padStart(2,'0');
      return y+'-'+m+'-'+d;
    }

    function parseDate(value){
      if(!value) return null;
      const [y,m,d] = value.split('-').map(Number);
      return new Date(Date.UTC(y,m-1,d));
    }

    function countWeekdays(a,b,inclusive){
      let start = new Date(Math.min(a.getTime(),b.getTime()));
      let end = new Date(Math.max(a.getTime(),b.getTime()));
      let count = 0;
      for(let t=start.getTime(); t<=end.getTime(); t+=DAY){
        if(!inclusive && t===end.getTime()) break;
        const day = new Date(t).getUTCDay();
        if(day!==0 && day!==6) count++;
      }
      return count;
    }

    function calculate(){
      const a = parseDate($('start').value);
      const b = parseDate($('end').value);
      if(!a || !b){
        $('headline').textContent='시작 날짜와 종료 날짜를 모두 선택해 주세요.';
        return;
      }

      const inclusive = $('inclusive').checked;
      const signed = Math.round((b-a)/DAY);
      const absBase = Math.abs(signed);
      const totalDays = absBase + (inclusive ? 1 : 0);
      const weeks = Math.floor(totalDays/7);
      const remain = totalDays%7;
      const weekdayCount = countWeekdays(a,b,inclusive);

      $('days').textContent = totalDays.toLocaleString('ko-KR')+'일';
      $('weeks').textContent = weeks.toLocaleString('ko-KR')+'주 '+remain+'일';
      $('weekdays').textContent = weekdayCount.toLocaleString('ko-KR')+'일';

      if(signed===0){
        $('dday').textContent='D-Day';
        $('direction').textContent='같은 날짜';
      }else if(signed>0){
        $('dday').textContent='D-'+absBase.toLocaleString('ko-KR');
        $('direction').textContent='종료일까지 '+absBase.toLocaleString('ko-KR')+'일';
      }else{
        $('dday').textContent='D+'+absBase.toLocaleString('ko-KR');
        $('direction').textContent='종료일이 '+absBase.toLocaleString('ko-KR')+'일 이전';
      }

      const fmt = new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'});
      const relation = signed===0 ? '같은 날짜입니다.' : (signed>0 ? '뒤입니다.' : '앞입니다.');
      $('headline').innerHTML = '<b>'+fmt.format(b)+'</b>은(는) <b>'+fmt.format(a)+'</b>보다 <b>'+absBase.toLocaleString('ko-KR')+'일</b> '+relation;
    }

    $('calculate').addEventListener('click',calculate);
    $('inclusive').addEventListener('change',calculate);
    $('start').addEventListener('change',calculate);
    $('end').addEventListener('change',calculate);
    $('swap').addEventListener('click',()=>{
      const tmp=$('start').value;
      $('start').value=$('end').value;
      $('end').value=tmp;
      calculate();
    });
    $('today').addEventListener('click',()=>{
      const now = new Date();
      const today = toYMD(now);
      if(!$('start').value) $('start').value=today;
      $('end').value=today;
      calculate();
    });

    const now = new Date();
    const today = toYMD(now);
    const nextWeek = new Date(now.getFullYear(),now.getMonth(),now.getDate()+7);
    $('start').value=today;
    $('end').value=toYMD(nextWeek);
    calculate();
  </script>
</body>
</html>
