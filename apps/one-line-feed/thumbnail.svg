<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f7f4ee"/><path d="M0 86h1200M0 544h1200" stroke="#171717" stroke-width="8"/><text x="90" y="195" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#171717">ONE LINE FEED</text><text x="90" y="330" font-family="Arial,sans-serif" font-size="108" font-weight="800" fill="#171717">한 줄이면 충분하다.</text><text x="94" y="405" font-family="Arial,sans-serif" font-size="30" fill="#777">설명도 댓글도 없이, 생각나는 한 줄만.</text></svg>