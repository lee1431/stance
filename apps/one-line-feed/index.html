<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="description" content="한 줄만 쓰는 미니 피드 게시판">
  <title>1라인 피드</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9382191250873184" crossorigin="anonymous"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    :root{font-family:Pretendard,system-ui,sans-serif;background:#f7f4ee;color:#171717}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;background:#f7f4ee}
    button,input{font:inherit}
    .wrap{width:min(760px,100%);margin:auto;padding:26px 18px 60px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:20px;border-bottom:2px solid #171717}
    .brand{font-size:22px;font-weight:950;letter-spacing:-.05em}
    .mode{font-size:10px;font-weight:900;letter-spacing:.12em;border:1px solid #171717;border-radius:999px;padding:6px 9px;background:#fff}
    .hero{padding:44px 0 28px}
    .hero h1{font-size:clamp(42px,9vw,76px);line-height:.96;letter-spacing:-.075em;margin:0 0 14px}
    .hero p{margin:0;color:#666;font-size:14px;line-height:1.65}
    .composer{display:grid;grid-template-columns:1fr auto;gap:10px;margin:14px 0 28px}
    .composer input{min-width:0;border:2px solid #171717;border-radius:0;background:#fff;padding:15px 16px;font-size:16px;outline:0}
    .composer input:focus{box-shadow:4px 4px 0 #171717}
    .composer button{border:2px solid #171717;background:#171717;color:#fff;padding:0 20px;font-weight:900;cursor:pointer}
    .composer button:active{transform:translate(1px,1px)}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;color:#777;font-size:11px}
    .feed{border-top:1px solid #aaa}
    .row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 2px;border-bottom:1px solid #bbb}
    .text{font-size:16px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
    .sub{margin-top:5px;color:#999;font-size:10px}
    .delete{border:0;background:transparent;color:#aaa;font-size:18px;cursor:pointer;padding:5px}
    .delete:hover{color:#171717}
    .empty{padding:54px 0;text-align:center;color:#aaa;font-size:13px}
    .footer{margin-top:30px;padding-top:16px;border-top:2px solid #171717;color:#888;font-size:10px;display:flex;justify-content:space-between;gap:12px}
    .status{margin-top:10px;font-size:11px;color:#888;min-height:16px}
    @media(max-width:520px){
      .wrap{padding:20px 14px 44px}
      .composer{grid-template-columns:1fr}
      .composer button{min-height:48px}
      .hero{padding-top:36px}
    }
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand">1라인 피드</div>
    <div class="mode" id="modeBadge">LOCAL</div>
  </header>

  <section class="hero">
    <h1>한 줄이면<br>충분하다.</h1>
    <p>설명도 댓글도 없다. 지금 생각나는 한 줄만 남긴다.</p>
  </section>

  <form class="composer" id="form">
    <input id="input" maxlength="120" autocomplete="off" placeholder="지금 생각나는 한 줄..." aria-label="한 줄 작성">
    <button type="submit">올리기</button>
  </form>
  <div class="status" id="status"></div>

  <div class="meta">
    <span>최신순</span>
    <span id="count">0 LINES</span>
  </div>

  <section class="feed" id="feed"></section>

  <footer class="footer">
    <span>ONE LINE FEED</span>
    <span>YAME MINI APP</span>
  </footer>
</main>

<script>
const CONFIG = {
  backendBase: 'https://mrdindoin.ddns.net/uvb',
  appId: 'one-line-feed',
  appToken: ''
};

const KEY = 'one-line-feed-v1';
const feed = document.getElementById('feed');
const form = document.getElementById('form');
const input = document.getElementById('input');
const count = document.getElementById('count');
const statusEl = document.getElementById('status');
const modeBadge = document.getElementById('modeBadge');

const useBackend = Boolean(CONFIG.appToken);
modeBadge.textContent = useBackend ? 'ONLINE' : 'LOCAL';

function localLoad(){
  try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}
}
function localSave(items){localStorage.setItem(KEY,JSON.stringify(items))}

function fmt(ts){
  const d = new Date(ts);
  return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d);
}
function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function api(path, options={}){
  const res = await fetch(CONFIG.backendBase + path,{
    ...options,
    headers:{
      'Authorization':'Bearer '+CONFIG.appToken,
      ...(options.headers||{})
    }
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||('HTTP '+res.status));
  return data;
}

async function load(){
  let items=[];
  if(useBackend){
    try{
      const r = await api('/v1/apps/'+CONFIG.appId+'/items?page=1&page_size=100&order=desc');
      items = (r.data && r.data.items ? r.data.items : []).map(x=>({
        id:x.id,
        text:x.data && x.data.text ? x.data.text : '',
        createdAt:(x.created_at||0)*1000,
        remote:true
      }));
      statusEl.textContent='';
    }catch(e){
      statusEl.textContent='백엔드 연결 실패 · 로컬 보기로 전환';
      items=localLoad();
    }
  }else{
    items=localLoad();
  }
  render(items);
}

function render(items){
  count.textContent = items.length+' LINES';
  if(!items.length){
    feed.innerHTML='<div class="empty">아직 아무 말도 없다.</div>';
    return;
  }
  feed.innerHTML=items.map(x=>`
    <article class="row" data-id="${esc(x.id)}">
      <div>
        <div class="text">${esc(x.text)}</div>
        <div class="sub">${fmt(x.createdAt)}</div>
      </div>
      <button class="delete" title="삭제" aria-label="삭제">×</button>
    </article>`
  ).join('');
}

form.addEventListener('submit', async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text) return;
  input.disabled=true;
  try{
    if(useBackend){
      await api('/v1/apps/'+CONFIG.appId+'/items',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text})
      });
    }else{
      const items=localLoad();
      items.unshift({id:crypto.randomUUID(),text,createdAt:Date.now()});
      localSave(items.slice(0,300));
    }
    input.value='';
    await load();
  }catch(e){
    statusEl.textContent='등록 실패: '+e.message;
  }finally{
    input.disabled=false;
    input.focus();
  }
});

feed.addEventListener('click', async e=>{
  const btn=e.target.closest('.delete');
  if(!btn) return;
  const row=btn.closest('.row');
  const id=row.dataset.id;
  try{
    if(useBackend){
      await api('/v1/apps/'+CONFIG.appId+'/items/'+encodeURIComponent(id),{method:'DELETE'});
    }else{
      localSave(localLoad().filter(x=>x.id!==id));
    }
    await load();
  }catch(e){
    statusEl.textContent='삭제 실패: '+e.message;
  }
});

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
load();
</script>
</body>
</html>
