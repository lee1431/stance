<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="붙여넣은 여러 줄 텍스트에서 중복 줄을 제거하는 간단한 무료 도구">
  <meta property="og:title" content="중복 줄 제거기">
  <meta property="og:description" content="텍스트에서 중복 줄을 빠르게 제거하고 결과를 복사하세요.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://llsshh.com/apps/dedupe-lines/">
  <meta property="og:image" content="https://llsshh.com/apps/dedupe-lines/thumbnail.svg">
  <title>중복 줄 제거기 | Dedupe Lines</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9382191250873184" crossorigin="anonymous"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f6f2;color:#171717}
    main{width:min(900px,100%);margin:auto;padding:24px 16px 48px}
    h1{margin:0 0 8px;font-size:clamp(28px,6vw,48px)}p{margin:0 0 24px;color:#666}
    .panel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:16px}
    textarea{width:100%;min-height:240px;resize:vertical;border:1px solid #bbb;border-radius:12px;padding:14px;font:15px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
    button{border:1px solid #171717;background:#171717;color:#fff;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}
    button.alt{background:#fff;color:#171717}
    .stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:#555;margin:8px 0 14px}
    label{display:flex;gap:8px;align-items:center;font-size:14px;color:#444}
    footer{margin-top:18px;font-size:12px;color:#888}
  </style>
</head>
<body>
  <main>
    <h1>중복 줄 제거기</h1>
    <p>여러 줄 텍스트를 붙여넣고 중복된 줄만 한 번에 정리합니다.</p>
    <section class="panel">
      <label><input id="trim" type="checkbox" checked> 앞뒤 공백을 무시하고 비교</label>
      <label><input id="blank" type="checkbox" checked> 빈 줄 제거</label>
      <div class="actions">
        <button id="run">중복 제거</button>
        <button id="copy" class="alt">결과 복사</button>
        <button id="clear" class="alt">비우기</button>
      </div>
      <div class="stats"><span id="before">입력 0줄</span><span id="after">결과 0줄</span><span id="removed">제거 0줄</span></div>
      <textarea id="text" placeholder="한 줄에 하나씩 입력하거나 붙여넣으세요."></textarea>
    </section>
    <footer>처리는 브라우저 안에서만 이루어집니다.</footer>
  </main>
  <script>
    const text=document.getElementById('text'),before=document.getElementById('before'),after=document.getElementById('after'),removed=document.getElementById('removed');
    function count(){
      const n=text.value===''?0:text.value.split(/\r?\n/).length;
      before.textContent='입력 '+n+'줄';
      return n;
    }
    text.addEventListener('input',()=>{const n=count();after.textContent='결과 '+n+'줄';removed.textContent='제거 0줄';});
    document.getElementById('run').onclick=()=>{
      const input=text.value.split(/\r?\n/),trim=document.getElementById('trim').checked,blank=document.getElementById('blank').checked;
      const seen=new Set(),out=[];
      for(const line of input){
        const key=trim?line.trim():line;
        if(blank && key==='') continue;
        if(seen.has(key)) continue;
        seen.add(key); out.push(line);
      }
      const b=input.length;
      text.value=out.join('\n');
      before.textContent='입력 '+b+'줄';
      after.textContent='결과 '+out.length+'줄';
      removed.textContent='제거 '+(b-out.length)+'줄';
    };
    document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(text.value);document.getElementById('copy').textContent='복사됨';setTimeout(()=>document.getElementById('copy').textContent='결과 복사',1200)};
    document.getElementById('clear').onclick=()=>{text.value='';count();after.textContent='결과 0줄';removed.textContent='제거 0줄';text.focus()};
    count();
  </script>
</body>
</html>
