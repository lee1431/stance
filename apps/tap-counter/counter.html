<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f4f1e8'><meta name='description' content='물건과 반복 작업을 빠르게 세는 오프라인 탭 카운터'><title>탭 카운터</title><link rel='manifest' href='./manifest.webmanifest'><link rel='icon' href='./icon.svg'><link rel='stylesheet' href='./style.css'></head><body><main class='app'><header><strong>탭 카운터</strong><span>OFFLINE PWA</span></header><section class='counter'><input id='label' maxlength='30' value='오늘 카운트'><div id='count' class='count'>0</div><button id='tap' class='tap' type='button'>+ 1</button><div class='grid'><button id='minus' type='button'>- 1</button><button id='plus10' type='button'>+ 10</button></div><div class='grid tools'><button id='undo' type='button'>되돌리기</button><button id='reset' type='button'>0으로 초기화</button></div><div class='meta'><span>브라우저에 자동 저장</span><span id='saved'>저장됨</span></div></section></main><script src='./app.js'></script></body></html>
