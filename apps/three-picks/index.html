<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="오늘 해야 할 일 딱 3개만 정하고 끝내는 초간단 PWA">
  <title>3픽 - 오늘의 세 가지</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9382191250873184" crossorigin="anonymous"></script>
  <style>
    :root{font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#f9fafb;background:#0b1020}
    *{box-sizing:border-box} body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -10%,#263454 0,transparent 38%),#0b1020}
    button,input{font:inherit}.wrap{width:min(680px,100%);margin:auto;padding:28px 18px 52px}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:34px}
    .brand{font-weight:900;letter-spacing:-.05em;font-size:26px}.date{font-size:12px;color:#94a3b8}
    .hero{margin-bottom:24px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;color:#86efac}
    h1{font-size:clamp(36px,9vw,64px);line-height:.98;letter-spacing:-.07em;margin:10px 0 12px}
    .sub{color:#9ca3af;line-height:1.65;font-size:14px;margin:0}
    .progress{height:7px;background:#1f2937;border-radius:999px;overflow:hidden;margin:24px 0 10px}
    .bar{height:100%;width:0;background:#86efac;transition:.25s}.score{font-size:12px;color:#9ca3af;text-align:right}
    .list{display:grid;gap:12px;margin-top:18px}
    .item{display:grid;grid-template-columns:42px 1fr 38px;gap:10px;align-items:center;background:#121a2c;border:1px solid #24304a;border-radius:18px;padding:14px}
    .num{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#1d2941;color:#86efac;font-weight:900}
    input{width:100%;border:0;outline:0;background:transparent;color:#f9fafb;font-size:17px;font-weight:700}
    input::placeholder{color:#64748b}.check{appearance:none;width:30px;height:30px;border:2px solid #475569;border-radius:10px;cursor:pointer;position:relative}
    .check:checked{background:#86efac;border-color:#86efac}.check:checked:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#082f1c;font-weight:1000}
    .item.done input{text-decoration:line-through;color:#64748b}
    .actions{display:flex;gap:10px;margin-top:18px}.btn{flex:1;border:1px solid #334155;background:#151f33;color:#e5e7eb;padding:13px 14px;border-radius:14px;font-weight:800;cursor:pointer}
    .btn.primary{background:#86efac;color:#0b1020;border-color:#86efac}
    .note{margin-top:26px;padding:16px;border-radius:16px;background:#0f172a;border:1px dashed #334155;color:#94a3b8;font-size:12px;line-height:1.7}
    .install{display:none;margin-top:12px;width:100%}
    footer{text-align:center;color:#475569;font-size:11px;margin-top:32px}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div class="brand">3픽</div><div class="date" id="date"></div></header>
    <section class="hero">
      <div class="eyebrow">THREE PICKS</div>
      <h1>오늘은<br>세 가지만.</h1>
      <p class="sub">할 일을 늘리지 말고, 오늘 끝낼 세 가지를 정하세요.<br>데이터는 이 기기에만 저장됩니다.</p>
    </section>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="score" id="score">0 / 3 완료</div>
    <section class="list" id="list"></section>
    <div class="actions">
      <button class="btn" id="reset">오늘 초기화</button>
      <button class="btn primary" id="focus">빈칸으로 이동</button>
    </div>
    <button class="btn install" id="install">홈 화면에 설치</button>
    <div class="note">팁: 세 가지 중 하나는 아주 작게 잡아도 됩니다. 중요한 건 목록을 늘리는 것이 아니라 오늘 끝내는 것입니다.</div>
    <footer>3픽 · local-first mini PWA</footer>
  </main>
<script>
const KEY='three-picks-v1';
const today=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());
document.getElementById('date').textContent=today;
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{date:new Date().toDateString(),items:[{text:'',done:false},{text:'',done:false},{text:'',done:false}]};
if(state.date!==new Date().toDateString()) state={date:new Date().toDateString(),items:[{text:'',done:false},{text:'',done:false},{text:'',done:false}]};
const list=document.getElementById('list');
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){
  list.innerHTML='';
  state.items.forEach((it,i)=>{
    const row=document.createElement('label'); row.className='item'+(it.done?' done':'');
    row.innerHTML='<div class="num">'+(i+1)+'</div><input maxlength="80" placeholder="'+['가장 중요한 일','두 번째 할 일','마지막 한 가지'][i]+'"><input class="check" type="checkbox">';
    const text=row.querySelector('input:not(.check)'), check=row.querySelector('.check');
    text.value=it.text; check.checked=it.done;
    text.addEventListener('input',e=>{state.items[i].text=e.target.value;save()});
    check.addEventListener('change',e=>{state.items[i].done=e.target.checked;save();render()});
    list.appendChild(row);
  });
  const done=state.items.filter(x=>x.done).length;
  document.getElementById('bar').style.width=(done/3*100)+'%';
  document.getElementById('score').textContent=done+' / 3 완료';
}
document.getElementById('reset').onclick=()=>{if(confirm('오늘의 3픽을 모두 비울까요?')){state.items.forEach(x=>{x.text='';x.done=false});save();render()}};
document.getElementById('focus').onclick=()=>{const inputs=[...document.querySelectorAll('.item input:not(.check)')];(inputs.find(x=>!x.value.trim())||inputs[0]).focus()};
render();
let deferredPrompt; const install=document.getElementById('install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.style.display='block'});
install.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.style.display='none'};
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
