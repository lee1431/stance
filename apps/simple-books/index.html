<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172c32"><title>한눈경리 · 소상공인 장부</title><meta name="description" content="매출·매입·입출금·미수금과 월 손익을 한 화면에서 관리하는 간단한 경리 웹앱"><link rel="canonical" href="https://llsshh.com/apps/simple-books/"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9382191250873184" crossorigin="anonymous"></script><script defer src="./app.js"></script></head><body><header><a href="https://yame.store/">YAME</a><strong>한눈경리</strong><button id="export">CSV 내보내기</button></header><main><section class="hero"><div><small>SMALL BUSINESS BOOKKEEPING</small><h1>돈 들어오고 나간 것부터<br>제대로 기록하자.</h1><p>복잡한 회계 프로그램 전에, 사업의 현금 흐름과 받을 돈부터 한눈에.</p></div><button id="add">+ 거래 등록</button></section><section class="cards"><article><span>이번 달 매출</span><b id="sales">0원</b></article><article><span>이번 달 매입·비용</span><b id="cost">0원</b></article><article><span>이번 달 손익</span><b id="profit">0원</b></article><article><span>받을 돈</span><b id="receivable">0원</b></article></section><section class="panel"><div class="bar"><h2>거래 장부</h2><div><input id="month" type="month"><select id="filter"><option value="">전체</option><option>매출</option><option>매입</option><option>비용</option></select></div></div><div class="table"><table><thead><tr><th>날짜</th><th>구분</th><th>거래처/내용</th><th>금액</th><th>결제</th><th></th></tr></thead><tbody id="rows"></tbody></table><p id="empty">아직 거래가 없습니다. 첫 거래를 등록하세요.</p></div></section><p class="note">데이터는 이 기기의 브라우저에 저장됩니다. 중요한 장부는 CSV로 정기 백업하세요. 세금 신고용 회계·세무 판단은 별도 확인이 필요합니다.</p></main><dialog id="dlg"><form id="form"><div class="dialog-head"><h2>거래 등록</h2><button type="button" id="close">×</button></div><label>날짜<input name="date" type="date" required></label><label>구분<select name="type"><option>매출</option><option>매입</option><option>비용</option></select></label><label>거래처 / 내용<input name="memo" maxlength="80" required placeholder="예: 코사마트 납품"></label><label>금액<input name="amount" type="number" min="0" step="1" required inputmode="numeric"></label><label>결제 상태<select name="status"><option>결제완료</option><option>미수</option><option>미지급</option></select></label><label>메모<textarea name="note" maxlength="200"></textarea></label><button class="primary">저장</button></form></dialog></body></html>
