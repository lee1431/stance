<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">복사했는데 원본도 바뀐 객체 참조</title><desc id="desc">original과 copy 두 이름의 화살표가 같은 중첩 객체를 가리키다가 깊은 복사에서 두 객체 그래프로 갈라지는 개념 표지</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#51466e" stroke-opacity=".22"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#201a35"/><stop offset="1" stop-color="#3e315d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="780" fill="url(#bg)"/><rect width="1200" height="780" fill="url(#grid)"/><text x="70" y="76" fill="#d8d0ed" font-family="ui-monospace,monospace" font-size="17" letter-spacing="4">OBJECT · IDENTITY · COPY · TRANSFER</text>
<g filter="url(#shadow)"><rect x="70" y="126" width="1060" height="492" rx="28" fill="#f7f4fb"/></g>
<g font-family="Arial,sans-serif"><rect x="120" y="190" width="230" height="82" rx="14" fill="#2f2847"/><text x="235" y="223" fill="#fff" font-size="18" text-anchor="middle">original</text><text x="235" y="251" fill="#f4c45e" font-size="15" text-anchor="middle">REFERENCE A</text><rect x="120" y="350" width="230" height="82" rx="14" fill="#2f2847"/><text x="235" y="383" fill="#fff" font-size="18" text-anchor="middle">copy</text><text x="235" y="411" fill="#f4c45e" font-size="15" text-anchor="middle">REFERENCE A</text>
<path d="M350 231 C440 231 435 326 540 326" fill="none" stroke="#d99c2b" stroke-width="8"/><path d="M350 391 C440 391 435 326 540 326" fill="none" stroke="#d99c2b" stroke-width="8"/><path d="m531 314 18 12-18 12" fill="none" stroke="#d99c2b" stroke-width="7"/>
<rect x="555" y="195" width="470" height="265" rx="22" fill="#e6e0f1" stroke="#6d5d96" stroke-width="3"/><text x="790" y="236" fill="#302745" font-size="18" text-anchor="middle" font-weight="700">OBJECT A</text><rect x="610" y="270" width="360" height="130" rx="16" fill="#fff3ce" stroke="#d99c2b" stroke-width="3"/><text x="790" y="309" fill="#302745" font-size="17" text-anchor="middle" font-weight="700">profile</text><text x="790" y="354" fill="#9b6721" font-size="29" text-anchor="middle">city: “원주”</text><text x="790" y="385" fill="#6d5d96" font-size="14" text-anchor="middle">한 곳을 바꾸자 두 이름에서 함께 보인다</text>
<line x1="555" y1="492" x2="1025" y2="492" stroke="#b2aac5" stroke-width="2" stroke-dasharray="8 8"/><text x="790" y="540" fill="#6d5d96" font-size="18" text-anchor="middle">DEEP COPY → OBJECT A′ · NESTED B′</text></g>
<text x="70" y="682" fill="#f4c45e" font-family="Arial,sans-serif" font-size="37" font-weight="700">복사는 상자를 옮기는 일이 아니라</text><text x="70" y="729" fill="#fff" font-family="Arial,sans-serif" font-size="37" font-weight="700">관계를 다시 그리는 일이다.</text><text x="1128" y="727" text-anchor="end" fill="#d8d0ed" font-family="ui-monospace,monospace" font-size="16">THE WORLD BEHIND THE SCREEN</text>
</svg>
