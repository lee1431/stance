  <g font-family="ui-monospace,Consolas,monospace" fill="#f8f4e9">
    <text x="76" y="92" font-size="17" letter-spacing="4">ISSUE 12 · THE CHAIN OF TRUST</text>
    <text x="76" y="680" font-size="52" font-weight="800" letter-spacing="-3">자물쇠가 떴는데,</text>
    <text x="76" y="740" font-size="52" font-weight="800" letter-spacing="-3" fill="#f2b866">누가 이 서버를 믿으라 했지?</text>
