<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">이 사이트를 누가 증명했을까</title>
  <desc id="desc">브라우저와 웹사이트 사이에 서버 인증서, 중간 인증기관, 신뢰 루트가 서명 사슬로 연결되는 개념 표지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102f36"/>
      <stop offset="1" stop-color="#1d4a50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#07191d" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="780" fill="url(#bg)"/>
  <path d="M0 630C260 520 480 745 760 615s330-40 440 20v145H0z" fill="#0b2429" opacity=".58"/>
  <g fill="none" stroke="#f2b866" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 13" opacity=".9">
    <path d="M263 388C350 300 406 300 475 349"/>
    <path d="M603 344C678 290 750 290 827 345"/>
  </g>
