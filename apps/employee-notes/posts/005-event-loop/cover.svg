<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">화면이 기다리는 차례</title><desc id="desc">상단의 긴 작업이 클릭과 화면의 차례를 막고, 하단의 나눈 작업 사이에는 입력과 화면 갱신을 위한 틈이 생기는 개념 삽화</desc>
