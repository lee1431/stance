<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">지웠는데, 왜 디스크가 안 비었지?</title><desc id="desc">삭제된 이름표는 떨어졌지만 프로세스 손잡이와 하드 링크, 스냅샷이 데이터 블록을 붙잡는 개념 표지</desc><rect width="1200" height="780" fill="#f2eee5"/><path d="M0 0h1200v52H0zM0 728h1200v52H0z" fill="#183a39"/><g stroke="#d4c9b8" stroke-width="1"><path d="M80 110h1040M80 670h1040M130 80v620M1070 80v620"/></g><text x="90" y="35" fill="#f2eee5" font-family="monospace" font-size="16" letter-spacing="3">EMPLOYEE 01 · ISSUE 15 · FILE LIFETIME</text><text x="1110" y="35" text-anchor="end" fill="#7fd0c2" font-family="monospace" font-size="15">2026.10.05</text><g transform="translate(170 148)"><rect x="0" y="0" width="320" height="170" rx="8" fill="#fffdf8" stroke="#183a39" stroke-width="4"/><path d="M40 48h190M40 82h235M40 116h160" stroke="#9b482e" stroke-width="12" stroke-linecap="round"/><text x="160" y="205" text-anchor="middle" fill="#9b482e" font-family="sans-serif" font-size="20" font-weight="700">NAME REMOVED</text><path d="M80 240l160 0" stroke="#9b482e" stroke-width="5" stroke-dasharray="10 10"/></g><g transform="translate(710 128)"><rect x="0" y="0" width="300" height="220" rx="18" fill="#183a39"/><text x="150" y="52" text-anchor="middle" fill="#7fd0c2" font-family="monospace" font-size="18">INODE 8042</text><text x="150" y="103" text-anchor="middle" fill="#fffdf8" font-family="sans-serif" font-size="31" font-weight="700">8 GB BLOCKS</text><g fill="#3c8c83"><rect x="48" y="135" width="42" height="42" rx="4"/><rect x="103" y="135" width="42" height="42" rx="4"/><rect x="158" y="135" width="42" height="42" rx="4"/><rect x="213" y="135" width="42" height="42" rx="4"/></g></g><g fill="none" stroke="#3c8c83" stroke-width="7"><path d="M570 390c0-85 65-85 65 0v76c0 72 105 72 105 0V350"/><path d="M420 440c40 0 40 80 80 80s40-80 80-80"/></g><g font-family="monospace" font-size="17" font-weight="700"><rect x="360" y="402" width="190" height="76" rx="38" fill="#fffdf8" stroke="#183a39" stroke-width="3"/><text x="455" y="448" text-anchor="middle" fill="#183a39">PROCESS FD 7</text><rect x="650" y="475" width="190" height="76" rx="38" fill="#fffdf8" stroke="#183a39" stroke-width="3"/><text x="745" y="521" text-anchor="middle" fill="#183a39">HARD LINK</text><rect x="870" y="402" width="190" height="76" rx="38" fill="#fffdf8" stroke="#183a39" stroke-width="3"/><text x="965" y="448" text-anchor="middle" fill="#183a39">SNAPSHOT</text></g><text x="600" y="614" text-anchor="middle" fill="#183a39" font-family="sans-serif" font-size="48" font-weight="800">지웠는데, 왜 디스크가 안 비었지?</text><text x="600" y="657" text-anchor="middle" fill="#61706b" font-family="sans-serif" font-size="19">이름이 사라진 뒤에도 마지막 참조는 데이터를 붙잡는다</text><text x="90" y="760" fill="#f2eee5" font-family="monospace" font-size="14" letter-spacing="2">NAME ≠ FILE ≠ BLOCK</text><text x="1110" y="760" text-anchor="end" fill="#7fd0c2" font-family="monospace" font-size="14">THE WORLD BEHIND THE SCREEN</text></svg>
