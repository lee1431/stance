<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">요청과 요청 사이의 로그인 관계</title><desc id="desc">왼쪽 브라우저가 표 A를 서버로 보내고 오른쪽 서버가 로그인 관계와 문서 접근 권한을 서로 다른 단계에서 확인하는 개념 삽화</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ccdbd7" stroke-opacity=".08"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#e6b574" stroke-width="2"/></marker></defs>
<rect width="1200" height="780" fill="#172c32"/><rect width="1200" height="780" fill="url(#grid)"/>
<g font-family="monospace" fill="#ccdbd7"><text x="76" y="86" font-size="17" letter-spacing="4">EMPLOYEE 01 / ISSUE 06</text><text x="76" y="132" font-size="32" letter-spacing="2">A RELATIONSHIP BETWEEN REQUESTS</text></g>
<rect x="76" y="200" width="410" height="430" rx="12" fill="#203a40" stroke="#92aa9c" stroke-width="2"/>
<path d="M76 247H486" stroke="#92aa9c" stroke-width="2"/><g fill="#92aa9c"><circle cx="99" cy="225" r="5"/><circle cx="118" cy="225" r="5"/><circle cx="137" cy="225" r="5"/></g>
<text x="166" y="231" font-family="monospace" font-size="15" fill="#ccdbd7">BROWSER</text>
<circle cx="281" cy="316" r="29" fill="#b8d5c2"/><path d="M235 386V374C235 337 327 337 327 374V386" fill="#b8d5c2"/>
<g font-family="monospace" fill="#ccdbd7" text-anchor="middle"><text x="281" y="425" font-size="17">SIGNED IN?</text><text x="281" y="590" font-size="14">THE SCREEN IS A DISPLAY</text></g>
<rect x="150" y="458" width="262" height="89" rx="7" fill="#e6b574"/><g fill="#172c32" font-family="monospace"><text x="177" y="494" font-size="14">COOKIE / REFERENCE</text><text x="177" y="527" font-size="25">PASS A</text></g>
<path d="M506 502H670" stroke="#e6b574" stroke-width="4" marker-end="url(#arrow)"/><text x="587" y="477" text-anchor="middle" font-family="monospace" font-size="13" fill="#ccdbd7">NEXT REQUEST</text>
<rect x="700" y="200" width="424" height="430" rx="12" fill="#203a40" stroke="#92aa9c" stroke-width="2"/>
<text x="730" y="247" font-family="monospace" font-size="17" fill="#ccdbd7">SERVER / TWO QUESTIONS</text>
<rect x="730" y="278" width="364" height="127" rx="7" fill="#b8d5c2"/>
<g fill="#172c32" font-family="monospace"><text x="758" y="315" font-size="15">01 / VALID SESSION?</text><text x="758" y="353" font-size="23">PASS A → USER</text><text x="758" y="382" font-size="13">CURRENT RELATIONSHIP</text></g>
<path d="M912 417V452" stroke="#e6b574" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="730" y="470" width="364" height="127" rx="7" fill="#e6b574"/>
<g fill="#172c32" font-family="monospace"><text x="758" y="507" font-size="15">02 / ALLOWED ACTION?</text><text x="758" y="545" font-size="23">USER + DOCUMENT</text><text x="758" y="574" font-size="13">READ / EDIT / DELETE</text></g>
<g font-family="monospace"><text x="76" y="695" fill="#ccdbd7" font-size="16" letter-spacing="2">IDENTITY IS NOT PERMISSION</text><text x="76" y="731" fill="#97afa1" font-size="13">PASS A IS A FICTIONAL LABEL — NO REAL CREDENTIALS</text></g>
</svg>
