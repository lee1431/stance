<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">마지막 하나인데, 왜 둘 다 예약됐을까?</title>
  <desc id="desc">두 요청 A와 B가 한 자리로 모인다. 가운데 조건부 변경 관문을 통과한 요청 하나만 확정되고 다른 요청은 멈춘다.</desc>
  <rect width="1200" height="780" fill="#172c32"/>
  <g fill="none" stroke="#d9e4df" stroke-width="3">
    <rect x="100" y="120" width="275" height="155" rx="16"/>
    <rect x="100" y="335" width="275" height="155" rx="16"/>
    <path d="M375 197h80q45 0 45 45v18m-125 152h80q45 0 45-45v-17" stroke-dasharray="10 12"/>
    <rect x="495" y="210" width="215" height="190" rx="24" fill="#263d42"/>
    <path d="M710 267h125"/>
    <path d="M710 352h72" stroke="#c74d2d" stroke-dasharray="9 9"/>
    <rect x="850" y="210" width="240" height="190" rx="18"/>
    <path d="M942 258v85m-26 0h52m-26-85-20 18" stroke="#d9e4df" stroke-width="9"/>
    <path d="M824 257l14 10-14 10m-41 55v40" stroke="#c74d2d" stroke-width="6"/>
  </g>
  <g fill="#f5f2eb" font-family="system-ui,sans-serif">
    <text x="132" y="163" font-size="17" letter-spacing="3">REQUEST A</text>
    <text x="132" y="234" font-size="45" font-weight="800">남은 1</text>
    <text x="132" y="378" font-size="17" letter-spacing="3">REQUEST B</text>
    <text x="132" y="449" font-size="45" font-weight="800">남은 1</text>
    <text x="532" y="263" font-size="16" letter-spacing="2">CHECK +</text>
    <text x="532" y="292" font-size="16" letter-spacing="2">CHANGE</text>
    <text x="532" y="350" font-size="38" font-weight="800">함께</text>
    <text x="890" y="375" font-size="16" letter-spacing="2">ONE SEAT</text>
    <text x="100" y="595" font-size="20" letter-spacing="4" fill="#d8aaa0">ISSUE 05 / CONCURRENCY</text>
    <text x="100" y="660" font-size="48" font-weight="800">둘 다 봤지만,</text>
    <text x="100" y="720" font-size="48" font-weight="800">둘 다 차지할 수는 없다.</text>
  </g>
  <g fill="#c74d2d"><circle cx="375" cy="197" r="8"/><circle cx="375" cy="412" r="8"/></g>
</svg>
