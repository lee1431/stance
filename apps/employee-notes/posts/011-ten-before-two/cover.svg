<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">정렬했는데 왜 10이 2보다 앞이지</title><desc id="desc">파일1, 파일10, 파일2 카드가 문자열 순서에서 숫자를 포함한 자연스러운 순서로 다시 배치되는 표지</desc><rect width="1200" height="780" fill="#2f2b47"/><g stroke="#514a70" stroke-width="1"><path d="M0 150h1200M0 390h1200M0 630h1200M180 0v780M420 0v780M660 0v780M900 0v780"/></g><text x="76" y="72" fill="#d4cfe8" font-family="monospace" font-size="16" letter-spacing="3">EMPLOYEE 01 / ISSUE 11</text><text x="76" y="135" fill="#fbf8ef" font-family="sans-serif" font-size="46" font-weight="700">정렬했는데,</text><text x="76" y="188" fill="#fbf8ef" font-family="sans-serif" font-size="46" font-weight="700">왜 10이 2보다 앞이지?</text><g transform="translate(82 270)" font-family="sans-serif"><text x="0" y="0" fill="#d4cfe8" font-family="monospace" font-size="15" letter-spacing="2">STRING ORDER</text><g transform="translate(0 34)"><rect width="280" height="76" rx="12" fill="#fbf8ef"/><text x="28" y="50" fill="#2f2b47" font-size="26" font-weight="700">파일1</text></g><g transform="translate(0 126)"><rect width="280" height="76" rx="12" fill="#f0b44d"/><text x="28" y="50" fill="#2f2b47" font-size="26" font-weight="700">파일10</text></g><g transform="translate(0 218)"><rect width="280" height="76" rx="12" fill="#fbf8ef"/><text x="28" y="50" fill="#2f2b47" font-size="26" font-weight="700">파일2</text></g></g><path d="M410 448h160" fill="none" stroke="#e56f51" stroke-width="8" stroke-linecap="round"/><path d="m570 448-28-18v36z" fill="#e56f51"/><text x="430" y="420" fill="#d4cfe8" font-family="monospace" font-size="14" letter-spacing="2">CHANGE THE RULE</text><g transform="translate(650 270)" font-family="sans-serif"><text x="0" y="0" fill="#d4cfe8" font-family="monospace" font-size="15" letter-spacing="2">NUMERIC COLLATION</text><g transform="translate(0 34)"><rect width="280" height="76" rx="12" fill="#fbf8ef"/><text x="28" y="50" fill="#2f2b47" font-size="26" font-weight="700">파일1</text></g><g transform="translate(0 126)"><rect width="280" height="76" rx="12" fill="#fbf8ef"/><text x="28" y="50" fill="#2f2b47" font-size="26" font-weight="700">파일2</text></g><g transform="translate(0 218)"><rect width="280" height="76" rx="12" fill="#7fd1c7"/><text x="28" y="50" fill="#2f2b47" font-size="26" font-weight="700">파일10</text></g></g><text x="76" y="735" fill="#d4cfe8" font-family="sans-serif" font-size="20">순서는 데이터 안이 아니라 비교 규칙 안에 있다</text></svg>
