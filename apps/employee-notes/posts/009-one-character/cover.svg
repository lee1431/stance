<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">한 글자인데, 왜 길이는 둘이지?</title><desc id="desc">웃는 얼굴 하나를 네 개의 자로 재면 문자 덩어리 1, 코드 포인트 1, UTF-16 코드 단위 2, UTF-8 바이트 4가 된다.</desc><rect width="1200" height="780" fill="#172c32"/><g stroke="#365359" opacity=".6"><path d="M0 260H1200M0 520H1200M300 0V780M600 0V780M900 0V780"/></g><g font-family="sans-serif"><text x="70" y="70" fill="#d8b88d" font-size="18" letter-spacing="3">EMPLOYEE 01 / ISSUE 09</text><text x="70" y="140" fill="#f5f2eb" font-size="47" font-weight="700">한 글자인데,</text><text x="70" y="202" fill="#f5f2eb" font-size="47" font-weight="700">왜 길이는 둘이지?</text><circle cx="259" cy="454" r="119" fill="#e5b564"/><circle cx="220" cy="427" r="12" fill="#172c32"/><circle cx="298" cy="427" r="12" fill="#172c32"/><path d="M206 476Q259 535 312 476" fill="none" stroke="#172c32" stroke-width="13" stroke-linecap="round"/><text x="170" y="622" fill="#d7ded6" font-size="25">웃는 얼굴 하나</text><path d="M385 454H477" stroke="#d8b88d" stroke-width="4"/><g fill="#f5f2eb"><rect x="510" y="276" width="274" height="159" rx="6"/><rect x="810" y="276" width="274" height="159" rx="6"/><rect x="510" y="459" width="274" height="159" rx="6"/><rect x="810" y="459" width="274" height="159" rx="6"/></g><g fill="#607075" font-size="23"><text x="536" y="319">문자 덩어리</text><text x="836" y="319">코드 포인트</text><text x="536" y="502">UTF-16 코드 단위</text><text x="836" y="502">UTF-8 바이트</text></g><g fill="#c74d2d" font-size="76" font-weight="700"><text x="533" y="405">1</text><text x="833" y="405">1</text><text x="533" y="588">2</text><text x="833" y="588">4</text></g><text x="70" y="717" fill="#d7ded6" font-size="27">숫자보다 먼저 물어야 한다. 무엇을 하나로 셌는가?</text></g></svg>
