<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">전원을 켰는데, 누가 운영체제를 깨웠지?</title><desc id="desc">전원 버튼에서 펌웨어, 부트로더, 커널, 초기 사용자 공간과 서비스로 빛나는 제어권 토큰이 전달되는 개념 표지</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#170e25"/><stop offset=".52" stop-color="#35214b"/><stop offset="1" stop-color="#0f3440"/></linearGradient><radialGradient id="glow"><stop stop-color="#ffcf6e"/><stop offset=".35" stop-color="#f48b5b" stop-opacity=".7"/><stop offset="1" stop-color="#f48b5b" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="16"/></filter></defs>
