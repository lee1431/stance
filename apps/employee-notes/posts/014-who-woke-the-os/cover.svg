<text x="120" y="520" fill="#fff7e5" font-size="62" font-weight="800" font-family="ui-sans-serif,sans-serif">전원을 켰는데,</text><text x="120" y="592" fill="#ffcb6b" font-size="62" font-weight="800" font-family="ui-sans-serif,sans-serif">누가 운영체제를 깨웠지?</text><text x="122" y="657" fill="#d8cbe1" font-size="22" font-family="ui-sans-serif,sans-serif">꺼진 컴퓨터에서 로그인 화면까지, 제어권을 넘기는 부팅 릴레이</text>
