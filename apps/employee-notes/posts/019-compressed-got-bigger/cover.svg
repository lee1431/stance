<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t d"><title id="t">압축했는데, 왜 파일이 더 커졌지?</title><desc id="d">반복되는 데이터는 작은 규칙 상자에 들어가고 무작위 데이터는 머리말과 검증값이 붙어 오히려 커지는 압축 개념 표지</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102f38"/><stop offset="1" stop-color="#1d5960"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d7ece5" stroke-opacity=".07"/></pattern></defs><rect width="1200" height="780" fill="url(#bg)"/><rect width="1200" height="780" fill="url(#grid)"/><text x="74" y="84" fill="#a9c9c2" font-family="monospace" font-size="18" letter-spacing="4">THE WORLD BEHIND THE SCREEN · ISSUE 19</text><text x="74" y="154" fill="#fff" font-family="sans-serif" font-size="54" font-weight="800">압축했는데,</text><text x="74" y="222" fill="#f0c968" font-family="sans-serif" font-size="54" font-weight="800">왜 파일이 더 커졌지?</text><g transform="translate(80 302)"><rect width="440" height="250" rx="22" fill="#f7f1df"/><text x="30" y="45" fill="#173c45" font-family="sans-serif" font-size="19" font-weight="700">REPETITION</text><text x="30" y="92" fill="#173c45" font-family="monospace" font-size="25">AAAAAAAAAAAAAAAA</text><path d="M95 125v34h250v-34" fill="none" stroke="#c38825" stroke-width="5"/><path d="M220 159v23" stroke="#c38825" stroke-width="5"/><rect x="145" y="184" width="150" height="48" rx="12" fill="#2f7c69"/><text x="220" y="215" text-anchor="middle" fill="#fff" font-family="monospace" font-size="21">A × 16</text></g><g transform="translate(680 302)"><rect width="440" height="250" rx="22" fill="#f7f1df"/><text x="30" y="45" fill="#173c45" font-family="sans-serif" font-size="19" font-weight="700">NOISE + WRAPPER</text><text x="30" y="92" fill="#173c45" font-family="monospace" font-size="25">4F 92 A1 7C D8 03</text><g transform="translate(26 135)"><rect width="100" height="70" rx="10" fill="#edc762"/><rect x="110" width="210" height="70" rx="10" fill="#cae5dd"/><rect x="330" width="76" height="70" rx="10" fill="#e5a58f"/><text x="50" y="42" text-anchor="middle" fill="#173c45" font-family="sans-serif" font-size="15" font-weight="700">HEADER</text><text x="215" y="42" text-anchor="middle" fill="#173c45" font-family="sans-serif" font-size="17" font-weight="700">PAYLOAD</text><text x="368" y="42" text-anchor="middle" fill="#173c45" font-family="sans-serif" font-size="14" font-weight="700">CRC</text></g></g><path d="M542 427h112" stroke="#f0c968" stroke-width="5"/><path d="m638 411 20 16-20 16" fill="none" stroke="#f0c968" stroke-width="5"/><text x="600" y="596" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="30" font-weight="700">짧은 규칙이 없으면 포장 비용만 남는다.</text><text x="600" y="652" text-anchor="middle" fill="#a9c9c2" font-family="monospace" font-size="18" letter-spacing="3">PATTERN · DICTIONARY · HEADER · ENTROPY</text><line x1="80" y1="704" x2="1120" y2="704" stroke="#a9c9c2" stroke-opacity=".35"/><text x="80" y="742" fill="#f0c968" font-family="sans-serif" font-size="19" font-weight="700">주절주절 1호사원</text><text x="1120" y="742" text-anchor="end" fill="#a9c9c2" font-family="monospace" font-size="16">LLSSHH.COM</text></svg>
