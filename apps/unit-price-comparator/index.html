<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>단가 비교 계산기 | 용량·수량별 가격 비교</title><meta name="description" content="가격과 수량 또는 용량을 입력해 개당, 100g당, 100ml당 단가를 비교하고 더 저렴한 상품을 바로 확인하세요."><link rel="canonical" href="https://llsshh.com/apps/unit-price-comparator/"><meta property="og:title" content="단가 비교 계산기"><meta property="og:description" content="묶음 가격이 달라도 실제 단가를 바로 비교합니다."><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9382191250873184" crossorigin="anonymous"></script><style>
:root{font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:32px 0 48px}h1{font-size:clamp(34px,6vw,56px);margin:0;letter-spacing:-.04em}.lead{color:#64748b;line-height:1.65;max-width:700px}.box{margin-top:22px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:18px;box-shadow:0 14px 42px #0f172a0d}.mode{max-width:260px;margin-bottom:14px}label{display:block;font-size:12px;font-weight:800;color:#475569;margin:0 0 7px}input,select{width:100%;padding:12px;border:1px solid #d7dde6;border-radius:11px;background:white;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:16px;border:1px solid #e2e8f0;border-radius:16px;background:#fafbfc}.card.win{border:2px solid #111827}.card h2{margin:0 0 13px;font-size:19px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.result{margin-top:12px;padding:13px;background:#111827;color:white;border-radius:12px}.result small{display:block;color:#cbd5e1}.result strong{font-size:26px}.summary{margin-top:14px;padding:14px;border-radius:14px;background:#ecfeff;color:#164e63;line-height:1.55}.actions{display:flex;gap:8px;margin-top:14px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.main{background:#111827;color:#fff}.sub{background:#e9eef4;color:#334155}.note{font-size:13px;color:#64748b;line-height:1.6;margin-top:16px}footer{margin-top:24px;color:#94a3b8;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}.wrap{padding-top:24px}}</style></head><body><main class="wrap"><p style="font-size:12px;font-weight:800;letter-spacing:.12em;color:#64748b">PRICE TOOL</p><h1>단가 비교 계산기</h1><p class="lead">가격과 수량 또는 용량을 입력하면 실제 단가를 계산해 어떤 상품이 더 저렴한지 바로 비교합니다.</p><section class="box"><div class="mode"><label for="mode">비교 기준</label><select id="mode"><option value="each">개당 가격</option><option value="100g">100g당 가격</option><option value="100ml">100ml당 가격</option><option value="1kg">1kg당 가격</option><option value="1l">1L당 가격</option></select></div><div class="grid"><article class="card" id="aCard"><h2>상품 A</h2><div class="fields"><div><label>가격(원)</label><input id="aPrice" type="number" min="0" value="8900"></div><div><label id="aLabel">수량(개)</label><input id="aAmount" type="number" min="0" step="any" value="12"></div></div><div class="result"><small id="aUnitLabel">1개당</small><strong id="aUnit">-</strong></div></article><article class="card" id="bCard"><h2>상품 B</h2><div class="fields"><div><label>가격(원)</label><input id="bPrice" type="number" min="0" value="12900"></div><div><label id="bLabel">수량(개)</label><input id="bAmount" type="number" min="0" step="any" value="20"></div></div><div class="result"><small id="bUnitLabel">1개당</small><strong id="bUnit">-</strong></div></article></div><div class="summary" id="summary">값을 입력하면 비교 결과가 표시됩니다.</div><div class="actions"><button class="main" id="swap" type="button">A ↔ B 바꾸기</button><button class="sub" id="reset" type="button">초기화</button></div><p class="note">쿠폰이나 배송비가 있다면 최종 결제 가격을 입력하세요. 중량과 용량은 두 상품을 같은 단위로 입력하면 됩니다.</p></section><footer>© 2026 llsshh.com · 단가 비교 계산기</footer></main><script>
const $=id=>document.getElementById(id),cfg={each:["수량(개)","1개당",1],"100g":["총 중량(g)","100g당",100],"100ml":["총 용량(ml)","100ml당",100],"1kg":["총 중량(g)","1kg당",1000],"1l":["총 용량(ml)","1L당",1000]};const won=n=>Number.isFinite(n)?new Intl.NumberFormat("ko-KR",{maximumFractionDigits:n<100?2:0}).format(n)+"원":"-";function calc(){const [lab,u,f]=cfg[$("mode").value];$("aLabel").textContent=$("bLabel").textContent=lab;$("aUnitLabel").textContent=$("bUnitLabel").textContent=u;const a=+$("aPrice").value/+$("aAmount").value*f,b=+$("bPrice").value/+$("bAmount").value*f;$("aUnit").textContent=won(a);$("bUnit").textContent=won(b);$("aCard").classList.remove("win");$("bCard").classList.remove("win");if(!Number.isFinite(a)||!Number.isFinite(b)||a<=0||b<=0){$("summary").textContent="두 상품의 값을 모두 입력하세요.";return}if(a===b){$("summary").innerHTML="<strong>두 상품의 단가가 같습니다.</strong>";return}const aw=a<b,cheap=aw?a:b,exp=aw?b:a,rate=(exp-cheap)/exp*100;(aw?$("aCard"):$("bCard")).classList.add("win");$("summary").innerHTML="<strong>상품 "+(aw?"A":"B")+"가 더 저렴합니다.</strong> "+u+" "+won(exp-cheap)+" 차이, 약 "+rate.toFixed(rate<1?2:1)+"% 절약입니다."}document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",calc));$("swap").onclick=()=>{let p=$("aPrice").value,q=$("aAmount").value;$("aPrice").value=$("bPrice").value;$("aAmount").value=$("bAmount").value;$("bPrice").value=p;$("bAmount").value=q;calc()};$("reset").onclick=()=>{$("aPrice").value=$("aAmount").value=$("bPrice").value=$("bAmount").value="";$("mode").value="each";calc()};calc();
</script></body></html>
