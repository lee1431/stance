<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>DSD API 연결 진단</title>
<style>body{font:16px system-ui,sans-serif;max-width:560px;margin:40px auto;padding:16px;color:#182c4c}div{padding:18px;border:1px solid #ddd;border-radius:12px;margin:12px 0}b{display:block;margin-bottom:6px}.ok{color:#146a38}.err{color:#bc2626}.pending{color:#667}code{overflow-wrap:anywhere}</style></head>
<body><h1>DSD API 연결 진단</h1><p>현재 사이트 출처에서 인증 쿠키 포함 요청과 CORS 사전 요청을 검사합니다. 계정 생성이나 데이터 변경은 없습니다.</p>
<div><b>1. Health + CORS (GET)</b><span id="health" class="pending">검사 중...</span></div>
<div><b>2. 인증 API + preflight (GET)</b><span id="auth" class="pending">검사 중...</span></div>
<p><small>상태 코드 401은 로그인하지 않은 상태에서 정상적인 응답일 수 있습니다. CORS 차단이면 네트워크 오류로 표시됩니다.</small></p>
<script>
const BASE='https://localflow.ddns.net/dsd/api/';
async function test(id,path,headers={}){
  const el=document.getElementById(id);
  try {
    const response=await fetch(BASE+path,{method:'GET',mode:'cors',credentials:'include',cache:'no-store',headers});
    const value=await response.text();
    const validHealth = id==='health' ? response.ok && value.includes('"ok":true') : (response.status===401 || response.ok);
    el.className=validHealth?'ok':'err';
    el.textContent='HTTP '+response.status+(validHealth?' · 브라우저 CORS 통과':' · 응답 확인 필요');
  }catch(e){
    el.className='err';
    el.textContent='브라우저 요청 실패: '+e.message+' (CORS / 연결 확인)';
  }
}
test('health','health');
test('auth','auth/me',{'X-CSRF-Token':'cors-preflight-only'});
</script></body></html>
