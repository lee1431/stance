<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>DSD · 배송 지도</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#18263c;background:#e9eef3}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    button,input{font:inherit}
    button{cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    button:focus-visible,input:focus-visible{outline:3px solid #8db6ff;outline-offset:2px}
    #map{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#e9eef3}
    #map img{max-width:none}
    .topbar{position:fixed;z-index:5;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:12px;pointer-events:none}
    .brand,.count,.round{background:#fff;box-shadow:0 3px 16px #1d315024;border:1px solid #e3e9f1}
    .brand{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:15px}
    .brand b{font-size:19px;letter-spacing:-.7px}
    .brand small{font-size:12px;color:#738097}
    .count{padding:12px 15px;font-size:13px;font-weight:800;color:#2865d7;border-radius:13px;white-space:nowrap}
    .round{pointer-events:auto;margin-left:auto;border-radius:13px;width:45px;height:45px;font-size:22px}
    .fab{position:fixed;z-index:5;right:22px;bottom:calc(28px + env(safe-area-inset-bottom));width:68px;height:68px;border:none;border-radius:22px;background:#246bfa;color:white;font-size:42px;line-height:1;box-shadow:0 8px 24px #246bfa55}
    .fab:hover{background:#1556db}
    .cover{position:fixed;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,360px);background:#fff;border:1px solid #e0e7ef;border-radius:19px;padding:27px 22px;text-align:center;box-shadow:0 16px 45px #28395024}
    .cover h2{font-size:21px;margin:0 0 12px}
    .cover p{font-size:13px;line-height:1.65;color:#68788e;margin:0 0 18px}
    .primary{border:0;border-radius:12px;background:#246bfa;color:white;font-weight:750;padding:13px 17px}
    .secondary{border:0;border-radius:12px;background:#eef2f7;color:#3b4f6b;font-weight:700;padding:13px 17px}
    .message{position:fixed;z-index:6;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 30px);padding:11px 16px;border-radius:12px;background:#172844ed;color:white;font-size:13px;line-height:1.4;box-shadow:0 6px 22px #1a2b4040;text-align:center}
    .message[hidden],.cover[hidden],.selection[hidden]{display:none}
    .selection{position:fixed;z-index:4;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(400px,calc(100vw - 112px));background:white;border-radius:17px;box-shadow:0 6px 25px #1c2f5040;padding:15px}
    .selection strong{display:block;font-size:13px;color:#65748a;margin-bottom:5px}
    .selection p{margin:0 0 12px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
    .selection-actions{display:flex;gap:8px}
    .selection-actions button{padding:9px 12px;border:0;border-radius:9px;background:#eff3f9;color:#415775;font-size:12px;font-weight:700}
    .selection-actions .danger{color:#c13c43;background:#fff0f0}
    dialog{border:0;border-radius:22px;background:#fff;color:#1c2b40;box-shadow:0 18px 60px #071d3d55;width:min(420px,calc(100vw - 28px));padding:23px}
    dialog::backdrop{background:#0e22376b}
    dialog h2{margin:0 0 7px;font-size:21px}
    dialog p{font-size:13px;color:#6e7b8e;line-height:1.6;margin:0 0 17px}
    dialog label{display:block;font-size:13px;font-weight:800;margin:17px 0 7px}
    dialog input{width:100%;min-height:49px;border:1px solid #cfd8e5;border-radius:11px;padding:12px 13px;font-size:16px;background:#fff}
    .dialog-actions{display:flex;gap:9px;margin-top:20px}
    .dialog-actions button{flex:1}
    .hint{font-size:12px;margin-top:12px;color:#8b6872}
    @media(max-width:600px){
      .topbar{top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;gap:7px}
      .brand{padding:9px 11px;gap:6px}.brand b{font-size:18px}.brand small{font-size:11px}
      .count{font-size:12px;padding:11px}.round{height:41px;width:41px}
      .fab{right:15px;bottom:calc(20px + env(safe-area-inset-bottom));width:64px;height:64px}
      .selection{left:12px;bottom:calc(20px + env(safe-area-inset-bottom));transform:none;width:calc(100vw - 105px)}
      .message{bottom:calc(94px + env(safe-area-inset-bottom))}
    }
  </style>
</head>
<body>
  <main id="map" aria-label="네이버 배송 지도"></main>
  <header class="topbar">
    <div class="brand"><b>DSD</b><small>배송 지도</small></div>
    <div id="count" class="count" aria-live="polite">0곳</div>
    <button id="settingsBtn" class="round" type="button" title="네이버 지도 설정" aria-label="네이버 지도 설정">⚙</button>
  </header>
  <section id="cover" class="cover" role="status">
    <h2 id="coverTitle">네이버 지도 연결</h2>
    <p id="coverText">NAVER Maps Client ID를 한 번 입력하면 지도가 나타납니다.</p>
    <button id="connectBtn" class="primary" type="button">지도 설정</button>
  </section>
  <section id="selection" class="selection" hidden>
    <strong>등록된 배송지</strong>
    <p id="selectedAddress"></p>
    <div class="selection-actions">
      <button type="button" id="closeSelection">닫기</button>
      <button type="button" id="deleteStop" class="danger">이 마커 삭제</button>
    </div>
  </section>
  <button id="addBtn" class="fab" type="button" aria-label="배송 주소 추가" title="배송 주소 추가" disabled>+</button>
  <div id="message" class="message" role="status" aria-live="polite" hidden></div>

  <dialog id="addressDialog" aria-labelledby="addressTitle">
    <form id="addressForm">
      <h2 id="addressTitle">배송 주소 등록</h2>
      <p>주소를 입력하면 지도에서 위치를 찾아 마커를 표시합니다.</p>
      <label for="addressInput">배송지 주소</label>
      <input id="addressInput" type="text" placeholder="예: 충주시 으뜸로 21" autocomplete="street-address" required maxlength="250">
      <div class="dialog-actions">
        <button id="cancelAddress" class="secondary" type="button">취소</button>
        <button id="saveAddress" class="primary" type="submit">마커 추가</button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <form id="settingsForm">
      <h2 id="settingsTitle">네이버 지도 설정</h2>
      <p>네이버 클라우드의 Maps JavaScript API용 Client ID를 입력하세요. Client Secret은 필요하지 않습니다.</p>
      <label for="clientIdInput">Client ID (ncpKeyId)</label>
      <input id="clientIdInput" type="text" placeholder="Client ID" autocomplete="off" spellcheck="false" required>
      <div class="hint">네이버 클라우드에서 접속 도메인을 Web 서비스 URL로 등록해야 합니다.</div>
      <div class="dialog-actions">
        <button id="cancelSettings" class="secondary" type="button">취소</button>
        <button class="primary" type="submit">연결하기</button>
      </div>
    </form>
  </dialog>

  <script>
    'use strict';
    (function () {
      const $ = (id) => document.getElementById(id);
      const STOPS_KEY = 'dsd:vanilla:stops:v1';
      const CLIENT_ID_KEY = 'deliveryMapClientId'; // 기존 DSD의 저장된 Client ID 재사용
      const CHUNGJU = {lat:36.991, lng:127.926};
      let map = null;
      let stops = [];
      let markers = [];
      let selectedId = null;
      let sdkTimeout = null;
      let messageTimeout = null;

      function readStored(key, fallback) {
        try { return localStorage.getItem(key) || fallback; } catch (_) { return fallback; }
      }
      function writeStored(key, value) {
        try { localStorage.setItem(key, value); return true; } catch (_) { return false; }
      }
      function loadStops() {
        try {
          const list = JSON.parse(readStored(STOPS_KEY, '[]'));
          if (!Array.isArray(list)) return [];
          return list.filter((s) => s && typeof s.address === 'string' &&
            Number.isFinite(s.lat) && Number.isFinite(s.lng) && typeof s.id === 'string');
        } catch (_) { return []; }
      }
      function notify(text) {
        clearTimeout(messageTimeout);
        $('message').textContent = text;
        $('message').hidden = false;
        messageTimeout = setTimeout(() => { $('message').hidden = true; }, 4000);
      }
      function showCover(title, description) {
        $('coverTitle').textContent = title;
        $('coverText').textContent = description;
        $('cover').hidden = false;
      }
      function saveStops() {
        $('count').textContent = stops.length + '곳';
        if (!writeStored(STOPS_KEY, JSON.stringify(stops))) {
          notify('브라우저 저장에 실패했습니다. 데이터를 유지할 수 없습니다.');
        }
      }
      function closeSelection() {
        selectedId = null;
        $('selection').hidden = true;
      }
      function selectStop(stop) {
        selectedId = stop.id;
        $('selectedAddress').textContent = stop.address;
        $('selection').hidden = false;
        if (map) map.panTo(new naver.maps.LatLng(stop.lat, stop.lng));
      }
      function drawMarkers(fit) {
        if (!map) return;
        markers.forEach((marker) => marker.setMap(null));
        markers = [];
        stops.forEach((stop) => {
          const marker = new naver.maps.Marker({
            map: map,
            position: new naver.maps.LatLng(stop.lat, stop.lng),
            title: stop.address
          });
          naver.maps.Event.addListener(marker, 'click', () => selectStop(stop));
          markers.push(marker);
        });
        $('count').textContent = stops.length + '곳';
        if (!fit || !stops.length) return;
        if (stops.length === 1) {
          map.setCenter(new naver.maps.LatLng(stops[0].lat, stops[0].lng));
          map.setZoom(16);
        } else {
          const bounds = new naver.maps.LatLngBounds();
          stops.forEach((stop) => bounds.extend(new naver.maps.LatLng(stop.lat, stop.lng)));
          map.fitBounds(bounds, {top:90,right:70,bottom:100,left:70});
        }
      }
      function geocode(address) {
        return new Promise((resolve, reject) => {
          if (!window.naver || !naver.maps.Service || !naver.maps.Service.geocode) {
            reject(new Error('주소 검색 기능을 불러오지 못했습니다.')); return;
          }
          let finished = false;
          const timer = setTimeout(() => {
            if (!finished) { finished = true; reject(new Error('주소 검색 시간이 초과되었습니다.')); }
          }, 12000);
          try {
            naver.maps.Service.geocode({query: address}, (status, response) => {
              if (finished) return;
              finished = true;
              clearTimeout(timer);
              if (status !== naver.maps.Service.Status.OK) {
                reject(new Error('네이버 주소 검색에 실패했습니다.')); return;
              }
              const found = response && response.v2 && response.v2.addresses && response.v2.addresses[0];
              const lat = found ? Number(found.y) : NaN;
              const lng = found ? Number(found.x) : NaN;
              if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
                reject(new Error('주소를 찾지 못했습니다. 도로명이나 번지를 확인하세요.')); return;
              }
              resolve({lat:lat,lng:lng});
            });
          } catch (error) {
            clearTimeout(timer);
            reject(error);
          }
        });
      }
      window.dsdMapReady = function () {
        clearTimeout(sdkTimeout);
        try {
          if (!window.naver || !naver.maps.Map) throw new Error('지도 SDK를 불러오지 못했습니다.');
          map = new naver.maps.Map('map', {
            center: new naver.maps.LatLng(CHUNGJU.lat, CHUNGJU.lng),
            zoom: 13,
            mapTypeId: naver.maps.MapTypeId.NORMAL,
            zoomControl: true,
            zoomControlOptions: {position: naver.maps.Position.TOP_RIGHT}
          });
          $('cover').hidden = true;
          $('addBtn').disabled = false;
          naver.maps.Event.addListener(map, 'click', closeSelection);
          drawMarkers(true);
        } catch (error) {
          showCover('지도 초기화 실패', error.message);
        }
      };
      function loadMap() {
        const id = readStored(CLIENT_ID_KEY, '').trim();
        if (!id) {
          showCover('네이버 지도 연결', '⚙ 설정에서 네이버 지도 Client ID를 입력해 주세요.');
          return;
        }
        showCover('지도 불러오는 중', '네이버 지도에 연결하고 있습니다.');
        const script = document.createElement('script');
        script.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' +
          encodeURIComponent(id) + '&submodules=geocoder&callback=dsdMapReady';
        script.onerror = () => {
          clearTimeout(sdkTimeout);
          showCover('지도 연결 실패', 'Client ID, Maps 사용 권한 및 Web 서비스 URL을 확인하세요.');
        };
        sdkTimeout = setTimeout(() => {
          if (!map) showCover('지도 연결 시간 초과', '네트워크 또는 네이버 지도 API 설정을 확인하세요.');
        }, 15000);
        document.head.appendChild(script);
      }
      $('connectBtn').addEventListener('click', () => $('settingsBtn').click());
      $('settingsBtn').addEventListener('click', () => {
        $('clientIdInput').value = readStored(CLIENT_ID_KEY, '');
        $('settingsDialog').showModal();
      });
      $('cancelSettings').addEventListener('click', () => $('settingsDialog').close());
      $('settingsForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const id = $('clientIdInput').value.trim();
        if (!/^[a-zA-Z0-9_-]{5,100}$/.test(id)) {
          notify('올바른 Client ID를 입력하세요.'); return;
        }
        if (!writeStored(CLIENT_ID_KEY, id)) {
          notify('Client ID를 저장할 수 없습니다.'); return;
        }
        location.reload();
      });
      $('addBtn').addEventListener('click', () => {
        $('addressDialog').showModal();
        $('addressInput').focus();
      });
      $('cancelAddress').addEventListener('click', () => $('addressDialog').close());
      $('addressForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const address = $('addressInput').value.trim().replace(/\s+/g, ' ');
        if (!address || !map) return;
        $('saveAddress').disabled = true;
        $('saveAddress').textContent = '주소 검색 중...';
        try {
          const position = await geocode(address);
          stops.push({id: String(Date.now()) + '-' + Math.random().toString(36).slice(2),
            address: address, lat: position.lat, lng: position.lng});
          saveStops();
          drawMarkers(false);
          map.setCenter(new naver.maps.LatLng(position.lat, position.lng));
          map.setZoom(16);
          $('addressInput').value = '';
          $('addressDialog').close();
          closeSelection();
          notify('배송지 마커를 추가했습니다.');
        } catch (error) {
          notify(error.message || '주소 등록에 실패했습니다.');
        } finally {
          $('saveAddress').disabled = false;
          $('saveAddress').textContent = '마커 추가';
        }
      });
      $('closeSelection').addEventListener('click', closeSelection);
      $('deleteStop').addEventListener('click', () => {
        const target = stops.find((s) => s.id === selectedId);
        if (!target || !confirm('이 배송지 마커를 삭제할까요?\n' + target.address)) return;
        stops = stops.filter((s) => s.id !== selectedId);
        closeSelection();
        saveStops();
        drawMarkers(false);
        notify('배송지 마커를 삭제했습니다.');
      });
      stops = loadStops();
      $('count').textContent = stops.length + '곳';
      loadMap();
    }());
  </script>
</body>
</html>
