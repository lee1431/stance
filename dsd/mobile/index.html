<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142332"><title>DSD Mobile · 송장 스캔</title><link rel="stylesheet" href="./style.css?v=1"><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script><script src="./app.js?v=1" defer></script></head>
<body><main class="phone"><header><strong>DSD <span>MOBILE</span></strong><div id="account">연결 중</div></header>
<section id="scanView" class="view"><div class="scan-head"><b>송장 주소 스캔</b><small id="scanStatus">주소 부분을 맞추고 촬영하세요</small></div><div class="camera-box"><video id="video" autoplay playsinline muted></video><canvas id="snapshot" hidden></canvas><div id="cameraHint">카메라를 시작하세요</div><div class="target"><i></i><span>주소 · 수취인 영역</span></div></div><div class="camera-actions"><button id="startCamera" class="secondary">카메라 켜기</button><button id="shutter" class="shutter" aria-label="촬영" disabled><span></span></button><label class="secondary file-button">사진 선택<input id="photo" type="file" accept="image/*" capture="environment" hidden></label></div><div id="progress" class="progress" hidden>주소 인식 중…</div><section id="review" class="review" hidden><h3>인식 결과 확인</h3><label>수취인<input id="recipient" autocomplete="off" placeholder="수취인"></label><label>배송 주소<textarea id="address" rows="2" placeholder="도로명주소 또는 지번주소"></textarea></label><div class="review-actions"><button id="cancelReview" class="secondary">취소</button><button id="saveStop" class="primary">주소 등록</button></div><small>OCR 결과는 틀릴 수 있으니 주소를 확인하세요.</small></section><div class="list-title"><b>등록된 배송 목록</b><span id="count">0건</span></div><div id="list" class="list"></div></section>
<section id="mapView" class="view" hidden><div id="map" class="map"></div><div id="mapFallback" class="map-fallback">지도를 불러오는 중…</div><div class="map-top"><button id="fitMap" class="secondary">전체 보기</button><button id="retryMap" class="secondary">지도 연결</button></div></section>
<nav class="dock"><button id="tabMap" data-tab="map">⌖<span>지도</span></button><button id="tabScan" data-tab="scan" class="active">▣<span>스캔</span></button></nav>
<div id="modal" class="overlay" hidden><div class="sheet"><div class="sheet-head"><b>배송 상세</b><button id="closeModal" aria-label="닫기">✕</button></div><div id="detail"></div><div class="sheet-actions"><button id="markPending" class="secondary">미배송</button><button id="markDone" class="primary">배송완료</button></div></div></div><div id="toast" role="status"></div></main></body></html>
