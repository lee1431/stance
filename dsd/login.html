<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1830"><title>Login | S21 Delivery Map</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f5fc;display:grid;place-items:center;min-height:100vh;font-family:system-ui,sans-serif;color:#20314c}.box{width:min(420px,calc(100vw - 28px));background:#fff;border:1px solid #e3eaf4;border-radius:16px;box-shadow:0 18px 60px #1b33501a;padding:28px}h1{font-size:25px;margin:0 0 7px}p{color:#61718a;font-size:13px;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:16px 0 5px}input{width:100%;padding:13px;border:1px solid #d1ddec;border-radius:8px;font:inherit}button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:8px;background:#246bff;color:white;font-weight:800;font:inherit;cursor:pointer}.error{background:#fff1ec;color:#ac362c;border-radius:7px;padding:10px;font-size:13px}</style></head>
<body><form method="post" action="login" class="box"><h1>배송지도 로그인</h1><p>S21 Flask · 사용자별 배송지 분리</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">사용자 아이디</label><input id="username" name="username" autocomplete="username" required autofocus>
<label for="password">비밀번호</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">로그인</button><p>계정은 관리자가 등록합니다.</p></form></body></html>
