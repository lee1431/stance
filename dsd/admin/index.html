<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F7F4">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>DSD | 센터 관리자</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css?v=3-simple-admin">
<script src="naver-map.js?v=1-dsd-admin" defer></script>
<script src="admin.js?v=7-fixed-excel-columns" defer></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="branding"><a href="../" class="home-link" aria-label="DSD 홈">D</a>
      <div><span class="eyebrow">DSD CENTER</span><h1>센터 관리자</h1></div>
    </div>
    <button id="logoutBtn" type="button" hidden>로그아웃</button>
  </header>

  <section id="authPanel" class="auth-panel">
    <h2>관리자 로그인</h2>
    <p>고정 관리자 계정으로 로그인합니다.</p>
    <form id="authForm">
      <label>관리자 ID
        <input id="adminId" type="text" value="admin" autocomplete="username" readonly required>
      </label>
      <label>관리자 비밀번호
        <input id="adminPassword" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary">관리자 로그인</button>
    </form>
    <p id="authError" class="error" role="alert"></p>
  </section>

  <main id="dashboard" hidden>
    <section class="toolbar">
      <div class="date-box"><label for="deliveryDate">배송일
        <input id="deliveryDate" type="date" required>
      </label><button id="refreshBtn" type="button">조회</button></div>
      <form id="importForm" class="import-box">
        <label for="excelFile" class="file-button">엑셀 선택</label>
        <input id="excelFile" type="file" accept=".xlsx,.xlsm,.xls,.csv" required>
        <span id="fileName" class="file-name">선택된 파일 없음</span>
        <button id="importBtn" class="primary" type="submit">엑셀 업로드</button>
      </form>
      <p id="importStatus" role="status">선택한 날짜의 모든 배송 물량을 저장하고 표시합니다.</p>
    </section>

    <section class="stat-grid" aria-label="배송 통계">
      <div><strong id="totalCount">0</strong><span>전체 배송</span></div>
      <div><strong id="mapCount">0</strong><span>지도 표시 물품</span></div>
      <div><strong id="missingCount">0</strong><span>위치 미확인</span></div>
      <div><strong id="markerCount">0</strong><span>배송지 마커</span></div>
    </section>

    <section class="map-panel">
      <div class="section-head">
        <div><h2>전체 배송 지도</h2><p>동일 장소에 여러 물품이 있으면 마커에 건수를 표시합니다.</p></div>
        <div class="map-actions">
          <button id="fitBtn" type="button">◎ 전체보기</button>
          <button id="geocodeBtn" type="button">주소 좌표 조회</button>
        </div>
      </div>
      <div class="map-stage">
        <div id="mapCanvas" class="map-canvas" aria-label="오늘의 전체 배송 지도"></div>
        <div id="mapPlaceholder" class="map-placeholder">로그인 후 배송지 지도를 표시합니다.</div>
      </div>
      <p id="mapNote" class="map-bottom">좌표가 확인되지 않은 배송은 아래 전체 목록에 표시됩니다.</p>
    </section>

    <section class="data-panel">
      <div class="section-head">
        <div><h2>당일 배송 목록</h2><p>엑셀의 원본 컬럼을 빠짐없이 표시합니다.</p></div>
        <div class="filters">
          <input id="searchInput" type="search" placeholder="송장·상호·주소 검색" aria-label="배송 목록 검색">
          <select id="filterSelect" aria-label="지도 위치 필터">
            <option value="all">전체</option>
            <option value="missing">위치 미확인</option>
            <option value="mapped">지도 표시</option>
          </select>
        </div>
      </div>
      <div class="table-scroll">
        <table id="rawTable">
          <thead id="rawHeader"><tr><th>배송 목록</th></tr></thead>
          <tbody id="rawBody"></tbody>
        </table>
      </div>
      <p id="tableInfo">원본 엑셀을 업로드하면 목록이 나타납니다.</p>
      <button id="showMoreBtn" type="button" hidden>250행 더 보기</button>
    </section>
  </main>
</div>
</body>
</html>
