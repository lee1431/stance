<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>이벤트 페이지</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      touch-action: manipulation;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      cursor: pointer;
    }

    #slider {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 300ms ease-in-out;
      pointer-events: none;
    }

    .slide.is-active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #fadeOverlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1000ms ease-in-out;
    }

    #fadeOverlay.is-dark {
      opacity: 1;
    }

    .loading,
    .empty-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      padding: 40px;
    }

    .touch-guide {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      padding: 14px 28px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.42);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      backdrop-filter: blur(8px);
      pointer-events: none;
      z-index: 2;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.54);
      padding: 40px;
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .modal-card {
      width: min(720px, 88vw);
      padding: 64px 48px 56px;
      border-radius: 36px;
      background: #fff;
      color: #111;
      text-align: center;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
      cursor: default;
      animation: modalIn 220ms ease-out;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(12px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-step {
      display: none;
    }

    .modal-step.is-active {
      display: block;
    }

    .modal-title {
      margin: 0 0 16px;
      font-size: clamp(34px, 5vw, 56px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.08;
    }

    .modal-desc {
      margin: 0 0 40px;
      font-size: clamp(20px, 2.5vw, 30px);
      font-weight: 600;
      color: #444;
      line-height: 1.35;
    }

    .event-button {
      width: 100%;
      min-height: 92px;
      border: 0;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: clamp(24px, 3vw, 38px);
      font-weight: 900;
      letter-spacing: -0.03em;
      cursor: pointer;
    }

    .event-button:active,
    .secondary-button:active {
      transform: scale(0.985);
    }

    .event-button:disabled,
    .secondary-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .qr-box {
      width: min(360px, 58vw);
      height: min(360px, 58vw);
      margin: 24px auto 20px;
      padding: 18px;
      border-radius: 28px;
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .qr-status {
      min-height: 32px;
      margin: 0 0 24px;
      color: #444;
      font-size: clamp(18px, 2.2vw, 26px);
      font-weight: 700;
      line-height: 1.35;
    }

    .secondary-button {
      width: 100%;
      min-height: 72px;
      border: 0;
      border-radius: 999px;
      background: #e9e9e9;
      color: #111;
      font-size: clamp(20px, 2.4vw, 30px);
      font-weight: 900;
      cursor: pointer;
    }

    .status {
      position: fixed;
      right: 16px;
      bottom: 12px;
      z-index: 30;
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="slider">
      <div class="loading">이벤트 이미지를 불러오는 중입니다.</div>
    </div>

    <div id="fadeOverlay" aria-hidden="true"></div>

    <div class="touch-guide">화면을 터치해 이벤트에 참여하세요</div>
  </main>

  <section id="eventModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="joinStep" class="modal-step is-active">
        <h1 id="modalTitle" class="modal-title">이벤트에 참여하시겠어요?</h1>
        <p class="modal-desc">
          아래 버튼을 누르면 QR 코드가 표시됩니다.
        </p>

        <button id="joinButton" class="event-button" type="button">
          이벤트 참여하기
        </button>
      </div>

      <div id="qrStep" class="modal-step">
        <h1 class="modal-title">QR 코드를 스캔해주세요</h1>
        <p class="modal-desc">
          참여자 스마트폰에서 Google 인증을 진행합니다.
        </p>

        <div class="qr-box">
          <img id="qrImage" alt="이벤트 참여 QR 코드" />
        </div>

        <p id="qrStatus" class="qr-status">
          QR 코드를 생성하는 중입니다.
        </p>

        <button id="cancelQrButton" class="secondary-button" type="button">
          처음으로 돌아가기
        </button>
      </div>

      <div id="completeStep" class="modal-step">
        <h1 class="modal-title">인증이 완료되었습니다</h1>
        <p class="modal-desc">
          참여자 스마트폰에서 카드 3장 중 하나를 선택해주세요.
        </p>
      </div>
    </div>
  </section>

  <div id="status" class="status"></div>

  <script>
    const CONFIG_JSON_URL = "https://mrdindoin.ddns.net/jsonhub/api/json/localflow/event";

    const DEFAULT_ROTATION_INTERVAL = 7000;
    const DEFAULT_MODAL_AUTO_CLOSE = 15000;
    const JSON_RELOAD_INTERVAL = 60000;

    const FADE_OUT_TIME = 1000;
    const BLACK_HOLD_TIME = 350;
    const FADE_IN_TIME = 1000;

    const app = document.getElementById("app");
    const slider = document.getElementById("slider");
    const fadeOverlay = document.getElementById("fadeOverlay");
    const modal = document.getElementById("eventModal");
    const joinButton = document.getElementById("joinButton");
    const statusEl = document.getElementById("status");

    const joinStep = document.getElementById("joinStep");
    const qrStep = document.getElementById("qrStep");
    const completeStep = document.getElementById("completeStep");
    const qrImage = document.getElementById("qrImage");
    const qrStatus = document.getElementById("qrStatus");
    const cancelQrButton = document.getElementById("cancelQrButton");

    let slides = [];
    let currentIndex = 0;
    let sliderTimer = null;
    let jsonReloadTimer = null;
    let modalTimer = null;
    let slideChangeTimer1 = null;
    let slideChangeTimer2 = null;
    let slideChangeTimer3 = null;

    let rotationInterval = DEFAULT_ROTATION_INTERVAL;
    let modalAutoClose = DEFAULT_MODAL_AUTO_CLOSE;
    let participationUrl = "https://llsshh.com/event.html";

    let qrSessionApi = "/api/event-session";
    let qrStatusApiBase = "/api/event-session";
    let qrPollInterval = 1500;
    let qrSessionTimeout = 300000;

    let activeEventSessionId = null;
    let qrPollTimer = null;
    let qrExpireTimer = null;
    let isCreatingQr = false;
    let isSlideChanging = false;

    let lastConfigSignature = "";
    let wakeLock = null;
    let hasUserActivated = false;

    async function loadEventConfig() {
      try {
        const url = CONFIG_JSON_URL + "?t=" + Date.now();

        const response = await fetch(url, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("JSON 로딩 실패: " + response.status);
        }

        const config = await response.json();
        applyConfig(config);
        updateStatus("JSON updated");
      } catch (error) {
        console.error(error);
        updateStatus("JSON load failed");

        if (slides.length === 0) {
          renderEmptyMessage("이벤트 정보를 불러오지 못했습니다.");
        }
      }
    }

    function applyConfig(config) {
      const normalizedConfig = normalizeConfig(config || {});
      const signature = JSON.stringify(normalizedConfig);

      if (signature === lastConfigSignature) {
        return;
      }

      lastConfigSignature = signature;

      rotationInterval = normalizedConfig.rotationInterval;
      modalAutoClose = normalizedConfig.modalAutoClose;
      participationUrl = normalizedConfig.participationUrl;

      qrSessionApi = normalizedConfig.auth.sessionCreateUrl;
      qrStatusApiBase = normalizedConfig.auth.statusUrlBase;
      qrPollInterval = normalizedConfig.auth.pollInterval;
      qrSessionTimeout = normalizedConfig.auth.qrExpireSeconds * 1000;

      joinButton.textContent = normalizedConfig.buttonText;

      renderSlides(normalizedConfig.slides);

      if (isModalOpen()) {
        stopSlider();
      } else {
        startSlider();
      }
    }

    function normalizeConfig(config) {
      const rawSlides = Array.isArray(config.slides) ? config.slides : [];
      const rawAuth = config.auth || {};

      const enabledSlides = rawSlides
        .filter((slide) => slide && slide.enabled !== false && slide.imageUrl)
        .sort((a, b) => {
          const sortA = Number(a.sort || 0);
          const sortB = Number(b.sort || 0);
          return sortA - sortB;
        })
        .map((slide, index) => ({
          id: String(slide.id || "slide-" + (index + 1)),
          title: String(slide.title || ""),
          imageUrl: String(slide.imageUrl),
          alt: String(slide.alt || slide.title || "이벤트 이미지 " + (index + 1)),
          sort: Number(slide.sort || index + 1)
        }));

      return {
        rotationInterval: Number(config.rotationInterval || DEFAULT_ROTATION_INTERVAL),
        modalAutoClose: Number(config.modalAutoClose || DEFAULT_MODAL_AUTO_CLOSE),
        buttonText: String(config.buttonText || "이벤트 참여하기"),
        participationUrl: String(config.participationUrl || "https://llsshh.com/event.html"),
        auth: {
          sessionCreateUrl: String(rawAuth.sessionCreateUrl || "/api/event-session"),
          statusUrlBase: String(rawAuth.statusUrlBase || "/api/event-session"),
          pollInterval: Number(rawAuth.pollInterval || 1500),
          qrExpireSeconds: Number(rawAuth.qrExpireSeconds || 300)
        },
        slides: enabledSlides
      };
    }

    function renderSlides(slideItems) {
      stopSlider();
      clearSlideChangeTimers();

      if (!slideItems.length) {
        renderEmptyMessage("등록된 이벤트 이미지가 없습니다.");
        return;
      }

      slider.innerHTML = "";

      slideItems.forEach((item, index) => {
        const slide = document.createElement("div");
        slide.className = "slide";

        if (index === 0) {
          slide.classList.add("is-active");
        }

        const img = document.createElement("img");
        img.src = item.imageUrl;
        img.alt = item.alt;
        img.draggable = false;
        img.decoding = "async";
        img.loading = index === 0 ? "eager" : "lazy";

        slide.appendChild(img);
        slider.appendChild(slide);
      });

      slides = Array.from(document.querySelectorAll(".slide"));
      currentIndex = 0;
      preloadImages(slideItems.map((item) => item.imageUrl));
    }

    function renderEmptyMessage(message) {
      stopSlider();
      clearSlideChangeTimers();

      slides = [];
      currentIndex = 0;

      slider.innerHTML = '<div class="empty-message">' + escapeHtml(message) + '</div>';
    }

    function preloadImages(urls) {
      urls.forEach((url) => {
        const image = new Image();
        image.src = url;
      });
    }

    function showSlide(nextIndex) {
      if (isSlideChanging) return;
      if (slides.length === 0) return;
      if (!slides[currentIndex] || !slides[nextIndex]) return;
      if (currentIndex === nextIndex) return;

      isSlideChanging = true;
      fadeOverlay.classList.add("is-dark");

      slideChangeTimer1 = window.setTimeout(() => {
        slides[currentIndex].classList.remove("is-active");
        slides[nextIndex].classList.add("is-active");
        currentIndex = nextIndex;

        slideChangeTimer2 = window.setTimeout(() => {
          fadeOverlay.classList.remove("is-dark");

          slideChangeTimer3 = window.setTimeout(() => {
            isSlideChanging = false;
          }, FADE_IN_TIME);
        }, BLACK_HOLD_TIME);
      }, FADE_OUT_TIME);
    }

    function clearSlideChangeTimers() {
      [slideChangeTimer1, slideChangeTimer2, slideChangeTimer3].forEach((timer) => {
        if (timer) {
          window.clearTimeout(timer);
        }
      });

      slideChangeTimer1 = null;
      slideChangeTimer2 = null;
      slideChangeTimer3 = null;
      isSlideChanging = false;
      fadeOverlay.classList.remove("is-dark");
    }

    function nextSlide() {
      if (slides.length <= 1) return;

      const nextIndex = (currentIndex + 1) % slides.length;
      showSlide(nextIndex);
    }

    function startSlider() {
      stopSlider();

      if (slides.length <= 1) {
        return;
      }

      sliderTimer = window.setInterval(nextSlide, rotationInterval);
    }

    function stopSlider() {
      if (sliderTimer) {
        window.clearInterval(sliderTimer);
        sliderTimer = null;
      }
    }

    function startJsonReload() {
      stopJsonReload();

      jsonReloadTimer = window.setInterval(() => {
        loadEventConfig();
      }, JSON_RELOAD_INTERVAL);
    }

    function stopJsonReload() {
      if (jsonReloadTimer) {
        window.clearInterval(jsonReloadTimer);
        jsonReloadTimer = null;
      }
    }

    function isModalOpen() {
      return modal.classList.contains("is-open");
    }

    function openModal() {
      stopSlider();
      clearModalTimer();
      resetQrState();

      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");

      modalTimer = window.setTimeout(() => {
        closeModal();
      }, modalAutoClose);
    }

    function closeModal() {
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");

      clearModalTimer();
      resetQrState();
      startSlider();
    }

    function clearModalTimer() {
      if (modalTimer) {
        window.clearTimeout(modalTimer);
        modalTimer = null;
      }
    }

    function setModalStep(stepName) {
      joinStep.classList.remove("is-active");
      qrStep.classList.remove("is-active");
      completeStep.classList.remove("is-active");

      if (stepName === "join") {
        joinStep.classList.add("is-active");
      }

      if (stepName === "qr") {
        qrStep.classList.add("is-active");
      }

      if (stepName === "complete") {
        completeStep.classList.add("is-active");
      }
    }

    function resetQrState() {
      stopQrPolling();
      clearQrExpireTimer();

      activeEventSessionId = null;
      isCreatingQr = false;

      qrImage.removeAttribute("src");
      qrStatus.textContent = "QR 코드를 생성하는 중입니다.";
      joinButton.disabled = false;
      cancelQrButton.disabled = false;

      setModalStep("join");
    }

    async function createQrSession() {
      if (isCreatingQr) return;

      isCreatingQr = true;
      joinButton.disabled = true;
      cancelQrButton.disabled = true;

      clearModalTimer();
      clearQrExpireTimer();

      setModalStep("qr");
      qrStatus.textContent = "QR 코드를 생성하는 중입니다.";

      try {
        const response = await fetch(qrSessionApi, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          cache: "no-store",
          body: JSON.stringify({
            source: "tablet-event-page",
            pageUrl: window.location.href,
            createdAt: new Date().toISOString()
          })
        });

        if (!response.ok) {
          throw new Error("QR 세션 생성 실패: " + response.status);
        }

        const data = await response.json();
        const qrSource = data.qrImageDataUrl || data.qrDataUrl || data.qrImageUrl;

        if (!data.ok || !data.sid || !qrSource) {
          throw new Error("QR 세션 응답 형식이 올바르지 않습니다.");
        }

        activeEventSessionId = data.sid;
        qrImage.src = qrSource;
        qrStatus.textContent = "스마트폰 카메라로 QR 코드를 스캔해주세요.";
        cancelQrButton.disabled = false;

        startQrPolling();

        qrExpireTimer = window.setTimeout(() => {
          qrStatus.textContent = "QR 코드 유효 시간이 만료되었습니다. 다시 시도해주세요.";
          stopQrPolling();
        }, qrSessionTimeout);
      } catch (error) {
        console.error(error);
        qrStatus.textContent = "QR 코드를 생성하지 못했습니다. 다시 시도해주세요.";
        cancelQrButton.disabled = false;
      } finally {
        isCreatingQr = false;
        joinButton.disabled = false;
      }
    }

    function startQrPolling() {
      stopQrPolling();

      qrPollTimer = window.setInterval(() => {
        pollQrStatus();
      }, qrPollInterval);

      pollQrStatus();
    }

    function stopQrPolling() {
      if (qrPollTimer) {
        window.clearInterval(qrPollTimer);
        qrPollTimer = null;
      }
    }

    function clearQrExpireTimer() {
      if (qrExpireTimer) {
        window.clearTimeout(qrExpireTimer);
        qrExpireTimer = null;
      }
    }

    async function pollQrStatus() {
      if (!activeEventSessionId) return;

      try {
        const url = qrStatusApiBase.replace(/\/$/, "") + "/" + encodeURIComponent(activeEventSessionId) + "?t=" + Date.now();

        const response = await fetch(url, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("상태 확인 실패: " + response.status);
        }

        const data = await response.json();

        if (!data.ok) {
          throw new Error("상태 확인 응답이 올바르지 않습니다.");
        }

        if (data.status === "pending") {
          qrStatus.textContent = "스마트폰 스캔을 기다리는 중입니다.";
          return;
        }

        if (data.status === "scanned") {
          qrStatus.textContent = "Google 인증을 진행 중입니다.";
          return;
        }

        if (data.status === "authenticated" || data.status === "card_selected" || data.status === "completed") {
          showQrComplete();
          return;
        }

        if (data.status === "expired") {
          qrStatus.textContent = "QR 코드가 만료되었습니다. 다시 시도해주세요.";
          stopQrPolling();
          clearQrExpireTimer();
          return;
        }
      } catch (error) {
        console.warn(error);
      }
    }

    function showQrComplete() {
      stopQrPolling();
      clearQrExpireTimer();

      setModalStep("complete");

      window.setTimeout(() => {
        closeModal();
      }, 5000);
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (error) {
        console.warn("Wake Lock 실패:", error);
      }
    }

    async function requestFullscreen() {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.warn("Fullscreen 실패:", error);
      }
    }

    async function activateKioskHelpers() {
      if (hasUserActivated) return;

      hasUserActivated = true;
      await requestWakeLock();
      await requestFullscreen();
    }

    function updateStatus(message) {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");

      statusEl.textContent = message + " " + hh + ":" + mm + ":" + ss;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    app.addEventListener("pointerdown", async () => {
      await activateKioskHelpers();
      openModal();
    });

    modal.addEventListener("pointerdown", (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    joinButton.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
    });

    joinButton.addEventListener("click", async (event) => {
      event.stopPropagation();
      await createQrSession();
    });

    cancelQrButton.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
    });

    cancelQrButton.addEventListener("click", (event) => {
      event.stopPropagation();
      resetQrState();

      clearModalTimer();
      modalTimer = window.setTimeout(() => {
        closeModal();
      }, modalAutoClose);
    });

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible") {
        loadEventConfig();

        if (hasUserActivated) {
          await requestWakeLock();
        }
      }
    });

    window.addEventListener("load", () => {
      loadEventConfig();
      startJsonReload();
    });
  </script>
</body>
</html>
