<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:,">
  <title>QR Google 인증 테스트</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #22315c 0, #080b16 58%, #000 100%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      padding: 34px 28px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      text-align: center;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(16px);
    }
    h1 { margin: 0 0 12px; font-size: 32px; letter-spacing: -0.04em; }
    p { margin: 0 0 24px; color: rgba(255,255,255,.72); font-size: 17px; font-weight: 700; line-height: 1.5; }
    button {
      width: 100%;
      min-height: 68px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
    }
    button:active { transform: scale(.985); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .qr-wrap { display: none; margin-top: 28px; }
    .qr-box {
      width: 280px;
      height: 280px;
      margin: 0 auto 18px;
      padding: 16px;
      border-radius: 24px;
      background: white;
    }
    .qr-box img { width: 100%; height: 100%; display: block; }
    .status { min-height: 26px; color: rgba(255,255,255,.8); font-size: 16px; font-weight: 800; }
    .link { margin-top: 12px; font-size: 13px; word-break: break-all; color: rgba(255,255,255,.45); }
  </style>
</head>
<body>
  <main class="card">
    <h1>QR Google 인증 테스트</h1>
    <p>
      버튼을 누르면 QR이 생성됩니다.<br>
      스마트폰 인증이 끝나면 태블릿이 자동으로 카드 페이지로 이동합니다.
    </p>

    <button id="startButton" type="button">QR 생성하기</button>

    <section id="qrWrap" class="qr-wrap">
      <div class="qr-box">
        <img id="qrImage" alt="QR 코드" />
      </div>
      <div id="status" class="status">QR 생성을 기다리는 중입니다.</div>
      <div id="rawLink" class="link"></div>
    </section>
  </main>

  <script>
    const API_BASE = "https://localflow.ddns.net/qr/api";

    const startButton = document.getElementById("startButton");
    const qrWrap = document.getElementById("qrWrap");
    const qrImage = document.getElementById("qrImage");
    const statusEl = document.getElementById("status");
    const rawLink = document.getElementById("rawLink");

    let activeSid = null;
    let pollTimer = null;

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    async function startQr() {
      stopPolling();
      startButton.disabled = true;
      statusEl.textContent = "QR 생성 중입니다.";
      qrWrap.style.display = "block";
      rawLink.textContent = "";

      try {
        const response = await fetch(API_BASE + "/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({
            source: "github-pages-tablet-event",
            pageUrl: location.href,
            createdAt: new Date().toISOString()
          })
        });

        if (!response.ok) throw new Error("QR 생성 실패: " + response.status);

        const data = await response.json();
        if (!data.ok || !data.sid || !data.authUrl) throw new Error("응답 형식 오류");

        activeSid = data.sid;
        qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=" + encodeURIComponent(data.authUrl);
        rawLink.textContent = data.authUrl;
        statusEl.textContent = "휴대폰으로 QR을 스캔해주세요.";

        pollTimer = setInterval(checkStatus, 1500);
        checkStatus();
      } catch (error) {
        console.error(error);
        statusEl.textContent = "QR 생성에 실패했습니다.";
        startButton.disabled = false;
      }
    }

    async function checkStatus() {
      if (!activeSid) return;

      try {
        const response = await fetch(API_BASE + "/status/" + encodeURIComponent(activeSid) + "?t=" + Date.now(), {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) throw new Error("상태 확인 실패: " + response.status);

        const data = await response.json();

        if (data.status === "pending") {
          statusEl.textContent = "휴대폰 스캔을 기다리는 중입니다.";
          return;
        }

        if (data.status === "scanned") {
          statusEl.textContent = "휴대폰에서 Google 인증 화면이 열렸습니다.";
          return;
        }

        if (data.status === "authenticated") {
          statusEl.textContent = "인증 완료. 카드 선택 페이지로 이동합니다.";
          stopPolling();
          setTimeout(() => {
            location.href = data.tabletCardUrl;
          }, 700);
          return;
        }

        if (data.status === "card_selected") {
          statusEl.textContent = "카드 선택 완료!";
          stopPolling();
          startButton.disabled = false;
          return;
        }

        if (data.status === "expired") {
          statusEl.textContent = "QR이 만료되었습니다. 다시 생성해주세요.";
          stopPolling();
          startButton.disabled = false;
          return;
        }
      } catch (error) {
        console.warn(error);
      }
    }

    startButton.addEventListener("click", startQr);
  </script>
</body>
</html>
